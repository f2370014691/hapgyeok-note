<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121220" media="(prefers-color-scheme: dark)">
<title>유아임용 합격노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>/* ===== 합격노트 v4 · 한눈에 보는 구조 ===== */
:root{
  color-scheme:light;
  --bg:#F5F5F9;--surface:#FFFFFF;--sunk:#EFEFF5;--hover:#F3F3F8;
  --ink:#1B1B27;--ink-2:#545468;--ink-3:#9192A6;--line:#E7E7EF;--line-2:#D9D9E4;
  --pri:#4F46E5;--pri-2:#4338CA;--pri-s:#EEEDFD;
  --c0:#E8507F;--c0-s:#FDEDF2;--c1:#2F7BF0;--c1-s:#E8F1FE;--c2:#8452F2;--c2-s:#F2ECFE;
  --good:#14A077;--good-s:#E2F5EE;--mid:#EE9C0A;--mid-s:#FEF3DC;--bad:#EC5555;--bad-s:#FDEBEB;
  --hl:#FFE88A;
  --r:18px;--r-md:14px;
  --sh:0 1px 2px rgba(20,20,50,.04),0 3px 12px rgba(20,20,50,.05);
  --sh-lg:0 2px 6px rgba(20,20,50,.05),0 14px 36px rgba(20,20,50,.09);
  --f:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --side:256px;
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#111120;--surface:#1A1A2B;--sunk:#232337;--hover:#22223A;
  --ink:#EDEDF6;--ink-2:#B5B5CA;--ink-3:#7E7E97;--line:#29293F;--line-2:#35354E;
  --pri:#7C74F5;--pri-2:#6A61F0;--pri-s:#29264B;
  --c0:#F27BA2;--c0-s:#3A2131;--c1:#66A2FB;--c1-s:#1B2B45;--c2:#A787FA;--c2-s:#2A2247;
  --good:#35C190;--good-s:#173529;--mid:#F5B43A;--mid-s:#3A2E14;--bad:#F27373;--bad-s:#3D1F22;--hl:#6B5A12;
  --sh:0 1px 2px rgba(0,0,0,.35);--sh-lg:0 8px 28px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#111120;--surface:#1A1A2B;--sunk:#232337;--hover:#22223A;
  --ink:#EDEDF6;--ink-2:#B5B5CA;--ink-3:#7E7E97;--line:#29293F;--line-2:#35354E;
  --pri:#7C74F5;--pri-2:#6A61F0;--pri-s:#29264B;
  --c0:#F27BA2;--c0-s:#3A2131;--c1:#66A2FB;--c1-s:#1B2B45;--c2:#A787FA;--c2-s:#2A2247;
  --good:#35C190;--good-s:#173529;--mid:#F5B43A;--mid-s:#3A2E14;--bad:#F27373;--bad-s:#3D1F22;--hl:#6B5A12;
  --sh:0 1px 2px rgba(0,0,0,.35);--sh-lg:0 8px 28px rgba(0,0,0,.4);}}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.center{text-align:center}
.ic{flex:none;display:block}
.loading{text-align:center;color:var(--ink-3);padding:120px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.sp{flex:1}
em{font-style:normal;color:var(--bad)}

/* ---------- 틀: 컴퓨터 왼쪽 메뉴 / 휴대폰 위·아래 막대 ---------- */
.shell{display:block}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top:empty{display:none}
.tin{padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-weight:800;font-size:17px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#F178A0,#7C6CF6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(124,108,246,.3)}
.logo.xl{width:64px;height:64px;border-radius:20px;font-size:28px;margin:0 auto}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.wait i{background:var(--mid)}.sync.err i,.sync.big i{background:var(--bad)}
.sync.err,.sync.big{color:var(--bad)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;padding:0;flex:none}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.iconbtn:disabled{opacity:.3}
.iconbtn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.iconbtn.sm{width:30px;height:30px;border-radius:9px}
.tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar:empty{display:none}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 0}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar .dl{width:22px;height:22px;font-size:12px;border-radius:7px;opacity:.5}
.tabbar button[aria-current="page"] .dl{opacity:1}
main{padding:20px 16px 100px;min-width:0}
body.focus main,body.locked main{padding-bottom:24px}
@media (min-width:1024px){
  .top,.tabbar{display:none!important}
  .shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
  body.focus .shell,body.locked .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 12px;border-right:1px solid var(--line);background:var(--surface)}
  .side:empty{display:none}
  main{padding:28px 32px 60px}
}
.side .brand{padding:4px 8px 14px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink-2);text-align:left}
.snav button:hover{background:var(--hover);color:var(--ink)}
.snav button[aria-current="page"]{background:var(--pri-s);color:var(--pri)}
.slbl{font-size:12px;font-weight:700;color:var(--ink-3);padding:16px 10px 6px}
.sdoc{border-radius:12px}
.sdh{display:flex;align-items:center}
.sdn{flex:1;display:flex;align-items:center;gap:9px;border:0;background:none;padding:7px 8px;border-radius:10px;text-align:left;min-width:0}
.sdn b{flex:1;font-size:15px}
.sdn .num{font-size:13px;font-weight:700;color:var(--dc)}
.sdn:hover{background:var(--hover)}
.sdn[aria-current="page"]{background:var(--ds)}
.sdt{transition:transform .15s;color:var(--ink-3)}
.sdoc.open .sdt{transform:rotate(90deg)}
.sbig{display:none;flex-direction:column;padding:2px 0 8px 18px;margin-left:14px;border-left:2px solid var(--ds)}
.sdoc.open .sbig{display:flex}
.sbig button{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 3px;gap:2px 6px;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;font-size:13.5px;color:var(--ink-2)}
.sbig button:hover{background:var(--hover);color:var(--ink)}
.sbig button[aria-current="page"]{background:var(--ds);color:var(--ink);font-weight:700}
.sbn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--mid) 60%,var(--ink));background:var(--mid-s);border-radius:99px;padding:0 6px;line-height:18px;align-self:center}
.sbp{grid-column:1/-1;height:3px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sbp i{display:block;height:100%;background:var(--dc)}
.sfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 8px 0;border-top:1px solid var(--line)}

/* ---------- 공통 ---------- */
.page{max-width:880px;margin:0 auto}
.page.wide{max-width:1180px}
.page.narrow{max-width:620px}
.ptitle{font-size:26px;margin:4px 0 18px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.ph{font-size:14px;color:var(--ink-3);font-weight:700;margin-bottom:12px}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:28px 2px 12px}
.sechd h2{font-size:18px}
.more{display:inline-flex;align-items:center;gap:2px;color:var(--pri);font-weight:600;font-size:14px}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin:0 2px 12px}
.crumb a:hover{color:var(--ink)}
.crumb span{color:var(--ink-2);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 16px;font-weight:600;font-size:15px;line-height:1.2;transition:background .15s,transform .05s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--pri-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)}.bar .l{background:var(--mid)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.g2{background:var(--good)}.dot.g1{background:var(--mid)}.dot.g0{background:var(--bad)}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .r0{stroke:var(--sunk)}.ring .r1{stroke:var(--good)}.ring .r2{stroke:var(--mid)}
.rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rl b{font-size:20px;font-weight:800}
.rl small{font-size:12px;color:var(--ink-3);margin-top:3px}
.dl{width:28px;height:28px;border-radius:9px;background:var(--dc);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.dl.big{width:52px;height:52px;border-radius:16px;font-size:22px}
.no{width:32px;height:32px;border-radius:10px;background:var(--ds);color:var(--dc);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.no.big{width:auto;min-width:52px;height:52px;padding:0 10px;border-radius:16px;font-size:19px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap}
.tag.new{background:var(--pri-s);color:var(--pri)}
.tag.box{background:var(--good-s);color:var(--good)}
.tag.lapse{background:var(--bad-s);color:var(--bad)}
.tag.gtag{background:var(--mid-s);color:color-mix(in srgb,var(--mid) 65%,var(--ink))}
.empty{text-align:center;color:var(--ink-3);padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.panel.empty{padding:28px 16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:14px;font-size:15px;font-weight:600;z-index:70;box-shadow:var(--sh-lg);max-width:calc(100% - 32px);animation:pop .2s ease}
@media (min-width:1024px){.toast{bottom:28px}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--ink-2);-webkit-user-select:none;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+i{background:var(--pri)}
.switch input:checked+i::after{transform:translateX(16px)}
.seg2{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg2.big{margin-bottom:16px}.seg2.big button{padding:8px 16px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tchip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:color-mix(in srgb,var(--dc) 12%,transparent);color:color-mix(in srgb,var(--dc) 80%,var(--ink));white-space:nowrap}
.ychip{border:0;font-size:11.5px;font-weight:800;border-radius:7px;padding:1px 7px;background:var(--mid-s);color:color-mix(in srgb,var(--mid) 60%,var(--ink))}
.ychip:hover{filter:brightness(.95)}

/* ---------- 홈 ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 2px 18px;flex-wrap:wrap}
.hello p{font-size:14px;margin-bottom:2px}
.hello h1{font-size:26px}
.dchip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);box-shadow:var(--sh);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink-2)}
.dchip b{color:var(--pri);font-size:15px}
.dchip.ghost{background:none;box-shadow:none;border:1px dashed var(--line-2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
.today{display:flex;flex-direction:column}
.tnum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tnum button{border:0;background:var(--sunk);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column}
.tnum button:hover:not(:disabled){background:var(--hover)}
.tnum button:disabled{opacity:.55}
.tnum b{color:var(--ink);font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.tnum span{font-size:13px;color:var(--ink-2)}
.tmini{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--ink-3)}
.tmini span{display:flex;align-items:center;gap:5px}.tmini b{color:var(--ink)}
.pr{display:flex;align-items:center;gap:18px}
.pdocs{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pdoc{display:grid;grid-template-columns:1fr auto;gap:4px 8px;border:0;background:none;padding:6px 8px;border-radius:10px;text-align:left}
.pdoc:hover{background:var(--hover)}
.pdn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pdn .dl{width:22px;height:22px;font-size:12px;border-radius:7px}
.pdoc .num{font-weight:800;color:var(--dc);font-size:14px}
.pdoc .bar{grid-column:1/-1}
.pdoc .bar .k{background:var(--dc)}.pdoc .bar .l{background:color-mix(in srgb,var(--dc) 35%,transparent)}
.week{display:flex;gap:8px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3)}
.week i{display:block;width:100%;max-width:30px;border-radius:6px;background:var(--pri-s)}
.week .on i{background:var(--pri)}
.week small{font-size:11px}.week .on small{color:var(--ink);font-weight:700}
/* 출제 지도 */
.mleg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;margin:-4px 2px 12px}
.sechd .mleg{margin:0}
.mleg>i{width:16px;height:12px;border-radius:4px;border:1px solid var(--line)}
.mleg .sep{width:10px}
.mleg .lb{display:inline-flex;align-items:center;gap:4px}.mleg .lb i{width:12px;height:4px;border-radius:99px}
.mleg .lb .k{background:var(--good)}.mleg .lb .l{background:var(--mid)}
.mleg .h0,.tile.h0{background:var(--surface)}
.mleg .h1,.tile.h1{background:color-mix(in srgb,var(--mid) 10%,var(--surface))}
.mleg .h2,.tile.h2{background:color-mix(in srgb,var(--mid) 20%,var(--surface))}
.mleg .h3,.tile.h3{background:color-mix(in srgb,var(--mid) 32%,var(--surface))}
.mleg .h4,.tile.h4{background:color-mix(in srgb,var(--mid) 46%,var(--surface))}
.mapsec{margin-bottom:16px}
.mapsec h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 2px 8px}
.mapsec h3 .more{margin-left:auto;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.tiles.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s;min-width:0}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.tn{font-weight:700;font-size:14.5px;line-height:1.35}
.tiles.big .tn{font-size:16px}
.tm{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
.tm .num{font-weight:800;color:var(--ink-2)}
.tq{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--mid) 60%,var(--ink));white-space:nowrap}
.tq.none{color:var(--ink-3);font-weight:500}
.ts{font-size:12px;color:var(--ink-3)}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}}
.toplist{padding:6px}
.tr2{width:100%;display:grid;grid-template-columns:28px 1fr auto 110px;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:12px;text-align:left}
.tr2:hover{background:var(--hover)}
.tr2+.tr2{border-top:1px solid var(--line)}
.rk{font-weight:800;color:var(--ink-3);text-align:center}
.trn{min-width:0}.trn b{display:block;font-size:15px;font-weight:700}.trn small{font-size:12px;color:var(--ink-3)}
.trp{display:flex;align-items:center;gap:6px}.trp .bar{flex:1}.trp small{font-size:12px;color:var(--ink-3);width:30px;text-align:right}
@media (max-width:560px){.tr2{grid-template-columns:24px 1fr auto}.trp{display:none}}

/* ---------- 과목·주제 머리 ---------- */
.hero2{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px 18px;align-items:center;position:relative;overflow:hidden}

   유아임용 합격노트 v3 — 민쌤 시험장용 요약 플래시카드
   데이터(로그인 후 복호화) → 진도 저장(기기+Firebase) → 화면 → 로그인
   ================================================================ */

/* ---------- 데이터 ---------- */
// 카드: [id, 과목번호, 쪽, 대주제, 소주제, 질문, 답, 세부 주제]
let DOCS=[],C=[],CH=[];   // CH[d] = 대주제 [{name, topics:소주제[{name, idx:[]}], idx:[]}]
const DC=["var(--c0)","var(--c1)","var(--c2)"],DCS=["var(--c0-s)","var(--c1-s)","var(--c2-s)"];
let TAX=null;  // tax.json: 대주제·소주제 분류표 {n:["대|소",...], m:{카드id:번호}}
function indexData(b){
  DOCS=b.docs;C=b.cards;CH=DOCS.map(()=>[]);
  if(TAX)C.forEach(c=>{const k=TAX.m[c[0]];if(k==null)return;const [big,small]=TAX.n[k].split("|");if(c.length<8)c[7]=c[4];c[3]=big;c[4]=small;});
  const cm=DOCS.map(()=>({}));
  C.forEach((c,i)=>{
    const d=c[1];let ch=cm[d][c[3]];
    if(!ch){ch=cm[d][c[3]]={name:c[3],topics:[],tm:{},idx:[]};CH[d].push(ch);}
    let tp=ch.tm[c[4]];if(!tp){tp=ch.tm[c[4]]={name:c[4],idx:[]};ch.topics.push(tp);}
    ch.idx.push(i);tp.idx.push(i);
  });
}

/* ---------- 상태 ---------- */
const BASE="yuah-imyong-v2";            // 로그인 열쇠 보관 이름 (예전과 같게 → 자동 로그인 유지)
const SBASE="hapgyeok-flash-v1";
let ME=null,KEY=SBASE+":guest";
const blank=()=>({v:1,srs:{},log:{},exam:"",newN:20,shuf:false,updatedAt:0});
let S=blank();
function adopt(o){S=Object.assign(blank(),o||{});if(S.v!==1)S=blank();}
const pad=n=>String(n).padStart(2,"0");
function today(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
const EPOCH=Date.UTC(2026,0,1);
const dn=(d=new Date())=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5);
const dnToDate=n=>new Date(EPOCH+n*864e5);

/* 간격 반복: srs[id]=[상자(1~6), 다음 날짜번호, 틀린 횟수] */
const IV=[0,0,1,3,7,14,30];
const ss=i=>S.srs[C[i][0]];
const isNew=i=>!ss(i);
const isDue=i=>{const x=ss(i);return !!x&&x[1]<=dn();};
const isMastered=i=>{const x=ss(i);return !!x&&x[0]>=4;};
const isWrong=i=>{const x=ss(i);return !!x&&x[2]>0;};
function grade(i,g){
  const id=C[i][0],x=S.srs[id],t=dn();
  let b=x?x[0]:0,l=x?x[2]:0;
  if(g===0){b=1;l++;}
  else if(g===1){b=Math.max(1,Math.min(b,3));}
  else b=Math.min(6,Math.max(2,b+1));
  S.srs[id]=[b,t+(g===0?0:g===1?1:IV[b]),l];
  const k=today();S.log[k]=(S.log[k]||0)+1;
}
function counts(idx){let k=0,l=0,n=0,due=0;const t=dn();for(const i of idx){const x=ss(i);if(!x)n++;else{if(x[0]>=4)k++;else l++;if(x[1]<=t)due++;}}return{k,l,n,due,all:idx.length};}
function streak(){let n=0,d=new Date();if(!S.log[today(d)])d.setDate(d.getDate()-1);while(S.log[today(d)]){n++;d.setDate(d.getDate()-1);}return n;}

/* ---------- 저장: 이 기기 + Firebase ---------- */
let saveTimer=null,cloudBusy=false,cloudDirty=false,cloudState="";
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  cloudDirty=true;setSync("wait");
  clearTimeout(saveTimer);saveTimer=setTimeout(cloudFlush,1500);
}
async function packJSON(o){const gz=new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());let s="";for(let i=0;i<gz.length;i+=8192)s+=String.fromCharCode(...gz.subarray(i,i+8192));const b=btoa(s);if(b.length>1000000)throw new Error("too-large");return b;}
async function unpackDoc(d){if(!d||!d.gz)return null;const b=Uint8Array.from(atob(d.gz),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text());}
const flashRef=()=>FB.doc(FB.db,"users",ME.uid,"data","flash");
async function cloudFlush(){
  if(!FB||!ME||cloudBusy||!cloudDirty)return;
  cloudBusy=true;cloudDirty=false;
  try{await FB.setDoc(flashRef(),{gz:await packJSON(S),updatedAt:S.updatedAt});setSync(cloudDirty?"wait":"ok");}
  catch(err){cloudDirty=true;setSync(err&&err.message==="too-large"?"big":"err");setTimeout(cloudFlush,15000);}
  cloudBusy=false;if(cloudDirty)setTimeout(cloudFlush,300);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")cloudFlush();});

/* ================================================================
   화면 v4 — 한눈에 보는 구조: 과목 → 대주제 → 소주제 ↔ 카드 ↔ 기출
   컴퓨터: 왼쪽 메뉴(과목·대주제 진도) / 휴대폰: 위 막대 + 아래 탭
   ================================================================ */

/* ---------- 유틸 ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
const pct=c=>c.all?Math.round(c.k/c.all*100):0;
const bar=c=>`<div class="bar"><i class="k" style="width:${c.k/(c.all||1)*100}%"></i><i class="l" style="width:${c.l/(c.all||1)*100}%"></i></div>`;
const ring=(c,size=88,stroke=9,label)=>{const r=(size-stroke)/2,L=2*Math.PI*r,k=c.k/(c.all||1),l=c.l/(c.all||1);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" class="r0" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" class="r2" stroke-width="${stroke}" stroke-dasharray="${(k+l)*L} ${L}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" class="r1" stroke-width="${stroke}" stroke-dasharray="${k*L} ${L}"/></svg>
    <div class="rl"><b class="num">${pct(c)}%</b>${label?`<small>${label}</small>`:""}</div></div>`;};
const ALL=()=>C.map((_,i)=>i);
const docIdx=d=>C.map((x,j)=>x[1]===d?j:-1).filter(j=>j>=0);
function ddays(){if(!S.exam)return null;return Math.round((new Date(S.exam+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);}
const dlabel=dd=>dd>0?"D-"+dd:dd===0?"D-DAY":"D+"+(-dd);
const IC={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',

  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',left:'<path d="m15 6-6 6 6 6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',

  check:'<path d="M20 6 9 17l-5-5"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const ico=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const DLET=["개","각","교"];

/* ---------- 카드 ↔ 주제 ↔ 기출 색인 ---------- */
let TPOS=[],TQ=[],BQ=[],QT={},IDXV=-1;   // TPOS[카드]=[과목,대,소] · TQ[d][k][t]/BQ[d][k]=기출 문항 Set · QT[문항]=[[d,k,t]...]
function buildIdx(){
  const v=(GQ?1:0)+C.length*2;if(v===IDXV)return;IDXV=v;
  TPOS=[];TQ=CH.map(chs=>chs.map(ch=>ch.topics.map(()=>new Set())));BQ=CH.map(chs=>chs.map(()=>new Set()));QT={};
  CH.forEach((chs,d)=>chs.forEach((ch,k)=>ch.topics.forEach((tp,t)=>tp.idx.forEach(i=>TPOS[i]=[d,k,t]))));
  if(!GQ)return;
  C.forEach((c,i)=>{const g=GL[c[0]];if(!g)return;const [d,k,t]=TPOS[i];
    for(const [qid] of g){TQ[d][k][t].add(qid);BQ[d][k].add(qid);const l=QT[qid]=QT[qid]||[];if(!l.some(x=>x[0]===d&&x[1]===k&&x[2]===t))l.push([d,k,t]);}});
  HMAX=Math.max(1,...BQ.flatMap(x=>x.map(y=>y.size)));
}
const topicHref=(d,k,t)=>`#/topic/${d}/${k}`+(t!=null?`/${t}`:"");
const qSort=(a,b)=>GQ[b].y.localeCompare(GQ[a].y)||GQ[a].s.localeCompare(GQ[b].s)||GQ[a].no-GQ[b].no;
let HMAX=1;
const heat=n=>{if(!n)return 0;const r=n/HMAX;return r>=.7?4:r>=.45?3:r>=.2?2:1;};

/* ---------- 화면 이동 ---------- */
let route={v:"home"};
function go(h){if(location.hash===h)renderRoute();else location.hash=h;}
function parseHash(){const p=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  const n=x=>x===undefined||x===""?null:+x;
  if(p[0]==="deck")return{v:"deck",d:Math.min(2,Math.max(0,+p[1]||0))};
  if(p[0]==="topic"&&CH[+p[1]]&&CH[+p[1]][+p[2]]){const t=n(p[3]);return{v:"topic",d:+p[1],k:+p[2],t:t!=null&&CH[+p[1]][+p[2]].topics[t]?t:null};}
  if(["study","list","set","gichul"].includes(p[0]))return{v:p[0],sub:p[1]||""};
  return{v:"home"};}
window.addEventListener("hashchange",()=>{if(C.length)renderRoute();});
function renderRoute(){
  route=parseHash();buildIdx();
  if(route.v==="study"&&!SES)route={v:"home"};
  document.body.classList.toggle("focus",route.v==="study");
  renderNav();(VIEW[route.v]||VIEW.home)(document.getElementById("main"));
  if(route.v!=="study")window.scrollTo({top:0});
}
function setSync(st){cloudState=st;document.querySelectorAll(".sync").forEach(el=>{
  el.className="sync "+st;el.title=st==="ok"?"서버에 저장됨":st==="err"?"저장 실패 · 다시 시도 중":st==="big"?"기록이 너무 커요":"저장 중…";
  el.innerHTML=`<i></i><span>${st==="ok"?"저장됨":st==="err"?"저장 실패":st==="big"?"용량 초과":"저장 중"}</span>`;});}
let sideOpen={};   // 왼쪽 메뉴: 지금 보고 있는 과목만 펼침
function renderNav(){
  const top=document.getElementById("top"),side=document.getElementById("side"),tab=document.getElementById("tabbar");
  if(!ME||route.v==="study"){[top,side,tab].forEach(e=>{if(e)e.innerHTML="";});return;}
  const v=route.v,cd=(v==="deck"||v==="topic")?route.d:-1;
  const it=[["#/","home","홈",v==="home"],["#/gichul","file","기출",v==="gichul"],["#/list","search","찾기",v==="list"]];
  if(top)top.innerHTML=`<div class="tin"><button class="brand" onclick="go('#/')"><span class="logo">합</span><span>합격노트</span></button><span class="sp"></span><span class="sync"></span>
    <button class="iconbtn" onclick="go('#/set')" aria-label="설정">${ico("gear")}</button></div>`;
  if(side){
    side.innerHTML=`<button class="brand" onclick="go('#/')"><span class="logo">합</span><span>합격노트</span></button>
      <nav class="snav">${it.map(([h,k,l,on])=>`<button onclick="go('${h}')" ${on?'aria-current="page"':""}>${ico(k,18)}${l}</button>`).join("")}</nav>
      <div class="slbl">과목</div>
      ${DOCS.map((d,i)=>{const c=counts(docIdx(i)),open=sideOpen[i]??(i===cd);
        return `<div class="sdoc ${open?"open":""}" style="--dc:${DC[i]};--ds:${DCS[i]}">
          <div class="sdh"><button class="sdn" onclick="go('#/deck/${i}')" ${v==="deck"&&cd===i?'aria-current="page"':""}><span class="dl">${DLET[i]}</span><b>${esc(d)}</b><span class="num">${pct(c)}%</span></button>
          <button class="iconbtn sm sdt" data-sd="${i}" aria-label="${esc(d)} 대주제 ${open?"접기":"펼치기"}">${ico("chev",16)}</button></div>
          <div class="sbig">${CH[i].map((ch,k)=>{const cc=counts(ch.idx),nq=BQ[i]?BQ[i][k].size:0;
            return `<button onclick="go('${topicHref(i,k)}')" ${v==="topic"&&cd===i&&route.k===k?'aria-current="page"':""}><span class="sbn">${esc(ch.name)}</span>${nq?`<span class="sq">${nq}</span>`:""}<span class="sbp"><i style="width:${pct(cc)}%"></i></span></button>`;}).join("")}</div></div>`;}).join("")}
      <div class="sfoot"><span class="sync"></span><button class="iconbtn" onclick="go('#/set')" aria-label="설정" ${v==="set"?'aria-current="page"':""}>${ico("gear")}</button></div>`;
    side.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sd;const el=b.closest(".sdoc");sideOpen[i]=!el.classList.contains("open");el.classList.toggle("open",sideOpen[i]);});
  }
  const ti=[it[0]].concat(DOCS.map((d,i)=>[`#/deck/${i}`,"d"+i,d,cd===i]),it.slice(1));
  if(tab)tab.innerHTML=ti.map(([h,k,l,on])=>`<button onclick="go('${h}')" ${on?'aria-current="page"':""}>${k[0]==="d"&&k.length===2?`<span class="dl" style="--dc:${DC[+k[1]]}">${DLET[+k[1]]}</span>`:ico(k,20)}<span>${l}</span></button>`).join("");
  setSync(cloudState||"ok");
}
const VIEW={};

/* ---------- 공통 조각 ---------- */
// 대주제 타일 (출제 지도): 색 진하기 = 기출 많이 나온 정도, 막대 = 외운 비율
function bigTile(d,k,rich){
  const ch=CH[d][k],c=counts(ch.idx),nq=BQ[d]?BQ[d][k].size:0;
  return `<button class="tile h${heat(nq)}" style="--dc:${DC[d]};--ds:${DCS[d]}" onclick="go('${topicHref(d,k)}')">

    ${bar(c)}${rich?`<span class="ts">소주제 ${ch.topics.length} · ${c.all}장${c.due?` · <em>복습 ${c.due}</em>`:""}</span>`:""}</button>`;
}
const legendMap=()=>`<div class="mleg"><span>기출 출제</span><i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><span>많음</span><span class="sep"></span><span class="lb"><i class="k"></i>외움</span><span class="lb"><i class="l"></i>익히는 중</span></div>`;
// 기출 문항 한 줄
function qRow(qid,i0){
  const q=GQ[qid],ts=(QT[qid]||[]).slice(0,3);
  let sub="";if(i0!=null){const n=gOf(i0).filter(x=>x[0]===qid).map(x=>x[1]);const s=q.subs.find(x=>x[0]===n[0]);if(s)sub=`${n.join(" ")} ${s[1]}`;}

    <span class="qb"><span class="qs">${esc(sub||q.stem)}</span>${i0==null&&ts.length?`<span class="qtc">${ts.map(([d,k,t])=>`<span class="tchip" style="--dc:${DC[d]}">${esc(CH[d][k].topics[t].name)}</span>`).join("")}</span>`:""}</span>${ico("chev",16)}</button>`;

function bindQ(m){m.querySelectorAll("[data-q]").forEach(b=>b.onclick=e=>{e.stopPropagation();openQ(b.dataset.q,(b.dataset.n||"").split("|").filter(Boolean));});}
const crumb=parts=>`<nav class="crumb">${parts.map(([h,l],j)=>h&&j<parts.length-1?`<a href="${h}">${esc(l)}</a>`:`<span>${esc(l)}</span>`).join(ico("chev",14))}</nav>`;
function nextNewCards(n){const out=[];for(let i=0;i<C.length&&out.length<n;i++)if(isNew(i))out.push(i);return out;}
function learnQueue(idx){const q=idx.filter(isDue).concat(idx.filter(isNew));return q.length?q:idx.slice();}

/* ---------- 홈: 오늘 할 일 + 출제 지도 ---------- */
VIEW.home=function(m){
  const all=counts(ALL()),dd=ddays(),st=streak(),td=S.log[today()]||0,now=new Date();
  const nextNew=nextNewCards(S.newN),wrongN=C.filter((_,i)=>isWrong(i)).length;
  const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return{l:k===6?"오늘":"일월화수목금토"[d.getDay()],n:S.log[today(d)]||0};});
  const mx=Math.max(10,...days.map(x=>x.n));
  // 기출 많이 나온 소주제
  const tops=[];if(GQ)CH.forEach((chs,d)=>chs.forEach((ch,k)=>ch.topics.forEach((tp,t)=>{const n=TQ[d][k][t].size;if(n)tops.push({d,k,t,n,c:counts(tp.idx)});})));
  tops.sort((a,b)=>b.n-a.n||a.c.k/a.c.all-b.c.k/b.c.all);

let SES=null;
function startSession(title,idx,o={}){
  if(!idx.length)return toast("공부할 카드가 없어요");
  const q=(S.shuf&&!o.keepOrder)?shuffle(idx):idx.slice();
  SES={title,q,pos:0,shown:0,last:-1,done:0,again:{},hist:[],tally:[0,0,0],back:location.hash||"#/"};
  go("#/study");
}
function quit(){const b=SES?SES.back:"#/";SES=null;if(history.length>1)history.back();else go(b);}

      <div class="row center"><button class="btn" id="back1">${ico("left",16)}마지막 카드</button>${s.hist.length?`<button class="btn" id="undo">${ico("undo",16)}채점 되돌리기</button>`:""}<button class="btn pri" id="fin">돌아가기</button></div></div></div>`;

      <span class="num cnt">${s.pos+1}<small>/${s.q.length}</small></span>
      <button class="iconbtn" id="undo" aria-label="채점 되돌리기" title="채점 되돌리기 (Z)" ${s.hist.length?"":"disabled"}>${ico("undo")}</button></div>
    <div class="sgrid">
      <div class="smain">
        <div class="stage">
          <button class="arr" id="prev" aria-label="이전 문제" title="이전 문제 (←)" ${s.pos?"":"disabled"}>${ico("left",22)}</button>
          <article class="card ${sh?"flip":""} ${same?"noanim":""}" id="card">
            <div class="cmeta"><span class="cd">${esc(DOCS[d])}</span><span class="cp">${esc(c[3])} › ${esc(c[4])}${c[7]&&c[7]!==c[4]?` · ${esc(c[7])}`:""}</span><span class="pg">${c[2]}쪽</span>${tag}${gq.length?`<span class="tag gtag">기출 ${gq.length}</span>`:""}</div>

/* 공부 화면 옆: 첫 기출 문항을 시험지 사진과 함께 */
function fillQ1(box,qid,i){
  const q=GQ[qid],ns=gOf(i).filter(y=>y[0]===qid).map(y=>y[1]);
  box.innerHTML=`<button class="q1h" data-q="${esc(qid)}" data-n="${esc(ns.join("|"))}"><b>${esc(q.y.replace("추"," 추시"))}학년도 ${q.s} ${q.no}번</b><span>${ns.join(" ")} 크게 보기 ${ico("chev",14)}</span></button>
    ${q.pages.length?`<div class="q1p"><div class="qph"></div></div>`:""}
    ${q.subs.filter(s=>ns.includes(s[0])).map(s=>`<p class="q1a"><b>${esc(s[0])}</b> ${esc(s[1])}</p>`).join("")}`;
  if(q.pages.length)gImg(q.pages[0]).then(u=>{const p=box.querySelector(".q1p");if(p)p.innerHTML=`<img src="${u}" alt="${esc(qLabel(qid))} 시험지" data-q="${esc(qid)}" data-n="${esc(ns.join("|"))}">`;bindQ(box);}).catch(()=>{const p=box.querySelector(".q1p");if(p)p.remove();});
}
const rerender=()=>VIEW.study(document.getElementById("main"));
/* 답 항목 나누기: ①·•·1. 같은 머리표로 시작하는 줄마다 한 항목 (머리표 없는 줄은 앞 항목에 이어 붙임) */
const BUL=/^\s*(?:[①-⑳⑴-⒇❶-❿]|[•·▪■□◆◇○●◦※▶▷⇨⇒→➜\-–]|\d{1,2}[.)]|\(\d{1,2}\)|[가-하][.)]|\([가-하]\)|\[)/;
function ansItems(a){const out=[];String(a||"").split("\n").forEach(l=>{if(!l.trim())return;if(!out.length||BUL.test(l))out.push(l);else out[out.length-1]+="\n"+l;});return out.length?out:[String(a||"")];}
const curN=()=>ansItems(C[SES.q[SES.pos]][6]).length;
function flipCard(){if(!SES||SES.pos>=SES.q.length)return;if(SES.shown<curN()){SES.shown++;rerender();}}
function showAll(){if(!SES||SES.pos>=SES.q.length)return;SES.shown=curN();rerender();}
function step(n){const s=SES;if(!s)return;const p=s.pos+n;if(p<0||p>s.q.length)return;s.pos=p;s.shown=0;rerender();}
function answer(g){
  const s=SES,i=s.q[s.pos];
  s.hist.push({i,prev:S.srs[C[i][0]]?S.srs[C[i][0]].slice():null,q:s.q.slice(),pos:s.pos,g,lg:S.log[today()]||0});
  grade(i,g);s.done++;s.tally[g]++;
  if(g===0&&(s.again[i]||0)<3){s.again[i]=(s.again[i]||0)+1;s.q.splice(Math.min(s.q.length,s.pos+5),0,i);}
  s.pos++;s.shown=0;save();rerender();
}
function undo(){
  const s=SES,h=s&&s.hist.pop();if(!h)return;
  if(h.prev)S.srs[C[h.i][0]]=h.prev;else delete S.srs[C[h.i][0]];
  S.log[today()]=h.lg;s.q=h.q;s.pos=h.pos;s.done--;s.tally[h.g]--;s.shown=99;
  save();rerender();
}
document.addEventListener("keydown",e=>{
  if(route.v!=="study"||!SES||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const full=SES.pos<SES.q.length&&SES.shown>=curN();
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flipCard();}
  else if(e.key==="a"||e.key==="A"){e.preventDefault();showAll();}
  else if(full&&["1","2","3"].includes(e.key)){e.preventDefault();answer(+e.key-1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
  else if(e.key==="ArrowRight"){e.preventDefault();step(1);}
  else if(e.key==="z"||e.key==="Z"||e.key==="Backspace"){e.preventDefault();undo();}
  else if(e.key==="Escape")quit();
});
let tx=null,ty=null,swiped=0;
document.addEventListener("touchstart",e=>{if(route.v!=="study"||!e.target.closest(".card"))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=Date.now();step(dx<0?1:-1);}});
document.addEventListener("click",e=>{if(Date.now()-swiped<400&&e.target.closest(".card")){e.stopPropagation();e.preventDefault();}},true);

/* ---------- 기출 (2014~2026 교육과정 A·B) ---------- */
// gichul.bin(암호화) 또는 gichul.json(공개판): {pub?, q:{문항id:{y,s,no,pts,pages,stem,subs:[[n,물음,답]]}}, l:{문항id:{하위물음:[카드id]}}}
let GQ=null,GL={},CID={},GPUB=false;
const GKEYS=()=>GQ?Object.keys(GQ):[];
async function loadGichul(){
  try{
    let d;const r=await fetch("gichul.bin",{cache:"no-cache"});
    if(r.ok){const b=new Uint8Array(await r.arrayBuffer());
      const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},await keyFromRaw(RAWKEY),b.slice(12));
      d=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).json();}
    else{const r2=await fetch("gichul.json",{cache:"no-cache"});if(!r2.ok)return;d=await r2.json();}
    GQ=d.q;GPUB=!!d.pub;GL={};CID={};C.forEach((c,i)=>CID[c[0]]=i);
    for(const qid in d.l)for(const n in d.l[qid])for(const cid of d.l[qid][n]){(GL[cid]=GL[cid]||[]);if(!GL[cid].some(x=>x[0]===qid&&x[1]===n))GL[cid].push([qid,n]);}
    for(const qid in GQ){GQ[qid].links=d.l[qid]||{};}
    IDXV=-1;if(C.length&&route.v!=="study")renderRoute();
  }catch(e){}
}
const gOf=i=>(GQ&&GL[C[i][0]])||[];
const isG=i=>!!(GQ&&GL[C[i][0]]);
const qLabel=qid=>{const q=GQ[qid];return `${q.y.replace("추"," 추시")} ${q.s}-${q.no}`;};
const qCards=qid=>{const s=new Set();const l=GQ[qid].links;for(const n in l)l[n].forEach(c=>{if(CID[c]!=null)s.add(CID[c]);});return [...s].sort((a,b)=>a-b);};
const IMGS={};
async function gImg(key){
  if(IMGS[key])return IMGS[key];
  if(GPUB)return IMGS[key]=`gp/${encodeURIComponent(key)}.webp`;
  const r=await fetch(`g/${encodeURIComponent(key)}.bin`);if(!r.ok)throw 0;
  const b=new Uint8Array(await r.arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},await keyFromRaw(RAWKEY),b.slice(12));
  return IMGS[key]=URL.createObjectURL(new Blob([pt],{type:"image/webp"}));
}

/* 시험지 답란처럼: 물음의 ①②… 개수만큼 밑줄 칸, 답은 해당 칸에 */
const MK="①②③④⑤⑥⑦⑧⑨⑩";
function ansBox(ask,ans){
  const mk=[...new Set([...String(ask)].filter(ch=>MK.includes(ch)))];
  const slots=mk.length?mk:[""];
  let parts=slots.map(()=>"");
  if(ans){
    if(mk.length){const re=new RegExp("(["+mk.join("")+"])");const seg=String(ans).split(re);let cur=-1,pre="";
      for(const t of seg){const k=mk.indexOf(t);if(k>=0){cur=k;continue;}if(cur<0)pre+=t;else parts[cur]+=t;}
      parts=parts.map(x=>x.replace(/^[\s:：)]+/,"").trim());
      if(pre.trim())parts[0]=(pre.trim()+" "+parts[0]).trim();
      if(parts.every(x=>!x))parts[0]=String(ans).trim();}
    else parts[0]=String(ans).trim();
  }
  return `<div class="abox ${ans?"":"empty"}">${slots.map((m,k)=>`<div class="aline">${m?`<span class="mk">${m}</span>`:""}<span class="av">${esc(parts[k])}</span></div>`).join("")}
    ${ans?`<button class="ashow" type="button">민쌤 답안 보기</button>`:""}</div>`;
}
function closeQ(){const o=document.getElementById("qsheet");if(o)o.remove();document.body.classList.remove("noscroll");}
document.addEventListener("keydown",e=>{if(document.getElementById("qsheet")){if(e.key==="Escape")closeQ();e.stopImmediatePropagation();}},true);

try{const th=localStorage.getItem(SBASE+":theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}

const renderTop=()=>renderNav();

/* ================= 로그인 · 회원가입 (Firebase, 예전 계정 그대로) ================= */
const b64e=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>String(s||"").trim().normalize("NFC");
let BLOB=null,RAWKEY=null,FB=null,CODESLOT=null;
async function loadFB(){
  if(FB)return FB;
  const u=n=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
  const [app,auth,fs]=await Promise.all([import(u("app")),import(u("auth")),import(u("firestore"))]);
  const a=app.initializeApp(FB_CONFIG);
  FB=Object.assign({},auth,fs,{auth:auth.getAuth(a),db:fs.getFirestore(a)});
  return FB;
}
async function emailOf(id){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hapgyeok:"+id)));return "u"+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,"0")).join("")+"@hapgyeok-note.app";}
async function pbk(secret,salt,usage){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,usage);
}
const keyFromRaw=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function openBlob(key){
  const b=new Uint8Array(BLOB),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},key,b.slice(28));
  return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
}
async function adminRaw(id,pw){const k=await pbk(id+"\n"+pw,new Uint8Array(BLOB).slice(0,16),["decrypt"]);await openBlob(k);return new Uint8Array(await crypto.subtle.exportKey("raw",k));}
async function codeRaw(code){
  if(!CODESLOT){const r=await fetch("code.json",{cache:"no-cache"});if(!r.ok)throw 0;CODESLOT=await r.json();}
  const w=await pbk("code\n"+code,b64d(CODESLOT.salt),["decrypt"]);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(CODESLOT.iv)},w,b64d(CODESLOT.ct)));
  await openBlob(await keyFromRaw(raw));return raw;
}
async function unwrapKey(wrap,id,pw){const w=await pbk(id+"\n"+pw,b64d(wrap.salt),["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(wrap.iv)},w,b64d(wrap.ct)));}
async function wrapKey(raw,id,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const w=await pbk(id+"\n"+pw,salt,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},w,raw);return{salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};}
function persistDevice(keep){try{localStorage.setItem(BASE+":key",b64e(RAWKEY));if(keep)localStorage.setItem(BASE+":auto","1");else localStorage.removeItem(BASE+":auto");}catch(e){}}
const netMsg=e=>{const c=(e&&e.code)||"";return c.includes("network")?"인터넷 연결을 확인해 주세요.":c.includes("too-many-requests")?"잠시 후 다시 시도해 주세요.":"문제가 생겼어요. 잠시 후 다시 해 주세요.";};
async function logout(){try{await cloudFlush();if(FB)await FB.signOut(FB.auth);}catch(e){}try{localStorage.removeItem(BASE+":auto");}catch(e){}location.hash="";location.reload();}
async function enterFB(uid,info,raw,keep){
  ME={uid,id:info.id};KEY=SBASE+"@fb:"+uid;RAWKEY=raw;persistDevice(keep);
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  let cloud=null;
  try{const p=await FB.getDoc(flashRef());if(p.exists())cloud=await unpackDoc(p.data());}catch(e){}
  S=blank();cloudDirty=false;
  if(cloud&&(!local||(cloud.updatedAt||0)>=(local.updatedAt||0)))adopt(cloud);
  else if(local){adopt(local);cloudDirty=true;}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!C.length)indexData(await openBlob(await keyFromRaw(raw)));
  renderRoute();loadGichul();setSync(cloudDirty?"wait":"ok");if(cloudDirty)cloudFlush();
  toast(`${ME.id}님, 반가워요!`);
}
let needCodeLogin=false;
async function keyWorks(raw){try{await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(BLOB).slice(16,28)},await keyFromRaw(raw),new Uint8Array(BLOB).slice(28));return true;}catch(e){return false;}}
async function doLogin(id,pw,keep,code){
  const fb=await loadFB(),email=await emailOf(id);
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred=null;
  try{cred=await fb.signInWithEmailAndPassword(fb.auth,email,pw);}
  catch(e){const c=e.code||"";if(!/invalid-credential|user-not-found|wrong-password|invalid-login|invalid-email/.test(c))throw new Error(netMsg(e));}
  if(cred){
    const ref=fb.doc(fb.db,"users",cred.user.uid),snap=await fb.getDoc(ref);let info=snap.exists()?snap.data():null,raw;
    if(info&&info.wrap){try{raw=await unwrapKey(info.wrap,id,pw);}catch(e){raw=null;}}
    if(!raw||!(await keyWorks(raw))){
      try{raw=await adminRaw(id,pw);}
      catch(e){
        if(!code){needCodeLogin=true;throw new Error("학습 자료가 새로 갱신되었어요. 확인 코드를 한 번 더 넣고 로그인해 주세요.");}
        try{raw=await codeRaw(code);}catch(e2){throw new Error("확인 코드가 맞지 않아요.");}
      }
      info=Object.assign(info||{id,c:"sun",t:Date.now()},{wrap:await wrapKey(raw,id,pw)});await fb.setDoc(ref,info);
    }
    needCodeLogin=false;
    return enterFB(cred.user.uid,info,raw,keep);
  }
  let raw;try{raw=await adminRaw(id,pw);}catch(e){throw new Error("아이디 또는 비밀번호가 맞지 않아요.");}
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,email,pw);}catch(e){throw new Error(e.code==="auth/email-already-in-use"?"아이디 또는 비밀번호가 맞지 않아요.":netMsg(e));}
  const info={id,c:"sun",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}
async function doSignup(id,pw,code,keep){
  const raw=RAWKEY||await codeRaw(code).catch(()=>{throw new Error("확인 코드가 맞지 않아요.");});
  const fb=await loadFB();
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred;
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,await emailOf(id),pw);}
  catch(e){throw new Error(e.code==="auth/email-already-in-use"?"이미 있는 아이디예요. 다른 아이디를 정해 주세요.":e.code==="auth/weak-password"?"비밀번호를 6자 이상으로 정해 주세요.":netMsg(e));}
  const info={id,c:"sky",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}
function showLock(mode){
  mode=mode||"login";ME=null;renderTop();document.body.classList.add("locked");
  const m=document.getElementById("main"),needCode=!RAWKEY;
  m.innerHTML=`<div class="lockwrap"><form class="lock" id="lock" autocomplete="on">
    <div class="logo xl">합</div><h1>유아임용 합격노트</h1>
    <p class="muted">민쌤 시험장용 요약 · 플래시카드 ${C.length?C.length.toLocaleString()+"장":""}</p>
    <div class="seg" role="tablist"><button type="button" data-lm="login" aria-pressed="${mode==="login"}">로그인</button><button type="button" data-lm="signup" aria-pressed="${mode==="signup"}">회원가입</button></div>
    ${mode==="login"?`
      <label class="fl"><span>아이디</span><input type="text" id="uid" class="field" autocomplete="username" required autofocus></label>
      <label class="fl"><span>비밀번호</span><input type="password" id="pw" class="field" autocomplete="current-password" required></label>
      ${needCodeLogin?`<div class="adm"><b>확인 코드</b><small>학습 자료가 갱신되어 한 번만 다시 필요해요.</small><input type="password" id="lcode" class="field" inputmode="numeric" autocomplete="off" required aria-label="확인 코드"></div>`:""}`
    :`
      <label class="fl"><span>새 아이디</span><input type="text" id="nid" class="field" autocomplete="username" maxlength="20" required autofocus></label>
      <label class="fl"><span>새 비밀번호 (6자 이상)</span><input type="password" id="npw" class="field" autocomplete="new-password" minlength="6" required></label>
      <label class="fl"><span>새 비밀번호 확인</span><input type="password" id="npw2" class="field" autocomplete="new-password" minlength="6" required></label>
      ${needCode?`<div class="adm"><b>확인 코드</b><small>이 기기에서 처음 가입할 때만 필요해요.</small><input type="password" id="vcode" class="field" inputmode="numeric" autocomplete="off" required aria-label="확인 코드"></div>`:`<p class="muted small">인증된 기기라 바로 가입할 수 있어요.</p>`}`}
    <label class="switch"><input type="checkbox" id="remember" checked><i></i>이 기기에서 자동 로그인</label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn pri lg block" id="go-btn" type="submit">${mode==="login"?"로그인":"가입하고 시작하기"}</button>
  </form></div>`;
  m.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>showLock(b.dataset.lm));
  m.querySelector("#lock").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=m.querySelector("#go-btn"),err=m.querySelector("#err"),keep=m.querySelector("#remember").checked,label=btn.textContent;
    const fail=msg=>{btn.disabled=false;btn.textContent=label;err.textContent=msg;};
    btn.disabled=true;btn.textContent="잠시만요…";err.textContent="";
    try{
      if(mode==="login"){const lc=m.querySelector("#lcode");await doLogin(norm(m.querySelector("#uid").value),m.querySelector("#pw").value,keep,lc?norm(lc.value):"");}
      else{
        const id=norm(m.querySelector("#nid").value),pw=m.querySelector("#npw").value,pw2=m.querySelector("#npw2").value;
        if(!id)return fail("새 아이디를 넣어 주세요.");
        if(id==="관리자")return fail("이 아이디는 쓸 수 없어요.");
        if(pw.length<6)return fail("비밀번호는 6자 이상으로 정해 주세요.");
        if(pw!==pw2)return fail("두 비밀번호가 달라요.");
        await doSignup(id,pw,needCode?norm(m.querySelector("#vcode").value):"",keep);
      }
      document.body.classList.remove("locked");
    }catch(x){const msg=(x&&x.message)||"";if(needCodeLogin&&!m.querySelector("#lcode")){showLock("login");const e2=document.getElementById("err");if(e2)e2.textContent=msg;return;}fail(msg||"열쇠를 푸는 데 실패했어요. 비밀번호를 다시 확인해 주세요.");}
  });
}
(async()=>{
  const main=document.getElementById("main");
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){main.innerHTML=`<p class="loading">브라우저가 오래됐어요. 최신 크롬·사파리·엣지에서 열어 주세요.</p>`;return;}
  try{const r=await fetch("content.bin",{cache:"no-cache"});if(!r.ok)throw 0;BLOB=await r.arrayBuffer();try{const t=await fetch("tax.json",{cache:"no-cache"});if(t.ok)TAX=await t.json();}catch(e){}}
  catch(e){main.innerHTML=`<p class="loading">자료를 못 불러왔어요. 인터넷 연결을 확인하고 새로 고쳐 주세요.</p>`;return;}
  let saved=null,auto=null;try{saved=localStorage.getItem(BASE+":key");auto=localStorage.getItem(BASE+":auto");}catch(e){}
  if(saved){
    try{const raw=b64d(saved);if(await keyWorks(raw))RAWKEY=raw;else throw 0;}
    catch(e){try{localStorage.removeItem(BASE+":key");}catch(x){}}
  }
  if(RAWKEY&&auto){
    try{const fb=await loadFB();
      const user=await new Promise(res=>{const off=fb.onAuthStateChanged(fb.auth,u=>{off();res(u);});});
      if(user){const snap=await fb.getDoc(fb.doc(fb.db,"users",user.uid));if(snap.exists()){await enterFB(user.uid,snap.data(),RAWKEY,true);return;}}
    }catch(e){}
  }
  showLock("login");
})();
