<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121220" media="(prefers-color-scheme: dark)">
<title>유아임용</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>/* ===== 합격노트 v5 · 책 목차 ===== */
:root{
  color-scheme:light;
  --bg:#F5F5F9;--surface:#FFFFFF;--sunk:#EFEFF5;--hover:#F3F3F8;
  --ink:#1B1B27;--ink-2:#545468;--ink-3:#9192A6;--line:#E7E7EF;--line-2:#D9D9E4;
  --pri:#4F46E5;--pri-2:#4338CA;--pri-s:#EEEDFD;
  --c0:#E8507F;--c0-s:#FDEDF2;--c1:#2F7BF0;--c1-s:#E8F1FE;--c2:#8452F2;--c2-s:#F2ECFE;
  --good:#14A077;--good-s:#E2F5EE;--mid:#EE9C0A;--mid-s:#FEF3DC;--bad:#EC5555;--bad-s:#FDEBEB;
  --hl:#FFE88A;
  --r:18px;--r-md:14px;
  --sh:0 1px 2px rgba(20,20,50,.04),0 3px 12px rgba(20,20,50,.05);
  --sh-lg:0 2px 6px rgba(20,20,50,.05),0 14px 36px rgba(20,20,50,.09);
  --f:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --side:256px;
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#111120;--surface:#1A1A2B;--sunk:#232337;--hover:#22223A;
  --ink:#EDEDF6;--ink-2:#B5B5CA;--ink-3:#7E7E97;--line:#29293F;--line-2:#35354E;
  --pri:#7C74F5;--pri-2:#6A61F0;--pri-s:#29264B;
  --c0:#F27BA2;--c0-s:#3A2131;--c1:#66A2FB;--c1-s:#1B2B45;--c2:#A787FA;--c2-s:#2A2247;
  --good:#35C190;--good-s:#173529;--mid:#F5B43A;--mid-s:#3A2E14;--bad:#F27373;--bad-s:#3D1F22;--hl:#6B5A12;
  --sh:0 1px 2px rgba(0,0,0,.35);--sh-lg:0 8px 28px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#111120;--surface:#1A1A2B;--sunk:#232337;--hover:#22223A;
  --ink:#EDEDF6;--ink-2:#B5B5CA;--ink-3:#7E7E97;--line:#29293F;--line-2:#35354E;
  --pri:#7C74F5;--pri-2:#6A61F0;--pri-s:#29264B;
  --c0:#F27BA2;--c0-s:#3A2131;--c1:#66A2FB;--c1-s:#1B2B45;--c2:#A787FA;--c2-s:#2A2247;
  --good:#35C190;--good-s:#173529;--mid:#F5B43A;--mid-s:#3A2E14;--bad:#F27373;--bad-s:#3D1F22;--hl:#6B5A12;
  --sh:0 1px 2px rgba(0,0,0,.35);--sh-lg:0 8px 28px rgba(0,0,0,.4);}}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.center{text-align:center}
.ic{flex:none;display:block}
.loading{text-align:center;color:var(--ink-3);padding:120px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.sp{flex:1}
em{font-style:normal;color:var(--bad)}
.top,.tabbar{display:none!important}

/* ---------- 틀: 목차 | 주제 ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh;min-height:100dvh}
body.locked .shell{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px}
.side:empty{display:none}
main{min-width:0;padding:22px 28px 60px}
@media (max-width:699px){
  .shell{display:block}
  .side{display:none}
  main{padding:0 0 40px}
}
@media (min-width:700px){.mtoc,.mbar,.th .back{display:none!important}}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-weight:800;font-size:17px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#F178A0,#7C6CF6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.logo.xl{width:64px;height:64px;border-radius:20px;font-size:28px;margin:0 auto}
.tochd{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 12px}
.dd{font-size:13px;font-weight:800;color:var(--pri);background:var(--pri-s);border-radius:99px;padding:2px 10px}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:0 10px;color:var(--ink-3);margin:0 4px 10px}
.tsearch input{flex:1;border:0;background:none;padding:8px 0;font-size:14px;outline:none;color:var(--ink);min-width:0}
.toc{display:flex;flex-direction:column;gap:1px;flex:1}
.tsp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink-2)}
.tsp span{flex:1}.tsp b{font-size:13px;color:var(--ink-3)}
.tsp:hover{background:var(--hover)}
.tsp.on{background:var(--pri-s);color:var(--pri)}.tsp.on b{color:var(--pri)}
.td{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.trw{display:flex;align-items:center;gap:2px;border-radius:8px;min-height:32px}
.trw>a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 4px}
.trw:hover{background:var(--hover)}
.trw.on{background:var(--ds);}
.trw.on .tn,.trw.on b{color:var(--ink);font-weight:800}
.tg{width:24px;height:24px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;padding:0;border-radius:6px;flex:none;transition:transform .15s}
.tg:hover{background:var(--sunk)}
.td.open>.trw .tg,.tkk.open>.trw .tg{transform:rotate(90deg)}
.l0 b{font-size:15px}
.l0 .dl{width:22px;height:22px;font-size:12px;border-radius:7px}
.tp{font-size:12px;font-weight:700;color:var(--ink-3);padding-right:6px}
.tk{display:none;padding-left:12px}.td.open>.tk{display:block}
.l1 .tn{font-size:14.5px;font-weight:600;color:var(--ink-2)}
.tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt2{display:none;padding:0 0 4px 26px;border-left:2px solid var(--ds);margin-left:11px}.tkk.open>.tt2{display:block}
a.trw.l2{padding:5px 8px;gap:8px;font-size:14px;color:var(--ink-2)}
a.trw.l2 .tn{flex:1}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.pip.half{background:var(--mid)}.pip.done{background:var(--good)}
.tocft{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 0;border-top:1px solid var(--line);margin-top:8px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.wait i{background:var(--mid)}.sync.err i,.sync.big i{background:var(--bad)}
.iconbtn{width:38px;height:38px;border-radius:11px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;padding:0;flex:none}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.iconbtn:disabled{opacity:.3}
.iconbtn[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}

/* ---------- 첫 화면 ---------- */
.pane{max-width:860px;margin:0 auto}
.pane.narrow{max-width:620px}
.home{padding:8px 0}
.mbar{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5}
.mbar .brand{flex:1}
.home h1{font-size:26px;margin:18px 0 4px}
.home>p.muted{font-size:14px}
@media (max-width:699px){.home{padding:0}.home>h1,.home>p,.hgo,.hint,.hdocs,.mtoc{margin-left:16px;margin-right:16px}.home h1{font-size:22px;margin-top:6px}}
.hgo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.hbtn{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:16px;border:1px solid var(--line)}
.hbtn b{font-size:28px;font-weight:800;line-height:1.1;display:flex;align-items:center;min-height:31px}
.hbtn span{font-size:14px;color:var(--ink-2);font-weight:600}
.hbtn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.hbtn.pri span{color:#ffffffd0}
.hbtn:hover{transform:translateY(-1px)}
.hint{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-3);margin-bottom:14px}
.hdocs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.hdocs{grid-template-columns:1fr}.hgo{grid-template-columns:repeat(3,1fr);gap:8px}.hbtn{padding:12px}.hbtn b{font-size:22px}}
.hdoc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hdoc .dl{width:26px;height:26px;font-size:13px;border-radius:8px}
.hdoc .num{font-weight:800;color:var(--dc);font-size:14px}
.hdoc .bar{grid-column:1/-1}.hdoc .bar .k{background:var(--dc)}.hdoc .bar .l{background:color-mix(in srgb,var(--dc) 35%,transparent)}
.mtoc{margin-top:18px;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:8px 8px 12px}
.mtoc .tsp{display:none}
.mtoc .td:first-of-type{border-top:0;margin-top:0}
.mtoc .trw{min-height:42px}.mtoc a.trw.l2{min-height:40px}

/* ---------- 주제 화면 ---------- */
.th{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.thl{flex:1;min-width:0}
.th h1{font-size:24px}
.crumb{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
.crumb a:hover{color:var(--ink)}
.tnav{display:flex;gap:4px}
@media (max-width:699px){.th{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 12px 8px;margin:0;align-items:center}.th h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th p{display:none}.crumb{white-space:nowrap;overflow:hidden;flex-wrap:nowrap}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;font-weight:700;font-size:15px;color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a .num{font-size:12px;font-weight:700;color:var(--ink-3)}
.tabs a[aria-selected="true"]{color:var(--ink);border-color:var(--dc,var(--pri))}
@media (max-width:699px){.tabs{padding:0 12px;margin-bottom:12px;position:sticky;top:58px;z-index:4;background:var(--bg)}.tbody{padding:0 12px}}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px}

/* ---------- 카드 ---------- */
.player{max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog{flex:1;height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;background:var(--dc,var(--pri));border-radius:99px;transition:width .25s ease}
.cnt{font-weight:800;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tgl{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.tgl.on{background:var(--pri-s);border-color:var(--pri);color:var(--pri)}
@media (max-width:420px){.tgl span{display:none}.tgl{padding:5px 7px}}
.card{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--sh-lg);padding:26px 30px 22px;min-height:min(420px,52vh);display:flex;flex-direction:column;cursor:pointer;-webkit-user-select:text;user-select:text;animation:cardin .2s ease;border-top:4px solid var(--dc,var(--pri))}
.card.noanim{animation:none}
@keyframes cardin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
.card .q{font-size:22px;font-weight:700;line-height:1.55;white-space:pre-wrap;letter-spacing:-.02em}
.card .a{display:none;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line-2);font-size:17px;line-height:1.85;white-space:pre-wrap}
.card.flip .a{display:block}
.ait{display:none}.ait.on{display:block}.ait+.ait.on{margin-top:6px}
.ait.new{animation:reveal .22s ease}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.a strong,.cia strong,.qpcard strong,.tt strong{background:linear-gradient(transparent 60%,var(--hl) 60%);font-weight:800}
.tap{margin-top:auto;padding-top:22px;text-align:center;font-size:13px;color:var(--ink-3)}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);display:grid;place-items:center;padding:0;box-shadow:var(--sh)}
.arr.l{left:-18px}.arr.r{right:-18px}
.arr:hover:not(:disabled){color:var(--ink)}
.arr:disabled{opacity:0;pointer-events:none}
@media (max-width:699px){.arr{display:none}.card{padding:20px 18px;min-height:46vh;border-radius:18px}.card .q{font-size:19px}.card .a{font-size:16px}}
.ctl{margin-top:14px}
@media (max-width:699px){.ctl{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:0}}
.showbtn{flex:1;border:0;border-radius:15px;padding:15px;font-weight:800;font-size:17px;background:var(--ink);color:var(--bg)}
.showbtn:disabled{opacity:.4}
.showbtn .num{opacity:.6;font-weight:700;margin-left:4px}
.reveal{display:flex;gap:8px}
.allbtn{border-radius:15px;padding:0 18px;font-size:15px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{border:0;border-radius:15px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.grade b{font-size:16px;font-weight:800}.grade small{font-size:12px;opacity:.8}
.g0{background:var(--bad-s);color:var(--bad)}.g1{background:var(--mid-s);color:color-mix(in srgb,var(--mid) 70%,var(--ink))}.g2{background:var(--good-s);color:var(--good)}
.grade.sug0 .g0,.grade.sug1 .g1,.grade.sug2 .g2{box-shadow:0 0 0 2px currentColor inset}
.keys{text-align:center;font-size:12px;color:var(--ink-3);margin-top:10px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
@media (max-width:699px){.keys{display:none}}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface);color:var(--ink-2);margin-left:6px}
kbd+kbd{margin-left:0}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap;border:0}
.tag.new{background:var(--pri-s);color:var(--pri)}
.tag.lapse{background:var(--bad-s);color:var(--bad)}
.tag.gtag{background:var(--mid-s);color:color-mix(in srgb,var(--mid) 65%,var(--ink))}
button.tag.gtag{cursor:pointer}button.tag.gtag:hover{filter:brightness(.95)}
.tyin{display:flex;flex-direction:column;gap:8px}
.tyin textarea{width:100%;border:1px solid var(--line-2);border-radius:14px;padding:11px 13px;font-size:16px;line-height:1.6;background:var(--surface);color:var(--ink);resize:vertical;min-height:64px}
.tyin textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.tyres{margin-top:16px;border-radius:14px;background:var(--sunk);padding:11px 13px;cursor:default}
.tyh{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.tyh span{font-weight:800;border-radius:99px;padding:1px 9px}
.tyh .good{background:var(--good-s);color:var(--good)}.tyh .mid{background:var(--mid-s);color:color-mix(in srgb,var(--mid) 70%,var(--ink))}.tyh .bad{background:var(--bad-s);color:var(--bad)}
.tyres p{margin:6px 0 8px;font-size:15px;white-space:pre-wrap}
.tyk{display:flex;flex-wrap:wrap;gap:5px}
.tyk span{font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px}
.tyk .ok{background:var(--good-s);color:var(--good)}.tyk .ng{background:var(--bad-s);color:var(--bad)}
.done{text-align:center;padding:40px 20px;background:var(--surface);border-radius:20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:560px;margin:20px auto}
.dbar{width:100%;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex;margin:6px 0 10px}
.dbar i{height:100%}.dbar .g2{background:var(--good)}.dbar .g1{background:var(--mid)}.dbar .g0{background:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.g2{background:var(--good)}.dot.g1{background:var(--mid)}.dot.g0{background:var(--bad)}

/* ---------- 공통 조각 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 15px;font-weight:600;font-size:15px;line-height:1.2}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--pri);font-weight:600;font-size:14px;padding:0}
.bar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .k{background:var(--good)}.bar .l{background:var(--mid)}
.dl{width:28px;height:28px;border-radius:9px;background:var(--dc);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.seg2{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink-3)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:13px;font-size:15px;font-weight:600;z-index:70;box-shadow:var(--sh-lg);max-width:calc(100% - 32px)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.switch input{position:absolute;opacity:0;width:0;height:0}

:root{

  --sh:0 1px 2px rgba(18,20,40,.04),0 6px 20px rgba(18,20,40,.05);

/* 질문 속에 답의 핵심어(**굵은 말**)가 그대로 나오면 가려 두고, 누르면 보이게 */
function qMask(q,a){
  const ks=[...new Set([...String(a||"").matchAll(/\*\*(.+?)\*\*/g)].map(x=>plainA(x[1]).trim()).filter(k=>k.length>=2&&String(q).includes(k)))].sort((x,y)=>y.length-x.length);
  let h=fmt(q);if(!ks.length)return h;
  const re=new RegExp("("+ks.map(k=>esc(k).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  // 괄호 ( ) 안에 들어 있는 핵심어만 가림
  return h.replace(/\(([^()]*)\)/g,(m0,inner)=>"("+inner.split(/(<[^>]+>)/).map(t=>t.startsWith("<")?t:t.replace(re,'<span class="qmask" title="눌러서 보기"><span>$1</span></span>')).join("")+")");
}
/* 비교 카드: 답이 '이름: 설명' 2~3개이고 그 이름들이 질문에 나오면 나란히 + VS */
function vsInfo(q,a){
  const its=ansItems(a);if(its.length<2||its.length>3)return null;
  const qq=plainA(q);if(!/차이|비교|구분|vs|VS|대비|↔|란\?|이란|정의/.test(qq))return null;
  const L=its.map(t=>{const p=plainA(t).replace(BUL,"").trim(),i=p.search(/[:：]/);if(i<1||i>20)return null;
    const raw=String(t),j=raw.search(/[:：]/);return{l:p.slice(0,i).trim(),body:raw.slice(j+1).trim()};});
  if(L.some(x=>!x))return null;
  const base=x=>x.replace(/\(.*?\)/g,"").replace(/\*\*/g,"").trim();
  if(!L.every(x=>base(x.l).length>=1&&qq.includes(base(x.l))))return null;

/* 비교표: 질문의 'A와 B / A ↔ B / A vs B'를 찾아 답을 줄마다 [A쪽 | B쪽]으로 나눔

function vsRows(q,a){
  const qq=plainA(q);if(!/차이|비교|구분|vs|VS|대비|↔/.test(qq))return null;
  const m=qq.match(/([^\s,·&()]{1,10})\s*(?:와|과|↔|vs|VS)\s*([^\s,·&():]{1,10}?)(?=의|에|\s*구분|\s*비교|\s*:|\s*대비|\s*특성|\s*차이|\s|$)/);if(!m)return null;
  let A=m[1],B=m[2];
  const qv=qq.match(/['‘"“]([^'’"”]+?)\s*(?:vs|VS)\s*([^'’"”]+?)['’"”]/);if(qv){A=qv[1].trim();B=qv[2].trim();}
  if(A===B)return null;
  const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const lines=String(a||"").split("\n").map(x=>x.trim()).filter(Boolean),rows=[];let sec=null,secs={[A]:[],[B]:[]},split=0;
  const strip=x=>x.replace(/^[\s•·\-–]+/,"").trim();

    if(sec){p.split("•").map(strip).filter(Boolean).forEach(x=>secs[sec].push(x));continue;}
    if(p.includes("↔")){const [l,r]=p.split("↔");rows.push({l:strip(l),r:strip(r)});split++;continue;}
    const dm=p.match(new RegExp("^(?:(.{1,16}?)\\s*[:：]\\s*)?("+esc2(A)+"|"+esc2(B)+")\\s*-\\s*(.+?)\\s*/\\s*("+esc2(A)+"|"+esc2(B)+")\\s*-\\s*(.+)$"));

}

  const idxSet=new Set(sc.idx),out=[];
  for(const qid in src){const q=src[qid];for(const [n] of q.subs){

/* ---------- 타이핑: 핵심어 채점 ---------- */
const plainA=s=>String(s||"").replace(/\*\*/g,"");
function ansKeys(a){
  const b=[...String(a||"").matchAll(/\*\*(.+?)\*\*/g)].map(x=>x[1].trim()).filter(Boolean);
  if(b.length)return [...new Set(b)];
  return [...new Set(ansItems(a).map(t=>plainA(t).replace(BUL,"").split(/[:：]/)[0].trim().split(/\s+/).slice(0,3).join(" ")).filter(x=>x.length>=2))].slice(0,8);
}
const hintTxt=k=>{const ch=[...plainA(k)];return (ch[0]||"")+ch.slice(1).map(c=>/\s/.test(c)?" ":/[·,()\-/]/.test(c)?c:"○").join("");};
const hintOf=k=>{const ch=[...plainA(k)];return `<b>${esc(ch[0]||"")}</b>`+ch.slice(1).map(c=>/\s/.test(c)?" ":/[·,()\-/]/.test(c)?esc(c):"○").join("");};
function multiScore(arr,a){
  const its=ansItems(a),K=its.map(t=>ansKeys(t)),N=arr.length,pr=[];
  arr.forEach((v,i)=>{if(!String(v||"").trim())return;K.forEach((ks,j)=>{const m=ks.filter(k=>cellOk(v,k)).length;if(m)pr.push([m,i===j?1:0,i,j]);});});
  pr.sort((x,y)=>y[0]-x[0]||y[1]-x[1]);const as={},used=new Set();
  for(const [,,i,j] of pr){if(i in as||used.has(j))continue;as[i]=j;used.add(j);}
  const free=K.map((_,j)=>j).filter(j=>!used.has(j));for(let i=0;i<N;i++)if(!(i in as))as[i]=free.shift();
  const rows=arr.map((v,i)=>{const j=as[i],ks=j!=null?K[j]:[];return{v,j,keys:ks.map(k=>({k,ok:!!String(v||"").trim()&&cellOk(v,k)}))};});
  return{rows,flat:rows.flatMap(r=>r.keys)};
}
function typeScore(input,a){return ansKeys(a).map(k=>({k,ok:cellOk(input,k)}));}

const b64e=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>String(s||"").trim().normalize("NFC");
let BLOB=null,RAWKEY=null,FB=null,CODESLOT=null;
async function loadFB(){
  if(FB)return FB;
  const u=n=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
  const [app,auth,fs]=await Promise.all([import(u("app")),import(u("auth")),import(u("firestore"))]);

async function emailOf(id){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hapgyeok:"+id)));return "u"+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,"0")).join("")+"@hapgyeok-note.app";}
async function pbk(secret,salt,usage){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,usage);
}
const keyFromRaw=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function openBlob(key){
  const b=new Uint8Array(BLOB),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},key,b.slice(28));
  return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
}
async function adminRaw(id,pw){const k=await pbk(id+"\n"+pw,new Uint8Array(BLOB).slice(0,16),["decrypt"]);await openBlob(k);return new Uint8Array(await crypto.subtle.exportKey("raw",k));}
async function codeRaw(code){
  if(!CODESLOT){const r=await fetch("code.json",{cache:"no-cache"});if(!r.ok)throw 0;CODESLOT=await r.json();}
  const w=await pbk("code\n"+code,b64d(CODESLOT.salt),["decrypt"]);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(CODESLOT.iv)},w,b64d(CODESLOT.ct)));
  await openBlob(await keyFromRaw(raw));return raw;
}
async function unwrapKey(wrap,id,pw){const w=await pbk(id+"\n"+pw,b64d(wrap.salt),["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(wrap.iv)},w,b64d(wrap.ct)));}
async function wrapKey(raw,id,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const w=await pbk(id+"\n"+pw,salt,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},w,raw);return{salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};}

async function doLogin(id,pw,keep,code){

  const info={id,c:"sun",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);

async function doSignup(id,pw,code,keep){
  const raw=RAWKEY||await codeRaw(code).catch(()=>{throw new Error("확인 코드가 맞지 않아요.");});

      <label class="fl"><span>새 비밀번호 확인</span><input type="password" id="npw2" class="field" autocomplete="new-password" minlength="6" required></label>
      ${needCode?`<div class="adm"><b>확인 코드</b><small>이 기기에서 처음 가입할 때만 필요해요.</small><input type="password" id="vcode" class="field" inputmode="numeric" autocomplete="off" required aria-label="확인 코드"></div>`:`<p class="muted small">인증된 기기라 바로 가입할 수 있어요.</p>`}`}
    <label class="switch"><input type="checkbox" id="remember" checked><i></i>이 기기에서 자동 로그인</label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn pri lg block" id="go-btn" type="submit">${mode==="login"?"로그인":"가입하고 시작하기"}</button>
  </form></div>`;
  m.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>showLock(b.dataset.lm));
  m.querySelector("#lock").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=m.querySelector("#go-btn"),err=m.querySelector("#err"),keep=m.querySelector("#remember").checked,label=btn.textContent;
    const fail=msg=>{btn.disabled=false;btn.textContent=label;err.textContent=msg;};
    btn.disabled=true;btn.textContent="잠시만요…";err.textContent="";
    try{
      if(mode==="login"){const lc=m.querySelector("#lcode");await doLogin(norm(m.querySelector("#uid").value),m.querySelector("#pw").value,keep,lc?norm(lc.value):"");}
      else{
        const id=norm(m.querySelector("#nid").value),pw=m.querySelector("#npw").value,pw2=m.querySelector("#npw2").value;
        if(!id)return fail("새 아이디를 넣어 주세요.");
        if(id==="관리자")return fail("이 아이디는 쓸 수 없어요.");
        if(pw.length<6)return fail("비밀번호는 6자 이상으로 정해 주세요.");
        if(pw!==pw2)return fail("두 비밀번호가 달라요.");
        await doSignup(id,pw,needCode?norm(m.querySelector("#vcode").value):"",keep);
      }
      document.body.classList.remove("locked");
    }catch(x){const msg=(x&&x.message)||"";if(needCodeLogin&&!m.querySelector("#lcode")){showLock("login");const e2=document.getElementById("err");if(e2)e2.textContent=msg;return;}fail(msg||"열쇠를 푸는 데 실패했어요. 비밀번호를 다시 확인해 주세요.");}
  });
}
(async()=>{
  const main=document.getElementById("main");
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){main.innerHTML=`<p class="loading">브라우저가 오래됐어요. 최신 크롬·사파리·엣지에서 열어 주세요.</p>`;return;}
  try{const r=await fetch("content.bin",{cache:"no-cache"});if(!r.ok)throw 0;BLOB=await r.arrayBuffer();try{const t=await fetch("tax.json",{cache:"no-cache"});if(t.ok)TAX=await t.json();}catch(e){}}
  catch(e){main.innerHTML=`<p class="loading">자료를 못 불러왔어요. 인터넷 연결을 확인하고 새로 고쳐 주세요.</p>`;return;}
  let saved=null,auto=null;try{saved=localStorage.getItem(BASE+":key");auto=localStorage.getItem(BASE+":auto");}catch(e){}
  if(saved){
    try{const raw=b64d(saved);if(await keyWorks(raw))RAWKEY=raw;else throw 0;}
    catch(e){try{localStorage.removeItem(BASE+":key");}catch(x){}}
  }
  if(RAWKEY&&auto){
    try{const fb=await loadFB();
      const user=await new Promise(res=>{const off=fb.onAuthStateChanged(fb.auth,u=>{off();res(u);});});
      if(user){const snap=await fb.getDoc(fb.doc(fb.db,"users",user.uid));if(snap.exists()){await enterFB(user.uid,snap.data(),RAWKEY,true);return;}}
    }catch(e){}
  }
  showLock("login");
})();
/* 기출 페이지: ←/→ 키로 이전·다음 문제 (글쓰기 칸 밖에서) */
document.addEventListener("keydown",e=>{
  if(DDOPEN||document.getElementById("qsheet")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const b=e.key==="ArrowLeft"?document.getElementById("qal"):e.key==="ArrowRight"?document.getElementById("qar"):null;
  if(b&&!b.disabled){e.preventDefault();b.click();}
});

/* ---------- 예쁜 드롭다운: 모든 <select>를 단추 + 펼침 목록으로 덮어 그림 (원래 select는 숨겨 두고 값만 맞춤) ---------- */
let DDOPEN=null;
function ddClose(){if(!DDOPEN)return;DDOPEN.pop.remove();DDOPEN.btn.setAttribute("aria-expanded","false");DDOPEN=null;}
const ddLabel=o=>{const m=String(o.textContent).match(/^(.*?)\s*\(([\d,]+)\)\s*$/);return m?[m[1],m[2]]:[o.textContent,""];};
function ddEnhance(sel){
  if(sel.dataset.dd)return;sel.dataset.dd="1";sel.classList.add("ddsel");sel.tabIndex=-1;sel.setAttribute("aria-hidden","true");
  const btn=document.createElement("button");btn.type="button";btn.className="dd9";btn.setAttribute("aria-haspopup","listbox");btn.setAttribute("aria-expanded","false");
  if(sel.getAttribute("aria-label"))btn.setAttribute("aria-label",sel.getAttribute("aria-label"));
  const paint=()=>{const o=sel.options[sel.selectedIndex],[a,n]=o?ddLabel(o):["",""];btn.innerHTML=`<span class="ddv">${esc(a)}</span>${n?`<span class="ddn">${n}</span>`:""}<span class="ddc">${ico("chev",14)}</span>`;btn.disabled=sel.disabled;};
  paint();sel.after(btn);sel.addEventListener("change",paint);
  btn.onclick=e=>{e.preventDefault();e.stopPropagation();if(DDOPEN&&DDOPEN.sel===sel)return ddClose();ddOpen(sel,btn,paint);};
  btn.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();e.stopPropagation();ddOpen(sel,btn,paint);}};
  const lab=sel.closest("label");if(lab)lab.addEventListener("click",e=>{if(btn.contains(e.target))return;e.preventDefault();if(!btn.disabled)btn.click();});
}
function ddOpen(sel,btn,paint){
  ddClose();
  const pop=document.createElement("div");pop.className="ddp";pop.setAttribute("role","listbox");
  const cur=sel.selectedIndex;
  pop.innerHTML=[...sel.options].map((o,i)=>{const [a,n]=ddLabel(o);return `<button type="button" role="option" class="ddo ${i===cur?"on":""}" data-i="${i}" aria-selected="${i===cur}" ${o.disabled?"disabled":""}><span class="ddt">${esc(a)}</span>${n?`<em class="num">${n}</em>`:""}<span class="ddk">${i===cur?ico("check",15):""}</span></button>`;}).join("");
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect();
  if(innerWidth<600){pop.classList.add("sheetp");}
  else{const host=btn.closest(".pk9")||btn,hr=host.getBoundingClientRect();
    pop.style.minWidth=Math.max(hr.width,220)+"px";
    pop.style.left=Math.max(8,Math.min(hr.left,innerWidth-pop.offsetWidth-8))+"px";
    const below=innerHeight-hr.bottom-14,above=hr.top-14;
    if(below<260&&above>below){const h=Math.min(400,above);pop.style.maxHeight=h+"px";pop.style.top=Math.max(8,hr.top-8-Math.min(pop.scrollHeight,h))+"px";pop.classList.add("up");}
    else{pop.style.maxHeight=Math.min(400,below)+"px";pop.style.top=(hr.bottom+8)+"px";}}
  btn.setAttribute("aria-expanded","true");DDOPEN={sel,btn,pop};
  const on=pop.querySelector(".ddo.on");
  if(on)pop.scrollTop=on.offsetTop-pop.clientHeight/2+on.offsetHeight/2;
  try{(on||pop.querySelector(".ddo:not(:disabled)")).focus({preventScroll:true});}catch(e){}
  pop.onclick=e=>{e.stopPropagation();const o=e.target.closest(".ddo");if(!o||o.disabled)return;ddClose();
    if(sel.selectedIndex!==+o.dataset.i){sel.selectedIndex=+o.dataset.i;paint();sel.dispatchEvent(new Event("change",{bubbles:true}));}
    if(document.body.contains(btn))btn.focus({preventScroll:true});};
  pop.onkeydown=e=>{const os=[...pop.querySelectorAll(".ddo:not(:disabled)")],k=os.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(os[k+1]||os[0]).focus();}
    else if(e.key==="ArrowUp"){e.preventDefault();(os[k-1]||os[os.length-1]).focus();}
    else if(e.key==="Home"){e.preventDefault();os[0].focus();}else if(e.key==="End"){e.preventDefault();os[os.length-1].focus();}
    else if(e.key==="Escape"){e.preventDefault();ddClose();btn.focus();}
    else if(e.key==="Tab")ddClose();
    e.stopPropagation();};
}
document.addEventListener("click",e=>{if(DDOPEN&&!DDOPEN.pop.contains(e.target))ddClose();});
window.addEventListener("resize",()=>{if(DDOPEN&&innerWidth>=600)ddClose();});
document.addEventListener("scroll",e=>{if(DDOPEN&&!DDOPEN.pop.contains(e.target))ddClose();},true);
window.addEventListener("hashchange",ddClose);
new MutationObserver(()=>document.querySelectorAll("select:not([data-dd])").forEach(ddEnhance)).observe(document.documentElement,{childList:true,subtree:true});
</script>
