<style>
:root{
  color-scheme:light;
  --ground:#FFFBF1;--dot:#F5E9CF;--paper:#FFFFFF;
  --ink:#3B3355;--ink-2:#645C80;--ink-3:#958EA8;
  --line:#F0E7D4;--line-2:#E3D7BD;
  --sun:#FFD54F;--sun-d:#E9AE00;--sun-s:#FFF4CC;
  --sky:#4BA8E6;--sky-d:#2A7FBE;--sky-s:#E3F2FD;
  --grass:#58B65F;--grass-d:#3A8D42;--grass-s:#E5F5E2;
  --berry:#FF6B8B;--berry-d:#D9486A;--berry-s:#FFE7ED;
  --tang:#FF9A3C;--tang-d:#DB7412;--tang-s:#FFEEDC;
  --grape:#9A7EE3;--grape-d:#6F52C4;--grape-s:#EFE9FD;
  --shadow:0 2px 0 rgba(59,51,85,.06),0 8px 24px rgba(59,51,85,.07);
  --f-fun:"GangwonEduModuBold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-title:"GangwonEduModuBold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"GangwonEduModuBold","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-synthesis:none;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-fun);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
.fun{font-family:var(--f-fun)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:14px;color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
[hidden]{display:none!important}

/* 제목은 강원교육모두 Bold */
h1,h2,h3,h4,.brand b,.nav,.navgrp,.btn,.chip,.tagline,.step .no,.kwhead,.flash .front,.q,.mmroot,.br>.bt,.kwitem .h,.big,.stat .v,.dday .big,.zone h4{font-family:var(--f-title)}

/* ---------- 학습 계정 ---------- */
.profiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{background:var(--paper);border:2px solid var(--c);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--c)}
.pcard.cur{background:var(--c-s)}
.pcard .pn{font-family:var(--f-title);font-size:22px;display:flex;align-items:center;gap:10px}
.pcard .dot{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.pcard .pst{font-size:14px;color:var(--ink-2)}
.pnew{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pnew input[type=text]{flex:1 1 200px;min-width:0;padding:10px 14px;border:2px solid var(--line-2);border-radius:14px;font-size:17px;background:var(--paper)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);padding:2px 8px}
.who b{font-family:var(--f-title);font-weight:400;color:var(--ink)}
@media (max-width:980px){.profiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.profiles{grid-template-columns:minmax(0,1fr)}}
/* ---------- 잠금 화면 ---------- */
.app.locked{grid-template-columns:minmax(0,1fr)}
.app.locked .side{display:none}
.lock{max-width:420px;width:100%;margin:8vh auto 0;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);text-align:center}
.lock h2{font-size:28px}
.lock input[type=password]{width:100%;padding:12px 14px;border:2px solid var(--line-2);border-radius:14px;font-size:18px;background:var(--paper);text-align:center}
.lock .tabs2{display:flex;gap:6px;justify-content:center}
.lock .field{width:100%;padding:12px 14px;border:2px solid var(--line-2);border-radius:14px;font-size:18px;background:var(--paper);text-align:center}
.lock .adm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--sun-s)}
.lock .err{color:var(--berry-d);min-height:1.4em;margin:0}
/* ---------- 레이아웃 ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:24px 64px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand svg{flex:0 0 auto}
.brand b{display:block;font-family:var(--f-fun);font-size:22px;line-height:1.1;font-weight:400}
.brand small{font-size:13px;color:var(--ink-3)}
.navbox{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:2px}
.navgrp{font-family:var(--f-fun);font-size:13px;color:var(--ink-3);padding:10px 10px 4px;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:14px;font-family:var(--f-fun);font-size:17px;color:var(--ink-2)}
.nav i{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--c-s);color:var(--c-d);flex:0 0 auto;font-style:normal;font-size:15px}
.nav:hover{background:var(--ground)}
.nav[aria-current="page"]{background:var(--c-s);color:var(--ink)}
.nav .badge{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--paper);border:1.5px solid var(--line-2);border-radius:99px;padding:0 8px;color:var(--ink-2)}
.nav .badge.hot{background:var(--berry);border-color:var(--berry);color:#fff}
.timer{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.timer .t{font-family:var(--f-fun);font-size:38px;line-height:1;text-align:center;color:var(--ink)}
.timer .t.run{color:var(--tang-d)}
.timer .modes{display:flex;gap:6px;justify-content:center}
.sync{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;padding-inline:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.sync.on i{background:var(--grass)}
main{min-width:0;display:flex;flex-direction:column;gap:22px}

/* ---------- 공통 부품 ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h2{font-size:32px}
.head p{margin:2px 0 0;color:var(--ink-2)}
.tagline{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-fun);font-size:14px;color:var(--c-d,var(--sky-d));background:var(--c-s,var(--sky-s));border-radius:99px;padding:2px 12px;margin-bottom:6px}
.box{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px}
.box h3{font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line-2);background:var(--paper);border-radius:14px;padding:8px 16px;font-family:var(--f-fun);font-size:16px;color:var(--ink);box-shadow:0 3px 0 var(--line-2);transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.btn.sun{background:var(--sun);border-color:var(--sun-d);box-shadow:0 3px 0 var(--sun-d)}
.btn.sky{background:var(--sky);border-color:var(--sky-d);box-shadow:0 3px 0 var(--sky-d);color:#fff}
.btn.grass{background:var(--grass-s);border-color:var(--grass);box-shadow:0 3px 0 var(--grass);color:var(--grass-d)}
.btn.berry{background:var(--berry-s);border-color:var(--berry);box-shadow:0 3px 0 var(--berry);color:var(--berry-d)}
.btn.soft{background:var(--ground)}
.btn.sm{padding:4px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{border:2px solid var(--line-2);background:var(--paper);border-radius:99px;padding:4px 14px;font-family:var(--f-fun);font-size:15px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.scope{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;background:var(--paper);border:2px solid var(--line);border-radius:18px}
.scope label.l{font-family:var(--f-fun);font-size:14px;color:var(--ink-3)}
select{border:2px solid var(--line-2);border-radius:12px;padding:6px 10px;background:var(--paper);max-width:100%;min-width:0}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.check input{accent-color:var(--grass-d);width:18px;height:18px}
.gtag{display:inline-block;font-family:var(--f-fun);font-size:13px;color:var(--berry-d);background:var(--berry-s);border-radius:8px;padding:0 8px;vertical-align:1px}
.newtag{font-family:var(--f-fun);font-size:13px;color:var(--sky-d);background:var(--sky-s);border-radius:8px;padding:0 8px}
kbd{font-family:var(--f-body);font-size:12px;border:1.5px solid var(--line-2);border-bottom-width:3px;border-radius:6px;padding:0 5px;color:var(--ink-3);background:var(--paper)}
.empty{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:26px}
.empty .big{font-family:var(--f-fun);font-size:40px}
.loading{padding:40px 0;color:var(--ink-3);font-family:var(--f-fun);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-family:var(--f-fun);z-index:10;box-shadow:var(--shadow)}

/* ---------- 홈 ---------- */
.hello{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.hello .greet{background:var(--sun-s);border:2px solid var(--sun);border-radius:26px;padding:22px 24px;display:flex;gap:18px;align-items:center}
.hello .greet h2{font-size:30px}
.hello .greet p{margin:4px 0 0;color:var(--ink-2)}
.dday{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.dday .big{font-family:var(--f-fun);font-size:52px;line-height:1;color:var(--berry-d)}
.dday label{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dday input{border:2px solid var(--line-2);border-radius:10px;padding:2px 8px;background:var(--paper)}
.course{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.step{background:var(--paper);border:2px solid var(--c);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:0 4px 0 var(--c)}
.step .no{font-family:var(--f-fun);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:17px}
.step h4{font-size:20px}
.step .cnt{font-size:14px;color:var(--ink-2);min-height:2.6em}
.step .bar{height:10px;border-radius:99px;background:var(--c-s);overflow:hidden}
.step .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.step.done::after{content:"완료!";position:absolute;top:14px;right:16px;font-family:var(--f-fun);font-size:14px;color:#fff;background:var(--grass);border-radius:99px;padding:1px 10px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.stat .sk{font-size:13px;color:var(--ink-3)}
.stat .v{font-family:var(--f-fun);font-size:28px;line-height:1.2}
.stat .v small{font-family:var(--f-body);font-size:13px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.subj{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.sp{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:15px}
.sp button{border:0;background:none;padding:0;text-align:left;font-family:var(--f-fun);font-size:15px;color:var(--ink)}
.sp button:hover{color:var(--sky-d)}
.meter{height:12px;border-radius:99px;background:var(--ground);border:1.5px solid var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:var(--mc,var(--sky))}
.meter i.seen{opacity:.3}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:120px;margin-top:14px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars span.b{width:100%;max-width:24px;background:var(--sky);border-radius:8px 8px 3px 3px;min-height:3px}
.bars span.b.zero{background:var(--line-2)}
.bars span.b.today{background:var(--tang)}
.bars em{font-style:normal;font-size:12px;color:var(--ink-3)}
.weak{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.weak div{font-size:14px;padding:8px 12px;border-radius:12px;background:var(--berry-s)}

/* ---------- 키워드 ---------- */
.kwcard{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-width:760px;width:100%;margin-inline:auto}
.crumb{font-size:14px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.crumb span+span::before{content:"›";margin-right:6px;color:var(--line-2)}
.kwhead{font-family:var(--f-fun);font-size:28px;line-height:1.35}
.kwcount{font-family:var(--f-fun);font-size:15px;color:var(--sky-d)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:2px dashed var(--line-2);background:var(--ground);border-radius:14px;padding:6px 12px;font-family:var(--f-fun);font-size:17px;color:transparent;min-width:84px;text-align:left;position:relative;line-height:1.5}
.slot .n{color:var(--ink-3);font-size:13px;margin-right:6px}
.slot .hint{position:absolute;left:34px;top:6px;color:var(--grape-d)}
.slot.open{border-style:solid;border-color:var(--c,var(--sky));background:var(--c-s,var(--sky-s));color:var(--ink)}
.slot.open .hint{display:none}
.initials{font-family:var(--f-fun);font-size:20px;color:var(--grape-d);letter-spacing:.06em;background:var(--grape-s);border-radius:12px;padding:6px 12px;align-self:flex-start}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px;width:100%;margin-inline:auto}
.grade .btn{padding:12px;font-size:17px}
.kwlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kwitem{background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--c,var(--sky));border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kwitem .h{font-family:var(--f-fun);font-size:17px}
.kwitem .chips{display:flex;flex-wrap:wrap;gap:5px}
.kwitem .chips span{font-size:14px;background:var(--c-s,var(--sky-s));border-radius:9px;padding:1px 9px}
.cover .kwitem .chips span{color:transparent;background:var(--sun);cursor:pointer;user-select:none}
.cover .kwitem .chips span.shown{color:var(--ink);background:var(--c-s,var(--sky-s))}
.pager{display:flex;gap:8px;justify-content:center;align-items:center}

/* ---------- 카드 ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.flash{width:100%;max-width:700px;min-height:300px;border-radius:26px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);padding:26px 28px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left}
.flash .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-3)}
.flash .front{font-family:var(--f-fun);font-size:26px;line-height:1.45}
.flash .back{border-top:2px dashed var(--line-2);padding-top:14px;white-space:pre-line;font-size:17px}
.flash .hintline{font-family:var(--f-fun);color:var(--grape-d);background:var(--grape-s);border-radius:12px;padding:6px 12px;align-self:flex-start;white-space:pre-line}
.flash .foot{margin-top:auto;font-size:13px;color:var(--ink-3)}
.boxes{display:flex;gap:3px}
.boxes i{width:16px;height:7px;border-radius:4px;background:var(--line-2)}
.boxes i.on{background:var(--grass)}

/* ---------- 마인드맵 ---------- */
.mmwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.mmlist{display:flex;flex-direction:column;gap:6px;max-height:760px;overflow:auto;padding-right:4px}
.pick{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;text-align:left;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-s)}
.pick .ok{color:var(--grass-d);font-family:var(--f-fun)}
.pick small{display:block;color:var(--ink-3);font-size:13px}
.mmc{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.mmtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.mmroot{align-self:center;font-family:var(--f-fun);font-size:22px;text-align:center;padding:10px 24px;border-radius:20px;background:var(--sun);box-shadow:0 4px 0 var(--sun-d);max-width:100%}
.mmbr{columns:2 330px;column-gap:16px}
.br{break-inside:avoid;margin:0 0 16px;border:2px solid var(--c);border-radius:18px;padding:12px 14px;background:var(--c-s)}
.br>.bt{font-family:var(--f-fun);font-size:18px;color:var(--c-d);margin-bottom:4px}
.br ul{list-style:none;margin:0;padding-left:14px;border-left:2px dotted var(--c)}
.br>ul{border-left:0;padding-left:0}
.br li{margin:3px 0}
.mt{display:flex;gap:4px;align-items:flex-start;line-height:1.55}
.mt .tg{border:0;background:none;padding:0;color:var(--c-d);font-size:11px;line-height:2;width:16px;flex:0 0 auto}
.d1>.mt .tx{font-family:var(--f-fun);font-size:16px}
li.closed>ul{display:none}
.mm-hide .leaf>.mt .tx,.mm-all .br li>.mt .tx{background:var(--paper);color:transparent;border-radius:6px;cursor:pointer;user-select:none;box-shadow:inset 0 0 0 1.5px var(--c)}
.mm-hide .leaf>.mt .tx.shown,.mm-all .br li>.mt .tx.shown{background:none;box-shadow:none;color:inherit}
.printbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:var(--grape-s);border-radius:16px}

/* ---------- 퀴즈·서답형·오답·검색 ---------- */
.qbox{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px}
.q{font-family:var(--f-fun);font-size:22px;line-height:1.5}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line-2);background:var(--paper);border-radius:16px;padding:12px 16px;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--sky);background:var(--sky-s)}
.choice .n{font-family:var(--f-fun);color:var(--ink-3)}
.choice.right{border-color:var(--grass);background:var(--grass-s)}
.choice.wrong{border-color:var(--berry);background:var(--berry-s)}
.exp{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--ground);border:2px solid var(--line)}
.exp b{font-family:var(--f-fun);font-weight:400}
.exp b.ok{color:var(--grass-d)} .exp b.no{color:var(--berry-d)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line-2)}
.dots i.c{background:var(--grass)} .dots i.w{background:var(--berry)} .dots i.cur{box-shadow:0 0 0 3px var(--sky-s),0 0 0 5px var(--sky)}
.egrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:6px;max-height:720px;overflow:auto;padding-right:4px}
textarea{width:100%;min-height:220px;resize:vertical;border:2px solid var(--line-2);border-radius:16px;padding:12px 14px;background:repeating-linear-gradient(var(--paper) 0 29px,var(--line) 29px 30px);line-height:30px;font-size:16px}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:14px;border-radius:99px;padding:2px 12px;border:2px solid var(--line-2);color:var(--ink-3)}
.kw.hit{border-color:var(--grass);background:var(--grass-s);color:var(--grass-d)}
.model{border:2px solid var(--grass);background:var(--grass-s);border-radius:16px;padding:12px 16px;white-space:pre-wrap;font-size:15px}
.ai{white-space:pre-wrap;border:2px solid var(--grape);background:var(--grape-s);border-radius:16px;padding:12px 16px;font-size:15px}
.list{display:flex;flex-direction:column;gap:12px}
.li{background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--c,var(--berry));border-radius:16px;padding:12px 16px}
.li .t{font-size:14px;color:var(--ink-3)}
.li p{margin:4px 0}
.ans{color:var(--grass-d)}
.search input{width:100%;padding:12px 16px;border:2px solid var(--line-2);border-radius:16px;background:var(--paper);font-size:17px}
mark{background:var(--sun);color:var(--ink);border-radius:4px;padding:0 2px}

/* ---------- 누리 노트 ---------- */
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.zone{border-radius:18px;padding:14px;background:var(--c-s);border:2px solid var(--c);display:flex;flex-direction:column;gap:6px}
.zone h4{font-size:17px;color:var(--c-d)}
.zone p{margin:0;font-size:13px;color:var(--ink-2)}
.zone ul{margin:0;padding-left:18px;font-size:15px}
.note ol{margin:10px 0 0;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.k{border-radius:4px;padding:0 3px;background:linear-gradient(transparent 55%,var(--sun) 55%)}
.hide .k{background:var(--sun);color:transparent;cursor:pointer;user-select:none}
.hide .k.shown{color:inherit;background:linear-gradient(transparent 55%,var(--sun) 55%)}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-inline:16px;padding-block:12px 48px}
  .side{position:static;gap:10px}
  .brand{justify-content:space-between}
  .navbox{flex-direction:row;overflow-x:auto;border-radius:18px;padding:6px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .navgrp{display:none}
  .nav{flex:0 0 auto;font-size:15px;padding:6px 10px;white-space:nowrap}
  .nav i{width:24px;height:24px;font-size:13px}
  .timer{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:18px}
  .timer .t{font-size:28px}
  .timer .lbl{display:none}
  .course{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hello,.two,.egrid,.mmwrap{grid-template-columns:minmax(0,1fr)}
  .mmlist,.plist{max-height:230px}
  .zones{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kwlist{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .course,.zones{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .head h2{font-size:26px}
  .hello .greet svg{display:none}
  .kwhead,.flash .front{font-size:21px}
  .flash,.kwcard{padding:18px}
  .sp{grid-template-columns:92px minmax(0,1fr) 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2 추가 스타일 ===== */
.navgrp{margin-top:2px}
.tcard{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.cgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.clist{display:flex;flex-direction:column;gap:6px;max-height:780px;overflow:auto;padding-right:4px;position:sticky;top:12px}
.concept{background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--c,var(--sky));border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:16px}
.concept.flash-hl{box-shadow:0 0 0 4px var(--sun)}
.concept .cn{font-family:var(--f-title);font-size:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.concept .who{font-size:14px;color:var(--ink-3)}
.concept .def{font-size:16px}
.concept .lst{margin:0;padding-left:22px}
.concept .lst li{margin:2px 0}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{font-size:14px;background:var(--c-s,var(--sky-s));border-radius:10px;padding:1px 10px}
.confs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.confs button{border:1.5px dashed var(--berry);background:var(--berry-s);color:var(--berry-d);border-radius:10px;padding:0 10px;font-size:14px}
.gq{font-size:14px;background:var(--ground);border-radius:12px;padding:8px 12px}
.hideable.cover .hx{background:var(--sun);color:transparent!important;border-radius:6px;cursor:pointer;user-select:none}
.hideable.cover .hx *{visibility:hidden}
.hideable.cover .hx.shown{background:none;color:inherit!important}
.hideable.cover .hx.shown *{visibility:visible}
.outline{columns:2 300px;column-gap:18px}
.outline .och{break-inside:avoid;margin:0 0 14px}
.outline .och b{font-family:var(--f-title);font-weight:400;font-size:17px;display:block;margin-bottom:4px}
.outline .och button{display:block;border:0;background:none;padding:1px 0;text-align:left;font-size:15px;color:var(--ink-2)}
.outline .och button:hover{color:var(--sky-d)}
/* 표 */
.tbl-wrap{overflow-x:auto;border-radius:16px;border:2px solid var(--line)}
table.study{border-collapse:collapse;width:100%;min-width:520px;background:var(--paper);font-size:15px}
table.study th{background:var(--c-s,var(--sky-s));font-family:var(--f-title);font-weight:400;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
table.study td{padding:7px 10px;border-top:1.5px solid var(--line);vertical-align:top}
table.study td:first-child{font-family:var(--f-title);white-space:nowrap}
table.study td.hid{background:var(--sun);color:transparent;cursor:pointer;user-select:none;border-radius:6px}
table.study td.ok{background:var(--grass-s)}
table.study td.no{background:var(--berry-s)}
table.study td input{width:100%;min-width:90px;padding:4px 8px;border:2px solid var(--line-2);border-radius:8px;font-size:15px;background:var(--paper)}
table.study td .ans{display:block;font-size:13px;color:var(--grass-d);margin-top:2px}
/* 타이핑 */
.typebox{width:100%;min-height:96px;resize:vertical;border:2px solid var(--line-2);border-radius:16px;padding:10px 14px;font-size:17px;background:var(--paper);line-height:1.6}
.typebox:focus{border-color:var(--sky)}
.tres{display:flex;flex-wrap:wrap;gap:6px}
.tres span{font-size:15px;border-radius:10px;padding:2px 10px}
.tres .hit{background:var(--grass-s);color:var(--grass-d);border:1.5px solid var(--grass)}
.tres .miss{background:var(--berry-s);color:var(--berry-d);border:1.5px solid var(--berry)}
.score{font-family:var(--f-title);font-size:22px}
.score.good{color:var(--grass-d)} .score.mid{color:var(--tang-d)} .score.bad{color:var(--berry-d)}
.suggest{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--sky)!important}
/* 고시문 */
.ntext{font-size:20px;line-height:2;font-family:var(--f-title)}
.ntext .bk{display:inline-block;min-width:3em;border-bottom:3px solid var(--tang);color:transparent;cursor:pointer;padding:0 4px;margin:0 2px;border-radius:4px 4px 0 0;background:var(--tang-s)}
.ntext .bk.shown{color:var(--ink)}
.ntext input.bi{font:inherit;font-size:18px;width:auto;min-width:4em;padding:0 6px;border:0;border-bottom:3px solid var(--tang);background:var(--tang-s);border-radius:4px 4px 0 0;margin:0 2px}
.ntext .bi.ok{border-color:var(--grass);background:var(--grass-s)}
.ntext .bi.no{border-color:var(--berry);background:var(--berry-s)}
.diff .m{background:var(--berry-s);color:var(--berry-d);border-radius:4px;padding:0 2px;text-decoration:underline}
.diff .o{color:var(--grass-d)}
.part-chips{display:flex;flex-wrap:wrap;gap:6px}
/* 마인드맵 백지 복습 */
.mm-rec .br li>.mt .tx.hitn{background:var(--grass-s);border-radius:6px}
.mm-rec .br li>.mt .tx.missn{background:var(--berry-s);border-radius:6px;color:var(--berry-d)}
/* 우선순위 */
.prio{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.prio button{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:10px;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;text-align:left;font-size:15px}
.prio button:hover{border-color:var(--sky)}
.prio .gcount{font-family:var(--f-title);color:var(--berry-d);text-align:right}
.prio .mast{font-family:var(--f-title);color:var(--grass-d);text-align:right}
.cram{background:var(--berry-s);border:2px solid var(--berry);border-radius:22px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.course.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.cgrid{grid-template-columns:minmax(0,1fr)}.clist{position:static;max-height:220px}.course.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.course.six{grid-template-columns:minmax(0,1fr)}.ntext{font-size:18px}}

/* 받아쓰기 트레이너 */
.tt-target{font-size:22px;line-height:2.1;letter-spacing:.02em;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 16px;min-height:3.2em;white-space:pre-wrap;overflow-wrap:anywhere}
.tt-target .tsp{display:inline-block;min-width:.5em;text-align:center}
.tt-target span{border-radius:4px;padding:0 1px}
.tt-target .ok{color:var(--grass-d)}
.tt-target .bad{color:#fff;background:var(--berry)}
.tt-target .cmp{background:var(--sun-s);border-bottom:3px solid var(--tang)}
.tt-target .cur{background:var(--sun);animation:blink 1s step-end infinite}
.tt-target .tsp.bad{background:var(--berry);color:#fff}

<script>
const FB_CONFIG={"apiKey": "AIzaSyDtFXzKPCHRbJnQdniJN8AtzlP6mYWciSk", "authDomain": "hapgyeok-note-0925k.firebaseapp.com", "projectId": "hapgyeok-note-0925k", "storageBucket": "hapgyeok-note-0925k.firebasestorage.app", "messagingSenderId": "1018750410558", "appId": "1:1018750410558:web:ca8aea98c6531d12b8966f"};
const FB_VER="12.19.0";
/* ================================================================
   유아임용 합격노트 v2 — 암기·구조화 학습 앱
   구성: 기본(데이터·저장·채점) → 화면들 → 로그인(Firebase)
   ================================================================ */

/* ---------- 누리과정 5개 영역 (화면 장식·색) ---------- */
const SCOLOR={dev:"sky",phil:"grape",play:"sun",teacher:"berry",parent:"tang",welfare:"grass",incl:"sky",eval:"grape",curr:"grass",prog:"tang",safety:"berry",nuri:"sun",body:"tang",comm:"sky",soc:"sun",art:"grape",nat:"grass"};
const cvars=c=>`--c:var(--${c});--c-d:var(--${c}-d);--c-s:var(--${c}-s)`;
const scol=s=>cvars(SCOLOR[s]||"sky");

/* ---------- 데이터 (로그인 후 복호화해서 채움) ---------- */
let D=null,SUBJ={},BY={};  // BY: 종류별 id → 항목
function indexData(d){
  D=d;SUBJ={};d.subjects.forEach(s=>SUBJ[s.id]=s);
  BY={concept:{},card:{},quiz:{},essay:{},table:{},notice:{},kw:{},mm:{},gichul:{}};
  d.gichul=d.gichul||[];d.gichulAns=d.gichulAns||{};d.gichul.forEach(x=>BY.gichul[x.id]=x);
  d.concepts.forEach(x=>BY.concept[x.id]=x);d.cards.forEach(x=>BY.card[x.id]=x);d.quiz.forEach(x=>BY.quiz[x.id]=x);
  d.essays.forEach(x=>BY.essay[x.id]=x);d.tables.forEach(x=>BY.table[x.id]=x);d.notice.forEach(x=>BY.notice[x.id]=x);
  d.kwsets.forEach(x=>BY.kw[x.id]=x);d.mindmaps.forEach(x=>BY.mm[x.id]=x);
}

/* ---------- 상태 (계정별) ---------- */
const BASE="yuah-imyong-v2";
const PCOLORS=["sun","sky","grass","berry","grape","tang"];
let ME=null,KEY=BASE+":guest";
const curProfile=()=>ME?{name:ME.id,c:ME.c,t:ME.t}:{name:"손님",c:"sun",t:Date.now()};
const blank=()=>({v:3,updatedAt:0,exam:"",scope:{s:"",g:false},typing:true,srs:{},newLog:{},quiz:{},wrong:[],essays:{},mmr:{},log:{},day:{},focus:{}});
let S=blank();
function adopt(o){S=Object.assign(blank(),o||{});if(S.v!==3)S=blank();}
function today(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return today(d)}
function bump(kind,n=1){const t=today();S.log[t]=(S.log[t]||0)+n;if(kind){S.day[t]=S.day[t]||{};S.day[t][kind]=(S.day[t][kind]||0)+n;}}
const dayN=kind=>((S.day[today()]||{})[kind])||0;

/* 저장: 이 기기 + Firebase 서버 */
let saveTimer=null,cloudBusy=false,cloudDirty=false,essDirty=false,cloudState="";
function save(kind,ess){
  if(kind)bump(kind===true?null:kind);
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  cloudDirty=true;if(ess)essDirty=true;setSync("wait");
  clearTimeout(saveTimer);saveTimer=setTimeout(cloudFlush,1200);
  renderNav();
}
async function cloudFlush(){
  if(!FB||!ME||cloudBusy||!cloudDirty)return;
  cloudBusy=true;cloudDirty=false;const e=essDirty;essDirty=false;
  try{
    const body=Object.assign({},S);delete body.essays;
    await FB.setDoc(FB.doc(FB.db,"users",ME.uid,"data","progress"),{json:JSON.stringify(body),updatedAt:S.updatedAt});
    if(e)await FB.setDoc(FB.doc(FB.db,"users",ME.uid,"data","essays"),{json:JSON.stringify(S.essays||{}),updatedAt:S.updatedAt});
    setSync(cloudDirty?"wait":"ok");
  }catch(err){cloudDirty=true;if(e)essDirty=true;setSync("err");setTimeout(cloudFlush,15000);}
  cloudBusy=false;if(cloudDirty)setTimeout(cloudFlush,300);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")cloudFlush();});
function setSync(st){cloudState=st;document.querySelectorAll(".cloud").forEach(el=>{
  el.textContent=st==="ok"?"서버에 저장됨":st==="err"?"서버 저장 실패 · 인터넷 확인 (다시 시도 중)":"서버에 저장 중…";
  el.style.color=st==="err"?"var(--berry-d)":st==="ok"?"var(--grass-d)":"var(--ink-3)";});}

/* ---------- 유틸 ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const gtag=g=>g?`<span class="gtag">기출 ${esc(g)}</span>`:"";
const subjName=id=>SUBJ[id]?SUBJ[id].name:"";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BUL=/^\s*(?:[①-⑳]|[0-9]{1,2}[.)]|[-•·▪■◆◇○●※▶→]|\([0-9가-하]\)|[가-하][.)])\s*/;
const core=t=>String(t).replace(BUL,"").trim();
function hints(items){
  const cs=items.map(i=>core(i).replace(/^[\s"'“‘(\[]+/,""));
  let p=0;const minL=Math.min(...cs.map(c=>c.length));
  while(p<minL-1&&cs.every(c=>c[p]===cs[0][p]))p++;
  return cs.map(c=>{const r=c.slice(p).replace(/^[\s의·\-]+/,"");return r?r[0]:(c[0]||"?");});
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
const inS=(x,sc)=>{sc=sc||S.scope;return(!sc.s||x.s===sc.s)&&(!sc.g||!!(x.g||(x.gichul&&x.gichul.length)))};
function streak(){let n=0,d=today();if(!S.log[d])d=addDays(d,-1);while(S.log[d]){n++;d=addDays(d,-1)}return n}
function quizAcc(){let c=0,w=0;for(const k in S.quiz){c+=S.quiz[k].c||0;w+=S.quiz[k].w||0}return c+w?Math.round(c/(c+w)*100):null}
function ddays(){if(!S.exam)return null;return Math.round((new Date(S.exam+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);}

/* ---------- 타이핑 채점 ---------- */
const nz=s=>core(String(s||"")).toLowerCase().replace(/[\s·・,，.。\-–—:;'"“”‘’「」『』<>《》〈〉\[\]{}→←↔=~!?…/\\]/g,"");
const nzp=s=>nz(String(s||"").replace(/\([^)]*\)/g,""));
function sim(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  const m=a.length,n=b.length;let dp=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=n;j++){const t=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}
  return 1-dp[n]/Math.max(m,n);
}
/* 여러 항목을 한꺼번에 타이핑했을 때: 각 목표 항목이 들어 있는지 */
function matchItems(input,targets){
  const whole=nz(input),parts=String(input||"").split(/[\n,，、\/;]+/).map(nz).filter(Boolean);
  return targets.map(t=>{
    const xs=[nz(t),nzp(t)].filter(Boolean);if(!xs.length)return true;
    return xs.some(x=>whole.includes(x)||parts.some(p=>sim(p,x)>=0.8||(x.length>=4&&p.length>=3&&x.includes(p)&&p.length/x.length>=0.7)));
  });
}
/* 한 칸 답: 0~1 점수 */
function cellScore(input,target){
  const a=nz(input),b=nz(target),bp=nzp(target);if(!a)return 0;
  if(a===b||a===bp||b.includes(a)&&a.length/b.length>=0.7||a.includes(bp)&&bp.length>=2)return 1;
  return Math.max(sim(a,b),sim(a,bp));
}
const scoreCls=r=>r>=0.85?"good":r>=0.5?"mid":"bad";
const gradeFrom=r=>r>=0.85?2:r>=0.5?1:0;

/* ---------- 간격 반복 (몰랐어요 0 · 반쯤 1 · 알아요 2) ---------- */
const INTERVALS=[0,1,3,7,14,30];
function srsGrade(key,g){
  const t=today(),st=S.srs[key],kind=key.split(":")[0];
  if(!st){S.newLog[t]=S.newLog[t]||{};S.newLog[t][kind]=(S.newLog[t][kind]||0)+1;}
  let b=st?st.b:0,l=st?(st.l||0):0;
  if(g===0){b=1;l++;}else if(g===2)b=Math.min(5,Math.max(1,b)+1);else b=Math.max(1,b);
  S.srs[key]={b,d:addDays(t,g===0?0:INTERVALS[b]),l};
}
const st=key=>S.srs[key];
const isDue=key=>{const x=S.srs[key];return x&&x.d<=today();};
const isNew=key=>!S.srs[key];
const mastered=key=>{const x=S.srs[key];return x&&x.b>=4;};
function queueOf(list,prefix,filter){
  const due=list.filter(x=>filter(x)&&isDue(prefix+x.id)).sort((a,b)=>S.srs[prefix+a.id].b-S.srs[prefix+b.id].b);
  return due.concat(list.filter(x=>filter(x)&&isNew(prefix+x.id)));
}
const boxes=key=>{const x=S.srs[key];return x?`<span class="boxes">${[1,2,3,4,5].map(i=>`<i class="${x.b>=i?"on":""}"></i>`).join("")}</span>`:`<span class="newtag">새로 배움</span>`;};
const gradeRow=(attr,sug)=>`<div class="grade"><button class="btn berry ${sug===0?"suggest":""}" ${attr}="0">몰랐어요 <kbd>1</kbd></button><button class="btn ${sug===1?"suggest":""}" ${attr}="1">반쯤 <kbd>2</kbd></button><button class="btn grass ${sug===2?"suggest":""}" ${attr}="2">알아요 <kbd>3</kbd></button></div>`;

/* ---------- 범위 선택 막대 ---------- */
function subjSelect(id,val,withAll=true){
  const grp=g=>D.subjects.filter(s=>s.group===g).map(s=>`<option value="${s.id}" ${val===s.id?"selected":""}>${esc(s.name)}</option>`).join("");
  return `<select id="${id}">${withAll?`<option value="">전체 과목 (섞어서)</option>`:""}<optgroup label="개론">${grp("개론")}</optgroup><optgroup label="각론">${grp("각론")}</optgroup></select>`;
}
function scopeBar(counter,extra=""){
  return `<div class="scope"><label class="l" for="sc-s">과목</label>${subjSelect("sc-s",S.scope.s)}
    <label class="check"><input type="checkbox" id="sc-g" ${S.scope.g?"checked":""}> 기출만</label>${extra}
    <span class="small num" style="margin-left:auto">${counter}</span></div>`;
}
function bindScope(m,onChange){
  const s=m.querySelector("#sc-s"),g=m.querySelector("#sc-g");
  if(s)s.onchange=()=>{S.scope.s=s.value;save();onChange();};
  if(g)g.onchange=()=>{S.scope.g=g.checked;save();onChange();};
}
const modeChips=(cur,list,attr="data-mode")=>`<span class="row" style="gap:6px">${list.map(([k,l])=>`<button class="chip" ${attr}="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</span>`;

/* ---------- 메뉴 ---------- */
const MENU=[
  ["오늘",[["home","오늘의 코스","sun","★"],["weak","약점 복습","berry","!"]]],
  ["구조 잡기",[["concepts","개념 지도","sky","지"],["mind","마인드맵","grass","M"]]],
  ["외우기",[["kw","키워드 떠올리기","grape","K"],["tables","단계·비교표","tang","표"],["notice","고시문 암기","sun","고"],["cards","암기 카드","sky","A"]]],
  ["확인하기",[["quiz","퀴즈","sun","Q"],["gichul","기출 원문","berry","시"],["essay","기출 서답형","berry","✎"]]],
  ["나",[["stats","진도 분석","grass","%"],["search","찾아보기","grape","?"],["profile","내 계정","tang","나"]]]
];
const VIEWS=MENU.flatMap(g=>g[1].map(x=>x[0]));
let view="home";
function go(v,opts){view=v;if(opts)Object.assign(GO,opts);try{localStorage.setItem(KEY+":tab",v)}catch(e){}render();window.scrollTo({top:0});}
const GO={};  // 화면 이동 때 넘겨주는 값 (예: 특정 개념으로 이동)
function renderNav(){
  if(!D)return;
  const cp=curProfile(),w=document.getElementById("who");
  if(w)w.innerHTML=`<b>${esc(cp.name)}</b>님 공부 중 <button class="btn sm soft" data-go="profile">내 계정</button>`;
  const kwDue=D.kwsets.filter(x=>isDue("k:"+x.id)).length,cDue=D.cards.filter(x=>isDue("c:"+x.id)).length;
  const tDue=D.tables.filter(x=>isDue("t:"+x.id)).length,nDue=D.notice.filter(x=>isDue("n:"+x.id)).length;
  const badge={kw:kwDue,cards:cDue,tables:tDue,notice:nDue,weak:S.wrong.length};
  document.getElementById("nav").innerHTML=MENU.map(([g,items])=>`<div class="navgrp">${g}</div>`+items.map(([id,name,c,ic])=>{
    const n=badge[id];const b=n?`<span class="badge ${id==="weak"?"hot":""}">${n}</span>`:"";
    return `<button class="nav" style="${cvars(c)}" data-go="${id}" ${id===view?'aria-current="page"':""}><i>${ic}</i>${name}${b}</button>`}).join("")).join("");
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g&&D){go(g.dataset.go);}});
const VIEWFN={};
function render(){renderNav();const m=document.getElementById("main");(VIEWFN[view]||VIEWFN.home)(m);}
const head=(tag,c,title,desc,right="")=>`<div class="head"><div><span class="tagline" style="${cvars(c)}">${tag}</span><h2>${title}</h2><p>${desc}</p></div>${right}</div>`;
const empty=(big,msg,btn="")=>`<div class="box empty"><div class="big">${big}</div><p class="muted" style="margin:0">${msg}</p>${btn?`<div class="row" style="justify-content:center">${btn}</div>`:""}</div>`;

/* ---------- 집중 타이머 ---------- */
let tLen=25*60,tLeft=25*60,tRun=null,tSec=0;
function renderTimer(){
  const el=document.getElementById("timer");
  const mm=String(Math.floor(tLeft/60)).padStart(2,"0"),ss=String(tLeft%60).padStart(2,"0");
  el.innerHTML=`<div class="small lbl fun">집중 타이머 · 오늘 ${S.focus[today()]||0}분</div>
    <div class="t num ${tRun?"run":""}">${mm}:${ss}</div>
    <div class="modes">${[25,50].map(n=>`<button class="chip" data-tm="${n}" aria-pressed="${tLen===n*60}" style="font-size:13px;padding:2px 10px">${n}분</button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn sm ${tRun?"":"sun"}" id="t-go">${tRun?"잠깐 멈춤":"시작"}</button><button class="btn sm soft" id="t-reset">처음부터</button></div>`;
  el.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{if(tRun)return;tLen=tLeft=+b.dataset.tm*60;renderTimer();});
  el.querySelector("#t-go").onclick=()=>{if(tRun){clearInterval(tRun);tRun=null;}else tRun=setInterval(tick,1000);renderTimer();};
  el.querySelector("#t-reset").onclick=()=>{clearInterval(tRun);tRun=null;tLeft=tLen;renderTimer();};
}
function tick(){
  tLeft--;tSec++;
  if(tSec>=60){tSec=0;const t=today();S.focus[t]=(S.focus[t]||0)+1;save();}
  if(tLeft<=0){clearInterval(tRun);tRun=null;tLeft=tLen;beep();toast("집중 시간 끝! 5분 쉬었다 가요");renderTimer();return;}
  const el=document.querySelector("#timer .t");if(el)el.textContent=String(Math.floor(tLeft/60)).padStart(2,"0")+":"+String(tLeft%60).padStart(2,"0");
}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2);}catch(e){}}

/* ---------- 키보드 ---------- */
const KEYS={};  // 화면별 키 처리
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){const b=document.querySelector("[data-check]");if(b){e.preventDefault();b.click();}}
    return;
  }
  const f=KEYS[view];if(f)f(e);
});
function gradeKeys(e,fn){if(["1","2","3"].includes(e.key)){e.preventDefault();fn(+e.key-1);return true;}return false;}

/* ================= 홈: 오늘의 코스 ================= */
function chapterPriority(){
  // 단원별: 기출 수 × (1 - 숙달도) → 자주 나오는데 약한 곳
  const map={};
  D.concepts.forEach(c=>{const k=c.s+"|"+c.ch;const o=map[k]||(map[k]={s:c.s,ch:c.ch,g:0,n:0,m:0});o.g+=(c.gichul||[]).length;});
  D.kwsets.forEach(x=>{if(!x.ch)return;const o=map[x.s+"|"+x.ch];if(!o)return;o.n++;if(mastered("k:"+x.id))o.m++;});
  D.cards.forEach(x=>{const o=map[x.s+"|"+x.ch];if(!o)return;o.n++;if(mastered("c:"+x.id))o.m++;});
  return Object.values(map).filter(o=>o.g>0).map(o=>Object.assign(o,{mast:o.n?o.m/o.n:0,score:o.g*(1-(o.n?o.m/o.n:0))})).sort((a,b)=>b.score-a.score);
}
VIEWFN.home=function(m){
  const t=today(),dd=ddays();
  const kwQ=queueOf(D.kwsets,"k:",()=>true),tbQ=queueOf(D.tables,"t:",()=>true),ntQ=queueOf(D.notice,"n:",()=>true);
  const weakN=S.wrong.length+D.cards.filter(c=>{const x=st("c:"+c.id);return x&&x.l>=1&&x.b<=2;}).length+D.kwsets.filter(k=>{const x=st("k:"+k.id);return x&&x.l>=1&&x.b<=2;}).length;
  const mmToday=Object.values(S.mmr).filter(r=>r.date===t).length;

let kwMode="recall",kwQueue=null,kwOpen=new Set(),kwHint=false,kwChecked=null,kwWeak=false,kwPage=0,kwCover=true,kwDone=0;
const kwFilter=x=>inS(x);
function buildKw(){
  kwQueue=kwWeak?shuffle(D.kwsets.filter(x=>kwFilter(x)&&st("k:"+x.id)&&st("k:"+x.id).l>=1)):queueOf(D.kwsets,"k:",kwFilter);
  kwOpen=new Set();kwHint=false;kwChecked=null;
}
VIEWFN.kw=function(m){
  const pool=D.kwsets.filter(kwFilter);
  const top=head("외우기 · 제목만 보고 키워드 인출","grape","키워드 떠올리기","제목만 보고 키워드를 몇 개나 떠올리는지 확인해요. 타이핑으로 쓰면 자동으로 채점돼요.",
    modeChips(kwMode,[["recall","보고 떠올리기"],["type","타이핑"],["list","한눈에 훑기"]]))+scopeBar(`키워드 묶음 ${pool.length}개`+(kwWeak?" · 헷갈린 것만":""));
  if(kwMode==="list"){
    const per=30,pages=Math.max(1,Math.ceil(pool.length/per));kwPage=Math.min(kwPage,pages-1);
    const slice=pool.slice(kwPage*per,kwPage*per+per);

    <div class="kwlist ${kwCover?"cover":""}" id="kwl">${slice.map(x=>`<div class="kwitem" style="${scol(x.s)}"><div class="crumb">${[subjName(x.s)].concat(x.path).map(p=>`<span>${esc(p)}</span>`).join("")}</div><div class="h">${esc(x.h)} ${x.g?gtag(x.g):""}</div><div class="chips">${x.it.map(i=>`<span>${esc(i)}</span>`).join("")}</div></div>`).join("")}</div>
    <div class="pager"><button class="btn sm" id="pg-prev" ${kwPage?"":"disabled"}>이전</button><button class="btn sm" id="pg-next" ${kwPage<pages-1?"":"disabled"}>다음</button></div>`;
    m.querySelector("#kw-cover").onchange=e=>{kwCover=e.target.checked;render();};

  }else{
    if(!kwQueue)buildKw();
    const x=kwQueue[0];
    if(!x){m.innerHTML=top+empty(kwDone?"잘했어요!":"다 봤어요",`${kwDone?`방금 ${kwDone}묶음을 공부했어요. `:""}이 범위를 모두 봤어요. 복습할 것은 날짜가 되면 다시 나와요.`,`<button class="btn sun" data-go="tables">다음: 단계·비교표</button>`);}
    else{
      const hs=hints(x.it),typing=kwMode==="type";

      m.innerHTML=top+`<div class="stage"><div class="kwcard" style="${scol(x.s)}">

        <div class="kwhead">${esc(x.h)} ${x.g?gtag(x.g):""}</div>
        <div class="kwcount">키워드 ${x.it.length}개를 떠올려 보세요</div>
        ${kwHint?`<div class="initials">${hs.join(" · ")}</div>`:""}
        ${typing?`<textarea class="typebox" id="kw-in" placeholder="생각나는 키워드를 쉼표(,)나 줄바꿈으로 나눠서 써 보세요" ${res?"disabled":""}>${esc(GO.kwText||"")}</textarea>
          ${res?`<div class="row"><span class="score ${scoreCls(ratio)}">${res.filter(Boolean).length} / ${res.length}개 맞힘</span></div><div class="tres">${x.it.map((it,i)=>`<span class="${res[i]?"hit":"miss"}">${esc(it)}</span>`).join("")}</div>`

const TT={typed:"",composing:false,flag:null,err:0,t0:0,done:false};

function ttRender(target){
  const el=document.getElementById("tt-target");if(!el)return;
  const typed=TT.typed,n=typed.length,chars=[...target];
  let html="";
  chars.forEach((ch,i)=>{
    let cls="",show=ch;
    if(i<n){
      const ok=typed[i]===ch;
      if(!ok&&TT.composing&&i===n-1)cls="cmp";else cls=ok?"ok":"bad";
      if(cls==="bad"&&ntHide)show=typed[i];
    }else{cls=i===n?"cur":"";if(ntHide&&ch!==" ")show="_";}
    html+=ch===" "?`<span class="tsp ${cls}">${cls==="bad"?esc(typed[i]):" "}</span>`:`<span class="${cls}">${esc(show)}</span>`;
  });
  el.innerHTML=html;
  // 오타 세기: 조합이 끝난 글자만
  if(!TT.composing){chars.forEach((ch,i)=>{if(i<n&&typed[i]!==ch&&!TT.flag[i]){TT.flag[i]=true;TT.err++;}});}
  const stat=document.getElementById("tt-stat");
  const acc=Math.max(0,1-TT.err/chars.length),sec=TT.t0?Math.round((Date.now()-TT.t0)/1000):0;
  if(!TT.done&&typed===target){TT.done=true;ntChecked={ratio:acc,sec};render();return;}
  if(stat)stat.innerHTML=`${n} / ${chars.length}자 · 오타 ${TT.err} · ${sec}초`;
}

const QIMG={};  // 경로 → blob URL (복호화 결과 캐시)
let IMGKEY=null;
async function qimgURL(path){
  if(QIMG[path])return QIMG[path];
  if(!IMGKEY){IMGKEY=await crypto.subtle.importKey("raw",b64d(D.imgkey),"AES-GCM",false,["decrypt"]);}
  const r=await fetch("q/"+path+".bin",{cache:"force-cache"});if(!r.ok)throw new Error("이미지를 불러오지 못했어요");
  const b=new Uint8Array(await r.arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},IMGKEY,b.slice(12));
  return QIMG[path]=URL.createObjectURL(new Blob([pt],{type:"image/webp"}));
}
function imgTag(path,alt,cls){

  qimgURL(path).then(u=>{const el=document.getElementById(id);if(el){el.src=u;el.classList.remove("loading");}}).catch(()=>{const el=document.getElementById(id);if(el)el.alt="이미지를 불러오지 못했어요";});
  return `<img id="${id}" class="qimg loading ${cls||""}" alt="${esc(alt||"")}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">`;

/* ================= 퀴즈 (교차 · 과목 집중) ================= */
let Q=null,quizSize=10;
function startQuiz(mode){
  let pool=mode==="wrong"?D.quiz.filter(q=>S.wrong.includes(q.id)):D.quiz.filter(q=>inS(q));
  pool=shuffle(pool);if(mode!=="wrong"&&quizSize)pool=pool.slice(0,quizSize);
  Q={items:pool,idx:0,picked:null,results:[],mode,order:pool.map(q=>shuffle(q.c.map((_,i)=>i)))};
}
VIEWFN.quiz=function(m){
  if(!Q)startQuiz("normal");
  const it=Q.items[Q.idx],pool=D.quiz.filter(q=>inS(q)).length;
  const top=head(`확인하기 · ${Q.mode==="wrong"?"틀린 문제 다시":S.scope.s?"과목 집중":"전 과목 섞어서(교차 학습)"}`,"sun","퀴즈","과목을 '전체'로 두면 여러 과목이 섞여 나와 기억이 더 단단해져요. 숫자키 1~4로 고르고 Enter로 다음.",
    `<div class="row">${[[10,"10문제"],[30,"30문제"],[0,"전부"]].map(([n,l])=>`<button class="chip" data-qs="${n}" aria-pressed="${quizSize===n}">${l}</button>`).join("")}<button class="btn" id="new-set">새로 섞기</button><button class="btn berry" data-go="essay">서답형 쓰기</button></div>`)+
    (Q.mode==="wrong"?"":scopeBar(`이 범위 ${pool}문항`));
  if(!Q.items.length)m.innerHTML=top+empty("문제가 없어요","범위를 넓혀 보세요.");
  else if(!it){const c=Q.results.filter(Boolean).length;
    m.innerHTML=top+empty(`${c} / ${Q.results.length}`,c===Q.results.length?"모두 맞혔어요!":`틀린 ${Q.results.length-c}문제는 약점 복습에 모아 뒀어요.`,`<button class="btn sun" id="again">이어서 계속</button><button class="btn berry" data-go="essay">다음: 서답형</button>`);}
  else{const ans=Q.picked!=null,ord=Q.order[Q.idx];
    m.innerHTML=top+`<div class="qbox" style="${scol(it.s)}"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="small">${esc(subjName(it.s))} · ${esc(it.ch)} ${gtag(it.g)}</span><div class="dots">${Q.items.map((_,i)=>`<i class="${i<Q.results.length?(Q.results[i]?"c":"w"):""} ${i===Q.idx?"cur":""}"></i>`).join("")}</div></div>
      <div class="q">${esc(it.q)}</div>
      <div class="choices">${ord.map((ci,k)=>`<button class="choice ${ans&&ci===it.a?"right":""} ${ans&&ci===Q.picked&&ci!==it.a?"wrong":""}" data-c="${ci}" ${ans?"disabled":""}><span class="n">${"①②③④"[k]}</span><span>${esc(it.c[ci])}</span></button>`).join("")}</div>
      ${ans?`<div class="exp"><b class="${Q.picked===it.a?"ok":"no"}">${Q.picked===it.a?"정답이에요!":"아쉬워요"}</b> — ${esc(it.e||"정답: "+it.c[it.a])}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sun" id="next">${Q.idx+1<Q.items.length?"다음 문제":"결과 보기"} <kbd>Enter</kbd></button></div>`:""}</div>`;}
  bindScope(m,()=>{startQuiz("normal");render();});
  m.querySelector("#new-set").onclick=()=>{startQuiz("normal");render();};
  m.querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>{quizSize=+b.dataset.qs;startQuiz("normal");render();});
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>answer(+b.dataset.c));
  const n=m.querySelector("#next");if(n)n.onclick=()=>{Q.idx++;Q.picked=null;render();};
  const a=m.querySelector("#again");if(a)a.onclick=()=>{startQuiz("normal");render();};
};
function answer(i){
  const it=Q.items[Q.idx];Q.picked=i;const ok=i===it.a;Q.results.push(ok);
  const r=S.quiz[it.id]||{c:0,w:0};ok?r.c++:r.w++;S.quiz[it.id]=r;
  if(!ok&&!S.wrong.includes(it.id))S.wrong.push(it.id);
  if(ok&&Q.mode==="wrong")S.wrong=S.wrong.filter(x=>x!==it.id);
  save("quiz");render();
}
KEYS.quiz=e=>{
  if(!Q||!Q.items[Q.idx])return;
  if(Q.picked==null&&/^[1-4]$/.test(e.key)){const ci=Q.order[Q.idx][+e.key-1];if(ci!=null)answer(ci);}
  else if(Q.picked!=null&&e.key==="Enter"){Q.idx++;Q.picked=null;render();}
};

      try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+":tab");localStorage.removeItem(BASE+":auto");}catch(e){}
      location.reload();
    }catch(e){pDel=false;render();toast(e&&e.code==="auth/requires-recent-login"?"보안을 위해 로그아웃 후 다시 로그인한 뒤 지워 주세요":"지우지 못했어요. 잠시 후 다시 해 주세요");}
  });
};

/* ================= 로그인 · 회원가입 (Firebase) ================= */
const b64e=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>String(s||"").trim().normalize("NFC");
let BLOB=null,RAWKEY=null,FB=null,CODESLOT=null;
async function loadFB(){
  if(FB)return FB;
  const u=n=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
  const [app,auth,fs]=await Promise.all([import(u("app")),import(u("auth")),import(u("firestore"))]);
  const a=app.initializeApp(FB_CONFIG);
  FB=Object.assign({},auth,fs,{auth:auth.getAuth(a),db:fs.getFirestore(a)});
  return FB;
}
async function emailOf(id){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hapgyeok:"+id)));return "u"+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,"0")).join("")+"@hapgyeok-note.app";}
async function pbk(secret,salt,usage){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,usage);
}
const keyFromRaw=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function openBlob(key){
  const b=new Uint8Array(BLOB),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},key,b.slice(28));
  return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
}
async function adminRaw(id,pw){const k=await pbk(id+"\n"+pw,new Uint8Array(BLOB).slice(0,16),["decrypt"]);await openBlob(k);return new Uint8Array(await crypto.subtle.exportKey("raw",k));}
async function codeRaw(code){
  if(!CODESLOT){const r=await fetch("code.json",{cache:"no-cache"});if(!r.ok)throw 0;CODESLOT=await r.json();}
  const w=await pbk("code\n"+code,b64d(CODESLOT.salt),["decrypt"]);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(CODESLOT.iv)},w,b64d(CODESLOT.ct)));
  await openBlob(await keyFromRaw(raw));return raw;
}
async function unwrapKey(wrap,id,pw){const w=await pbk(id+"\n"+pw,b64d(wrap.salt),["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(wrap.iv)},w,b64d(wrap.ct)));}
async function wrapKey(raw,id,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const w=await pbk(id+"\n"+pw,salt,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},w,raw);return{salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};}
function persistDevice(keep){try{localStorage.setItem(BASE+":key",b64e(RAWKEY));if(keep)localStorage.setItem(BASE+":auto","1");else localStorage.removeItem(BASE+":auto");}catch(e){}}
const netMsg=e=>{const c=(e&&e.code)||"";return c.includes("network")?"인터넷 연결을 확인해 주세요.":c.includes("too-many-requests")?"잠시 후 다시 시도해 주세요.":"문제가 생겼어요. 잠시 후 다시 해 주세요.";};
function start(c){
  document.querySelector(".app").classList.remove("locked");
  if(!D)indexData(c);
  S.wrong=S.wrong.filter(id=>BY.quiz[id]);
  if(S.scope.s&&!SUBJ[S.scope.s])S.scope={s:"",g:false};
  resetQueues();renderBackup();render();renderTimer();window.scrollTo({top:0});
}
async function enterFB(uid,info,raw,keep){
  ME={uid,id:info.id,c:info.c||"sun",t:info.t||Date.now()};KEY=BASE+"@fb:"+uid;RAWKEY=raw;persistDevice(keep);
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  let cloud=null,cess=null;
  try{const [p,e]=await Promise.all([FB.getDoc(FB.doc(FB.db,"users",uid,"data","progress")),FB.getDoc(FB.doc(FB.db,"users",uid,"data","essays"))]);
    if(p.exists())cloud=JSON.parse(p.data().json);if(e.exists())cess=JSON.parse(e.data().json);}catch(e){}
  S=blank();cloudDirty=false;essDirty=false;
  if(cloud&&(!local||(cloud.updatedAt||0)>=(local.updatedAt||0))){cloud.essays=cess||(local&&local.essays)||{};adopt(cloud);}
  else if(local){adopt(local);cloudDirty=true;essDirty=true;}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  try{const v=localStorage.getItem(KEY+":tab");view=VIEWS.includes(v)?v:"home";}catch(e){view="home";}
  const c=D?null:await openBlob(await keyFromRaw(raw));
  start(c);setSync(cloudDirty?"wait":"ok");if(cloudDirty)cloudFlush();
  toast(`${ME.id}님, 반가워요!`);
}
let needCodeLogin=false;
async function keyWorks(raw){try{await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(BLOB).slice(16,28)},await keyFromRaw(raw),new Uint8Array(BLOB).slice(28));return true;}catch(e){return false;}}
async function doLogin(id,pw,keep,code){
  const fb=await loadFB(),email=await emailOf(id);
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred=null;
  try{cred=await fb.signInWithEmailAndPassword(fb.auth,email,pw);}
  catch(e){const c=e.code||"";if(!/invalid-credential|user-not-found|wrong-password|invalid-login|invalid-email/.test(c))throw new Error(netMsg(e));}
  if(cred){
    const ref=fb.doc(fb.db,"users",cred.user.uid),snap=await fb.getDoc(ref);let info=snap.exists()?snap.data():null,raw;
    if(info&&info.wrap){try{raw=await unwrapKey(info.wrap,id,pw);}catch(e){raw=null;}}
    if(!raw||!(await keyWorks(raw))){
      /* 자료가 새로 만들어져 서버의 열쇠가 낡음 → 관리자 비밀번호로, 아니면 확인 코드로 새 열쇠를 받는다 */
      try{raw=await adminRaw(id,pw);}
      catch(e){
        if(!code){needCodeLogin=true;throw new Error("학습 자료가 새로 갱신되었어요. 확인 코드를 한 번 더 넣고 로그인해 주세요.");}
        try{raw=await codeRaw(code);}catch(e2){throw new Error("확인 코드가 맞지 않아요.");}
      }
      info=Object.assign(info||{id,c:"sun",t:Date.now()},{wrap:await wrapKey(raw,id,pw)});await fb.setDoc(ref,info);
    }
    needCodeLogin=false;
    return enterFB(cred.user.uid,info,raw,keep);
  }
  /* 서버에 아직 없는 아이디 → 관리자 첫 로그인이면 서버 계정을 만든다 */
  let raw;try{raw=await adminRaw(id,pw);}catch(e){throw new Error("아이디 또는 비밀번호가 맞지 않아요.");}
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,email,pw);}catch(e){throw new Error(e.code==="auth/email-already-in-use"?"아이디 또는 비밀번호가 맞지 않아요.":netMsg(e));}
  const info={id,c:"sun",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}
async function doSignup(id,pw,code,color,keep){
  const raw=RAWKEY||await codeRaw(code).catch(()=>{throw new Error("확인 코드가 맞지 않아요.");});
  const fb=await loadFB();
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred;
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,await emailOf(id),pw);}
  catch(e){throw new Error(e.code==="auth/email-already-in-use"?"이미 있는 아이디예요. 다른 아이디를 정해 주세요.":e.code==="auth/weak-password"?"비밀번호를 6자 이상으로 정해 주세요.":netMsg(e));}
  const info={id,c:color,t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}

      <span class="row" style="gap:6px;justify-content:center">${PCOLORS.map((c,i)=>`<label style="cursor:pointer" aria-label="${c}"><input type="radio" name="pcol" value="${c}" ${i===1?"checked":""} style="position:absolute;opacity:0"><span class="pcolor" style="display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--${c})"></span></label>`).join("")}</span>

        <label for="vcode" class="small">확인 코드</label><input type="password" id="vcode" ${inputCss} inputmode="numeric" autocomplete="off" required></div>`:`<p class="small" style="margin:0">인증된 기기라 바로 가입할 수 있어요.</p>`}`}
    <label class="check" style="justify-content:center"><input type="checkbox" id="remember" checked> 이 기기에서 자동 로그인</label>

  const paint=()=>m.querySelectorAll(".pcolor").forEach(s=>{s.style.boxShadow=s.previousElementSibling.checked?"0 0 0 2px var(--paper),0 0 0 4px var(--ink)":"none";});
  paint();m.querySelectorAll("input[name=pcol]").forEach(r=>r.onchange=paint);

  const back=m.querySelector("#back");if(back)back.onclick=()=>{document.querySelector(".app").classList.remove("locked");render();};
  m.querySelector("#lock").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=m.querySelector("#go-btn"),err=m.querySelector("#err"),keep=m.querySelector("#remember").checked,label=btn.textContent;
    const fail=msg=>{btn.disabled=false;btn.textContent=label;err.textContent=msg;};
    btn.disabled=true;btn.textContent="잠시만요…";err.textContent="";
    try{
      if(mode==="login"){const lc=m.querySelector("#lcode");await doLogin(norm(m.querySelector("#uid").value),m.querySelector("#pw").value,keep,lc?norm(lc.value):"");}
      else{
        const id=norm(m.querySelector("#nid").value),pw=m.querySelector("#npw").value,pw2=m.querySelector("#npw2").value;
        if(!id)return fail("새 아이디를 넣어 주세요.");
        if(id==="관리자")return fail("이 아이디는 쓸 수 없어요.");
        if(pw.length<6)return fail("비밀번호는 6자 이상으로 정해 주세요.");
        if(pw!==pw2)return fail("두 비밀번호가 달라요.");

(async()=>{
  renderTimer();
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){document.getElementById("main").innerHTML=empty("브라우저가 오래됐어요","최신 크롬·사파리·엣지에서 열어 주세요.");return;}
  try{const r=await fetch("content.bin",{cache:"no-cache"});if(!r.ok)throw 0;BLOB=await r.arrayBuffer();}
  catch(e){document.getElementById("main").innerHTML=empty("자료를 못 불러왔어요","인터넷 연결을 확인하고 새로 고쳐 주세요.");return;}
  let saved=null,auto=null;try{saved=localStorage.getItem(BASE+":key");auto=localStorage.getItem(BASE+":auto");}catch(e){}
  if(saved){
    try{const raw=b64d(saved);await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(BLOB).slice(16,28)},await keyFromRaw(raw),new Uint8Array(BLOB).slice(28));RAWKEY=raw;}
    catch(e){try{localStorage.removeItem(BASE+":key");}catch(x){}}
  }
  if(RAWKEY&&auto){

  }

})();
