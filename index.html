<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFD54F">
<title>유아임용 합격노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style id="fontface"></style>
<style>
/* ================================================================
   유아임용 합격노트 — 디자인 (v3)
   차분한 학습 도구: 옅은 회색 바탕 · 흰 카드 · 가는 테두리 · 청록 강조
   ================================================================ */
:root{
  color-scheme:light;
  --ground:#F5F6F8;--paper:#FFFFFF;--sunk:#F0F2F5;
  --ink:#171A20;--ink-2:#495060;--ink-3:#868D99;
  --line:#E3E6EB;--line-2:#D2D6DD;
  --accent:#0F766E;--accent-d:#0B5A54;--accent-s:#E6F3F1;
  --good:#1F7A48;--good-s:#E7F4EC;--bad:#BE3452;--bad-s:#FCEBEF;--warn:#A86A12;--warn-s:#FBF1E0;
  /* 과목 색 (옅게) */
  --sky:#3B78C0;--sky-d:#23599A;--sky-s:#EBF2FB;
  --sun:#B8860B;--sun-d:#8A6408;--sun-s:#FBF4E1;
  --grass:#2E8B57;--grass-d:#1D6841;--grass-s:#E8F5EE;
  --berry:#C0445F;--berry-d:#93304A;--berry-s:#FCEEF1;
  --grape:#7456C0;--grape-d:#573C9B;--grape-s:#F2EEFB;
  --tang:#C46A28;--tang-d:#974E16;--tang-s:#FCF0E6;
  --r:12px;--r-sm:8px;
  --sh:0 1px 2px rgba(20,24,32,.04),0 2px 8px rgba(20,24,32,.04);
  --f:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-title:var(--f);--f-fun:var(--f);--f-body:var(--f);
  --pad:clamp(16px,2.6vw,36px);
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.3;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.fun{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13.5px;color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
kbd{font-family:var(--f);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-3);background:var(--paper);margin-left:2px}
mark{background:#FFF1B8;color:inherit;border-radius:3px;padding:0 2px}

/* ---------------- 뼈대 ---------------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:22px 16px;background:var(--paper);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink-3)}
.who{display:flex;align-items:center;justify-content:flex-start;gap:4px;font-size:13px;color:var(--ink-2);padding:8px 10px;background:var(--sunk);border-radius:var(--r-sm)}
.who b{color:var(--ink)}
.who .btn{margin-left:auto}
.navbox{display:flex;flex-direction:column;gap:1px}
.navgrp{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:var(--r-sm);font-size:14.5px;font-weight:600;color:var(--ink-2)}
.nav i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-3);flex:0 0 auto;font-style:normal;font-size:12px;font-weight:700}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-s);color:var(--accent-d)}
.nav[aria-current="page"] i{background:var(--accent);color:#fff}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--sunk);border-radius:99px;padding:0 7px;color:var(--ink-2)}
.nav .badge.hot{background:var(--bad);color:#fff}
.util{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.timer{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.timer .lbl{font-weight:600;color:var(--ink-2)}
.timer .t{font-size:30px;font-weight:700;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.timer .t.run{color:var(--accent)}
.timer .modes{display:flex;gap:6px;justify-content:center}
.cloud{font-size:12.5px}
main{min-width:0;width:100%;max-width:1480px;margin:0 auto;padding:clamp(20px,3vw,40px) var(--pad) 72px;display:flex;flex-direction:column;gap:20px}

/* ---------------- 공통 부품 ---------------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.head h2{font-size:clamp(22px,2.4vw,28px)}
.head p{margin:4px 0 0;color:var(--ink-2);font-size:15px;max-width:68ch}
.tagline{display:inline-block;font-size:12.5px;font-weight:700;color:var(--c-d,var(--accent-d));margin-bottom:4px;letter-spacing:.02em}
.box,.qbox,.tcard,.kwcard,.mmc,.flash{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.box{padding:clamp(16px,2vw,24px)}
.box h3{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r-sm);padding:8px 14px;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3);background:var(--sunk)}
.btn.sun,.btn.sky{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sun:hover,.btn.sky:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.grass{background:var(--good-s);border-color:#BFE0CC;color:var(--good)}
.btn.berry{background:var(--bad-s);border-color:#F2C6D0;color:var(--bad)}
.btn.soft{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.soft:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.qbox .btn.sm.soft,.tcard .btn.sm.soft,.mmc .btn.sm.soft{border-color:var(--line-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sun kbd,.btn.sky kbd{background:transparent;color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.45)}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.scope{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.scope .l{font-size:13px;font-weight:600;color:var(--ink-3)}
select{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 10px;background:var(--paper);max-width:100%;min-width:0;font-size:14px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.part-chips{display:flex;flex-wrap:wrap;gap:6px}
.gtag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--bad);background:var(--bad-s);border-radius:5px;padding:0 6px;vertical-align:2px}
.newtag{font-size:11.5px;font-weight:700;color:var(--accent-d);background:var(--accent-s);border-radius:5px;padding:1px 7px}
.empty{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:40px 20px}
.empty .big{font-size:26px;font-weight:800}
.loading{padding:48px 0;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:var(--r-sm);padding:12px 14px}
.li .t{font-size:12.5px;color:var(--ink-3)}
.li p{margin:4px 0}
.ans{color:var(--good)}
.search{display:flex;flex-direction:column;gap:6px}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-s)}

/* ---------------- 홈 ---------------- */
.hello{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.greet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2vw,24px);display:flex;gap:16px;align-items:center;box-shadow:var(--sh)}
.greet svg{display:none}
.greet h2{font-size:clamp(20px,2vw,24px)}
.greet p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.dday{background:var(--accent);color:#fff;border-radius:var(--r);padding:clamp(18px,2vw,24px);display:flex;flex-direction:column;justify-content:center;gap:4px}
.dday .small{color:rgba(255,255,255,.8)}
.dday .big{font-size:clamp(36px,4vw,48px);font-weight:800;line-height:1;letter-spacing:-.02em}
.dday label{font-size:13px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.dday input{border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 8px;background:rgba(255,255,255,.12);color:#fff;color-scheme:dark}
.cram{background:var(--bad-s);border:1px solid #F2C6D0;border-radius:var(--r);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.course{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.course.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.step{position:relative;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh)}
.step .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c-s);color:var(--c-d);font-size:12.5px;font-weight:800}
.step h4{font-size:16px}
.step .cnt{font-size:13.5px;color:var(--ink-2);min-height:2.6em}
.step .bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.step .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.step .btn{margin-top:auto}
.step.done::after{content:"완료";position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-s);border-radius:99px;padding:1px 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .sk{font-size:12.5px;color:var(--ink-3);font-weight:600}
.stat .v{font-size:24px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12.5px;color:var(--ink-3);font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative;min-width:60px}
.meter i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:var(--mc,var(--accent))}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:120px;margin-top:14px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars span.b{width:100%;max-width:20px;background:var(--accent);opacity:.75;border-radius:4px 4px 2px 2px;min-height:3px}
.bars span.b.zero{background:var(--line-2);opacity:1}
.bars span.b.today{opacity:1}
.bars em{font-style:normal;font-size:11px;color:var(--ink-3)}
.prio{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.prio button{display:grid;grid-template-columns:minmax(0,1fr) 64px 52px;gap:10px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:8px 12px;text-align:left;font-size:14px}
.prio button:hover{border-color:var(--accent);background:var(--accent-s)}
.prio .gcount{color:var(--bad);font-weight:700;text-align:right;font-size:13px}
.prio .mast{color:var(--good);font-weight:700;text-align:right;font-size:13px}
.weak{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.weak div{font-size:14px;padding:8px 12px;border-radius:var(--r-sm);background:var(--sunk)}

/* ---------------- 목록 + 본문 두 칸 ---------------- */
.cgrid,.egrid,.mmwrap{display:grid;grid-template-columns:clamp(220px,22vw,300px) minmax(0,1fr);gap:16px;align-items:start}
.clist,.plist,.mmlist{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:16px;padding-right:4px}
.pick{border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:8px 10px;text-align:left;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--ink-2)}
.pick:hover{background:var(--paper);border-color:var(--line)}
.pick[aria-pressed="true"]{background:var(--paper);border-color:var(--accent);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.pick small{display:block;color:var(--ink-3);font-size:12px}
.pick .ok{color:var(--good);font-weight:700}
.pager{display:flex;gap:8px;justify-content:center;align-items:center}

/* ---------------- 개념 지도 ---------------- */
.concept{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:16px}
.concept.flash-hl{box-shadow:0 0 0 3px var(--accent-s),0 0 0 4px var(--accent)}
.concept .cn{font-size:17px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.concept .who{font-size:13px;color:var(--ink-3);background:none;padding:0}
.concept .def{font-size:15px;color:var(--ink-2)}
.concept .lst{margin:0;padding-left:20px;font-size:15px}
.concept .lst li{margin:2px 0}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{font-size:13px;background:var(--c-s,var(--accent-s));color:var(--c-d,var(--accent-d));border-radius:6px;padding:1px 8px}
.confs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.confs button{border:1px dashed var(--bad);background:var(--bad-s);color:var(--bad);border-radius:6px;padding:0 8px;font-size:13px}
.gq{font-size:13.5px;background:var(--sunk);border-radius:var(--r-sm);padding:8px 12px}
.hideable.cover .hx{background:var(--sunk);color:transparent!important;border-radius:4px;cursor:pointer;user-select:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.hideable.cover .hx *{visibility:hidden}
.hideable.cover .hx.shown{background:none;color:inherit!important;box-shadow:none}
.hideable.cover .hx.shown *{visibility:visible}
.outline{columns:3 280px;column-gap:24px}
.outline .och{break-inside:avoid;margin:0 0 16px}
.outline .och b{font-size:14.5px;display:block;margin-bottom:4px}
.outline .och button{display:block;border:0;background:none;padding:2px 0;text-align:left;font-size:14px;color:var(--ink-2)}
.outline .och button:hover{color:var(--accent)}

/* ---------------- 키워드 ---------------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.kwcard{padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin-inline:auto}
.crumb{font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.crumb span+span::before{content:"›";margin-right:6px;color:var(--line-2)}
.kwhead{font-size:clamp(19px,2vw,24px);font-weight:700;line-height:1.4}
.kwcount{font-size:14px;font-weight:600;color:var(--accent-d)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px dashed var(--line-2);background:var(--sunk);border-radius:var(--r-sm);padding:6px 12px;font-size:15px;color:transparent;min-width:84px;text-align:left;position:relative;line-height:1.5}
.slot .n{color:var(--ink-3);font-size:12px;margin-right:6px}
.slot .hint{position:absolute;left:30px;top:6px;color:var(--grape)}
.slot.open{border-style:solid;border-color:var(--accent);background:var(--accent-s);color:var(--ink)}
.slot.open .hint{display:none}
.initials{font-size:18px;font-weight:700;color:var(--grape-d);letter-spacing:.06em;background:var(--grape-s);border-radius:var(--r-sm);padding:6px 12px;align-self:flex-start}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:820px;width:100%;margin-inline:auto}
.grade .btn{padding:11px;font-size:15px}
.suggest{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)!important}
.boxes{display:flex;gap:3px}
.boxes i{width:14px;height:5px;border-radius:3px;background:var(--line-2)}
.boxes i.on{background:var(--good)}
.kwlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.kwitem{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kwitem .h{font-size:15px;font-weight:700}
.kwitem .chips{display:flex;flex-wrap:wrap;gap:5px}
.kwitem .chips span{font-size:13px;background:var(--sunk);border-radius:6px;padding:1px 8px}
.cover .kwitem .chips span{color:transparent;background:var(--line);cursor:pointer;user-select:none}
.cover .kwitem .chips span.shown{color:var(--ink);background:var(--accent-s)}

/* ---------------- 카드 ---------------- */
.flash{width:100%;max-width:820px;min-height:280px;padding:clamp(20px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left}
.flash .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3)}
.flash .front{font-size:clamp(19px,2vw,24px);font-weight:700;line-height:1.45}
.flash .back{border-top:1px solid var(--line);padding-top:14px;white-space:pre-line;font-size:16px;color:var(--ink-2)}
.flash .hintline{color:var(--grape-d);background:var(--grape-s);border-radius:var(--r-sm);padding:6px 12px;align-self:flex-start;white-space:pre-line;font-weight:600}
.flash .foot{margin-top:auto;font-size:13px;color:var(--ink-3)}

/* ---------------- 표 ---------------- */
.tcard{padding:clamp(16px,2vw,22px);display:flex;flex-direction:column;gap:12px;min-width:0}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line)}
table.study{border-collapse:collapse;width:100%;min-width:520px;background:var(--paper);font-size:14.5px}
table.study th{background:var(--sunk);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13.5px;color:var(--ink-2)}
table.study td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}

<script>
const FB_CONFIG={"apiKey": "AIzaSyDtFXzKPCHRbJnQdniJN8AtzlP6mYWciSk", "authDomain": "hapgyeok-note-0925k.firebaseapp.com", "projectId": "hapgyeok-note-0925k", "storageBucket": "hapgyeok-note-0925k.firebasestorage.app", "messagingSenderId": "1018750410558", "appId": "1:1018750410558:web:ca8aea98c6531d12b8966f"};
const FB_VER="12.19.0";
/* ================================================================
   유아임용 합격노트 v2 — 암기·구조화 학습 앱
   구성: 기본(데이터·저장·채점) → 화면들 → 로그인(Firebase)
   ================================================================ */

/* ---------- 누리과정 5개 영역 (화면 장식·색) ---------- */
const SCOLOR={dev:"sky",phil:"grape",play:"sun",teacher:"berry",parent:"tang",welfare:"grass",incl:"sky",eval:"grape",curr:"grass",prog:"tang",safety:"berry",nuri:"sun",body:"tang",comm:"sky",soc:"sun",art:"grape",nat:"grass"};
const cvars=c=>`--c:var(--${c});--c-d:var(--${c}-d);--c-s:var(--${c}-s)`;
const scol=s=>cvars(SCOLOR[s]||"sky");

/* ---------- 데이터 (로그인 후 복호화해서 채움) ---------- */
let D=null,SUBJ={},BY={};  // BY: 종류별 id → 항목
function indexData(d){
  D=d;SUBJ={};d.subjects.forEach(s=>SUBJ[s.id]=s);
  BY={concept:{},card:{},quiz:{},essay:{},table:{},notice:{},kw:{},mm:{},gichul:{}};
  d.gichul=d.gichul||[];d.gichulAns=d.gichulAns||{};d.gichul.forEach(x=>BY.gichul[x.id]=x);
  d.concepts.forEach(x=>BY.concept[x.id]=x);d.cards.forEach(x=>BY.card[x.id]=x);d.quiz.forEach(x=>BY.quiz[x.id]=x);
  d.essays.forEach(x=>BY.essay[x.id]=x);d.tables.forEach(x=>BY.table[x.id]=x);d.notice.forEach(x=>BY.notice[x.id]=x);
  d.kwsets.forEach(x=>BY.kw[x.id]=x);d.mindmaps.forEach(x=>BY.mm[x.id]=x);
}

/* ---------- 상태 (계정별) ---------- */
const BASE="yuah-imyong-v2";
const PCOLORS=["sun","sky","grass","berry","grape","tang"];
let ME=null,KEY=BASE+":guest";
const curProfile=()=>ME?{name:ME.id,c:ME.c,t:ME.t}:{name:"손님",c:"sun",t:Date.now()};
const blank=()=>({v:3,updatedAt:0,exam:"",scope:{s:"",g:false},typing:true,srs:{},newLog:{},quiz:{},wrong:[],essays:{},mmr:{},log:{},day:{},focus:{}});
let S=blank();
function adopt(o){S=Object.assign(blank(),o||{});if(S.v!==3)S=blank();}
function today(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return today(d)}
function bump(kind,n=1){const t=today();S.log[t]=(S.log[t]||0)+n;if(kind){S.day[t]=S.day[t]||{};S.day[t][kind]=(S.day[t][kind]||0)+n;}}
const dayN=kind=>((S.day[today()]||{})[kind])||0;

/* 저장: 이 기기 + Firebase 서버 */
let saveTimer=null,cloudBusy=false,cloudDirty=false,essDirty=false,cloudState="";
function save(kind,ess){
  if(kind)bump(kind===true?null:kind);
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  cloudDirty=true;if(ess)essDirty=true;setSync("wait");
  clearTimeout(saveTimer);saveTimer=setTimeout(cloudFlush,1200);
  renderNav();
}
async function cloudFlush(){
  if(!FB||!ME||cloudBusy||!cloudDirty)return;
  cloudBusy=true;cloudDirty=false;const e=essDirty;essDirty=false;
  try{
    const body=Object.assign({},S);delete body.essays;
    await FB.setDoc(FB.doc(FB.db,"users",ME.uid,"data","progress"),{json:JSON.stringify(body),updatedAt:S.updatedAt});
    if(e)await FB.setDoc(FB.doc(FB.db,"users",ME.uid,"data","essays"),{json:JSON.stringify(S.essays||{}),updatedAt:S.updatedAt});
    setSync(cloudDirty?"wait":"ok");
  }catch(err){cloudDirty=true;if(e)essDirty=true;setSync("err");setTimeout(cloudFlush,15000);}
  cloudBusy=false;if(cloudDirty)setTimeout(cloudFlush,300);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")cloudFlush();});
function setSync(st){cloudState=st;document.querySelectorAll(".cloud").forEach(el=>{
  el.textContent=st==="ok"?"서버에 저장됨":st==="err"?"서버 저장 실패 · 인터넷 확인 (다시 시도 중)":"서버에 저장 중…";
  el.style.color=st==="err"?"var(--berry-d)":st==="ok"?"var(--grass-d)":"var(--ink-3)";});}

/* ---------- 유틸 ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const gtag=g=>g?`<span class="gtag">기출 ${esc(g)}</span>`:"";
const subjName=id=>SUBJ[id]?SUBJ[id].name:"";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BUL=/^\s*(?:[①-⑳]|[0-9]{1,2}[.)]|[-•·▪■◆◇○●※▶→]|\([0-9가-하]\)|[가-하][.)])\s*/;
const core=t=>String(t).replace(BUL,"").trim();
function hints(items){
  const cs=items.map(i=>core(i).replace(/^[\s"'“‘(\[]+/,""));
  let p=0;const minL=Math.min(...cs.map(c=>c.length));
  while(p<minL-1&&cs.every(c=>c[p]===cs[0][p]))p++;
  return cs.map(c=>{const r=c.slice(p).replace(/^[\s의·\-]+/,"");return r?r[0]:(c[0]||"?");});
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
const inS=(x,sc)=>{sc=sc||S.scope;return(!sc.s||x.s===sc.s)&&(!sc.g||!!(x.g||(x.gichul&&x.gichul.length)))};
function streak(){let n=0,d=today();if(!S.log[d])d=addDays(d,-1);while(S.log[d]){n++;d=addDays(d,-1)}return n}
function quizAcc(){let c=0,w=0;for(const k in S.quiz){c+=S.quiz[k].c||0;w+=S.quiz[k].w||0}return c+w?Math.round(c/(c+w)*100):null}
function ddays(){if(!S.exam)return null;return Math.round((new Date(S.exam+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);}

/* ---------- 타이핑 채점 ---------- */
const nz=s=>core(String(s||"")).toLowerCase().replace(/[\s·・,，.。\-–—:;'"“”‘’「」『』<>《》〈〉\[\]{}→←↔=~!?…/\\]/g,"");
const nzp=s=>nz(String(s||"").replace(/\([^)]*\)/g,""));
function sim(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  const m=a.length,n=b.length;let dp=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=n;j++){const t=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}
  return 1-dp[n]/Math.max(m,n);
}
/* 여러 항목을 한꺼번에 타이핑했을 때: 각 목표 항목이 들어 있는지 */
function matchItems(input,targets){
  const whole=nz(input),parts=String(input||"").split(/[\n,，、\/;]+/).map(nz).filter(Boolean);
  return targets.map(t=>{
    const xs=[nz(t),nzp(t)].filter(Boolean);if(!xs.length)return true;
    return xs.some(x=>whole.includes(x)||parts.some(p=>sim(p,x)>=0.8||(x.length>=4&&p.length>=3&&x.includes(p)&&p.length/x.length>=0.7)));
  });
}
/* 한 칸 답: 0~1 점수 */
function cellScore(input,target){
  const a=nz(input),b=nz(target),bp=nzp(target);if(!a)return 0;
  if(a===b||a===bp||b.includes(a)&&a.length/b.length>=0.7||a.includes(bp)&&bp.length>=2)return 1;
  return Math.max(sim(a,b),sim(a,bp));
}
const scoreCls=r=>r>=0.85?"good":r>=0.5?"mid":"bad";
const gradeFrom=r=>r>=0.85?2:r>=0.5?1:0;

/* ---------- 간격 반복 (몰랐어요 0 · 반쯤 1 · 알아요 2) ---------- */
const INTERVALS=[0,1,3,7,14,30];
function srsGrade(key,g){
  const t=today(),st=S.srs[key],kind=key.split(":")[0];
  if(!st){S.newLog[t]=S.newLog[t]||{};S.newLog[t][kind]=(S.newLog[t][kind]||0)+1;}
  let b=st?st.b:0,l=st?(st.l||0):0;
  if(g===0){b=1;l++;}else if(g===2)b=Math.min(5,Math.max(1,b)+1);else b=Math.max(1,b);
  S.srs[key]={b,d:addDays(t,g===0?0:INTERVALS[b]),l};
}
const st=key=>S.srs[key];
const isDue=key=>{const x=S.srs[key];return x&&x.d<=today();};
const isNew=key=>!S.srs[key];
const mastered=key=>{const x=S.srs[key];return x&&x.b>=4;};
function queueOf(list,prefix,filter){
  const due=list.filter(x=>filter(x)&&isDue(prefix+x.id)).sort((a,b)=>S.srs[prefix+a.id].b-S.srs[prefix+b.id].b);
  return due.concat(list.filter(x=>filter(x)&&isNew(prefix+x.id)));
}

let tLen=25*60,tLeft=25*60,tRun=null,tSec=0;
function renderTimer(){
  const el=document.getElementById("timer");
  const mm=String(Math.floor(tLeft/60)).padStart(2,"0"),ss=String(tLeft%60).padStart(2,"0");
  el.innerHTML=`<div class="small lbl fun">집중 타이머 · 오늘 ${S.focus[today()]||0}분</div>
    <div class="t num ${tRun?"run":""}">${mm}:${ss}</div>
    <div class="modes">${[25,50].map(n=>`<button class="chip" data-tm="${n}" aria-pressed="${tLen===n*60}" style="font-size:13px;padding:2px 10px">${n}분</button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn sm ${tRun?"":"sun"}" id="t-go">${tRun?"잠깐 멈춤":"시작"}</button><button class="btn sm soft" id="t-reset">처음부터</button></div>`;
  el.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{if(tRun)return;tLen=tLeft=+b.dataset.tm*60;renderTimer();});
  el.querySelector("#t-go").onclick=()=>{if(tRun){clearInterval(tRun);tRun=null;}else tRun=setInterval(tick,1000);renderTimer();};
  el.querySelector("#t-reset").onclick=()=>{clearInterval(tRun);tRun=null;tLeft=tLen;renderTimer();};
}
function tick(){
  tLeft--;tSec++;
  if(tSec>=60){tSec=0;const t=today();S.focus[t]=(S.focus[t]||0)+1;save();}
  if(tLeft<=0){clearInterval(tRun);tRun=null;tLeft=tLen;beep();toast("집중 시간 끝! 5분 쉬었다 가요");renderTimer();return;}
  const el=document.querySelector("#timer .t");if(el)el.textContent=String(Math.floor(tLeft/60)).padStart(2,"0")+":"+String(tLeft%60).padStart(2,"0");
}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2);}catch(e){}}

function chapterPriority(){
  // 단원별: 기출 수 × (1 - 숙달도) → 자주 나오는데 약한 곳
  const map={};
  D.concepts.forEach(c=>{const k=c.s+"|"+c.ch;const o=map[k]||(map[k]={s:c.s,ch:c.ch,g:0,n:0,m:0});o.g+=(c.gichul||[]).length;});
  D.kwsets.forEach(x=>{if(!x.ch)return;const o=map[x.s+"|"+x.ch];if(!o)return;o.n++;if(mastered("k:"+x.id))o.m++;});
  D.cards.forEach(x=>{const o=map[x.s+"|"+x.ch];if(!o)return;o.n++;if(mastered("c:"+x.id))o.m++;});
  return Object.values(map).filter(o=>o.g>0).map(o=>Object.assign(o,{mast:o.n?o.m/o.n:0,score:o.g*(1-(o.n?o.m/o.n:0))})).sort((a,b)=>b.score-a.score);
}

function ttRender(target){
  const el=document.getElementById("tt-target");if(!el)return;
  const typed=TT.typed,n=typed.length,chars=[...target];

  chars.forEach((ch,i)=>{
    let cls="",show=ch;

      const ok=typed[i]===ch;

  });

  const stat=document.getElementById("tt-stat");

/* ================= 기출 원문 (시험지 지문·그림 그대로) ================= */
const QIMG={};  // 경로 → blob URL (복호화 결과 캐시)
let IMGKEY=null;
async function qimgURL(path){
  if(QIMG[path])return QIMG[path];
  if(!IMGKEY){IMGKEY=await crypto.subtle.importKey("raw",b64d(D.imgkey),"AES-GCM",false,["decrypt"]);}
  const r=await fetch("q/"+path+".bin",{cache:"force-cache"});if(!r.ok)throw new Error("이미지를 불러오지 못했어요");
  const b=new Uint8Array(await r.arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},IMGKEY,b.slice(12));
  return QIMG[path]=URL.createObjectURL(new Blob([pt],{type:"image/webp"}));
}
function imgTag(path,alt,cls){
  const id="im"+Math.random().toString(36).slice(2,8);
  qimgURL(path).then(u=>{const el=document.getElementById(id);if(el){el.src=u;el.classList.remove("loading");}}).catch(()=>{const el=document.getElementById(id);if(el)el.alt="이미지를 불러오지 못했어요";});
  return `<img id="${id}" class="qimg loading ${cls||""}" alt="${esc(alt||"")}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">`;
}

/* ================= 퀴즈 (교차 · 과목 집중) ================= */
let Q=null,quizSize=10;
function startQuiz(mode){
  let pool=mode==="wrong"?D.quiz.filter(q=>S.wrong.includes(q.id)):D.quiz.filter(q=>inS(q));
  pool=shuffle(pool);if(mode!=="wrong"&&quizSize)pool=pool.slice(0,quizSize);
  Q={items:pool,idx:0,picked:null,results:[],mode,order:pool.map(q=>shuffle(q.c.map((_,i)=>i)))};
}
VIEWFN.quiz=function(m){
  if(!Q)startQuiz("normal");
  const it=Q.items[Q.idx],pool=D.quiz.filter(q=>inS(q)).length;
  const top=head(`확인하기 · ${Q.mode==="wrong"?"틀린 문제 다시":S.scope.s?"과목 집중":"전 과목 섞어서(교차 학습)"}`,"sun","퀴즈","과목을 '전체'로 두면 여러 과목이 섞여 나와 기억이 더 단단해져요. 숫자키 1~4로 고르고 Enter로 다음.",
    `<div class="row">${[[10,"10문제"],[30,"30문제"],[0,"전부"]].map(([n,l])=>`<button class="chip" data-qs="${n}" aria-pressed="${quizSize===n}">${l}</button>`).join("")}<button class="btn" id="new-set">새로 섞기</button><button class="btn berry" data-go="essay">서답형 쓰기</button></div>`)+
    (Q.mode==="wrong"?"":scopeBar(`이 범위 ${pool}문항`));
  if(!Q.items.length)m.innerHTML=top+empty("문제가 없어요","범위를 넓혀 보세요.");
  else if(!it){const c=Q.results.filter(Boolean).length;
    m.innerHTML=top+empty(`${c} / ${Q.results.length}`,c===Q.results.length?"모두 맞혔어요!":`틀린 ${Q.results.length-c}문제는 약점 복습에 모아 뒀어요.`,`<button class="btn sun" id="again">이어서 계속</button><button class="btn berry" data-go="essay">다음: 서답형</button>`);}
  else{const ans=Q.picked!=null,ord=Q.order[Q.idx];
    m.innerHTML=top+`<div class="qbox" style="${scol(it.s)}"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="small">${esc(subjName(it.s))} · ${esc(it.ch)} ${gtag(it.g)}</span><div class="dots">${Q.items.map((_,i)=>`<i class="${i<Q.results.length?(Q.results[i]?"c":"w"):""} ${i===Q.idx?"cur":""}"></i>`).join("")}</div></div>
      <div class="q">${esc(it.q)}</div>
      <div class="choices">${ord.map((ci,k)=>`<button class="choice ${ans&&ci===it.a?"right":""} ${ans&&ci===Q.picked&&ci!==it.a?"wrong":""}" data-c="${ci}" ${ans?"disabled":""}><span class="n">${"①②③④"[k]}</span><span>${esc(it.c[ci])}</span></button>`).join("")}</div>
      ${ans?`<div class="exp"><b class="${Q.picked===it.a?"ok":"no"}">${Q.picked===it.a?"정답이에요!":"아쉬워요"}</b> — ${esc(it.e||"정답: "+it.c[it.a])}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sun" id="next">${Q.idx+1<Q.items.length?"다음 문제":"결과 보기"} <kbd>Enter</kbd></button></div>`:""}</div>`;}
  bindScope(m,()=>{startQuiz("normal");render();});
  m.querySelector("#new-set").onclick=()=>{startQuiz("normal");render();};
  m.querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>{quizSize=+b.dataset.qs;startQuiz("normal");render();});
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>answer(+b.dataset.c));
  const n=m.querySelector("#next");if(n)n.onclick=()=>{Q.idx++;Q.picked=null;render();};
  const a=m.querySelector("#again");if(a)a.onclick=()=>{startQuiz("normal");render();};
};
function answer(i){
  const it=Q.items[Q.idx];Q.picked=i;const ok=i===it.a;Q.results.push(ok);
  const r=S.quiz[it.id]||{c:0,w:0};ok?r.c++:r.w++;S.quiz[it.id]=r;
  if(!ok&&!S.wrong.includes(it.id))S.wrong.push(it.id);
  if(ok&&Q.mode==="wrong")S.wrong=S.wrong.filter(x=>x!==it.id);
  save("quiz");render();
}
KEYS.quiz=e=>{
  if(!Q||!Q.items[Q.idx])return;
  if(Q.picked==null&&/^[1-4]$/.test(e.key)){const ci=Q.order[Q.idx][+e.key-1];if(ci!=null)answer(ci);}
  else if(Q.picked!=null&&e.key==="Enter"){Q.idx++;Q.picked=null;render();}
};

let essayId=null,showModel={},essayPrev=false,essayCover=false,essayImg=false;
VIEWFN.essay=function(m){
  const list=D.essays.filter(e=>!S.scope.s||e.s===S.scope.s);
  if(!list.find(e=>e.id===essayId))essayId=list[0]?list[0].id:null;
  const p=essayId?BY.essay[essayId]:null,text=p?(S.essays[p.id]||""):"";
  const hit=p?matchItems(text,p.kw):[],model=p&&showModel[p.id];
  const kwHTML=()=>p.kw.map((k,i)=>hit[i]?`<span class="kw hit">${esc(k)}</span>`:model?`<span class="kw miss">${esc(k)}</span>`:`<span class="kw hid">?</span>`).join("");
  m.innerHTML=head("확인하기 · 기출","berry","기출 서답형","답을 쓰면 맞힌 핵심어가 하나씩 나타나요. 다 쓴 뒤 모범답안과 비교하세요.",list.length>1?`<button class="btn" id="rand">무작위 한 문항</button>`:"")+

  (p?`<div class="egrid"><div class="plist">${list.map(x=>`<button class="pick" data-p="${x.id}" aria-pressed="${x.id===essayId}"><span><small>${esc(subjName(x.s))}${x.g?" · "+esc(x.g):""}${S.essays[x.id]?" · 작성함":""}</small>${esc(x.q.length>56?x.q.slice(0,56)+"…":x.q)}</span></button>`).join("")}</div>
    <div class="qbox" style="display:flex;flex-direction:column;gap:14px;${scol(p.s)}">
      <div class="row" style="justify-content:space-between"><span class="small">${esc(subjName(p.s))} · ${esc(p.ch)} ${gtag(p.g)}</span>
        <span class="row">${(p.qimg||[]).length?`<button class="btn sm ${essayImg?"":"soft"}" id="qimg-toggle">시험지 원문</button>`:""}${(p.rel||[]).length?`<button class="btn sm ${essayPrev?"":"soft"}" id="prev-toggle">앞 내용</button>`:""}</span></div>
      ${essayImg&&(p.qimg||[]).length?`<div class="qwrap">${p.qimg.map(id=>BY.gichul[id]).filter(Boolean).map(g=>`<div class="small fun">${esc(g.exam)}</div>${[g.file].concat(g.more||[]).map(f=>imgTag(f,g.exam)).join("")}`).join("")}</div>`:""}
      ${essayPrev&&(p.rel||[]).length?`<div class="prev"><div class="row" style="justify-content:space-between"><b class="fun">이 문제 앞의 전략노트 내용</b><label class="check"><input type="checkbox" id="prev-cover" ${essayCover?"checked":""}> 가리기</label></div>
        <div class="hideable ${essayCover?"cover":""}" id="prev-body" style="display:flex;flex-direction:column;gap:10px;margin-top:8px">${p.rel.map(id=>BY.concept[id]).filter(Boolean).map(c=>`<div class="concept" style="${scol(c.s)};padding:10px 12px"><div class="cn" style="font-size:17px">${esc(c.name)}${c.who?` <span class="who">${esc(c.who)}</span>`:""}</div>${c.def?`<div class="def hx" style="font-size:15px">${esc(c.def)}</div>`:""}${c.list&&c.list.items.length?`<ul class="lst" style="font-size:15px">${c.list.items.map(i=>`<li><span class="hx">${esc(i)}</span></li>`).join("")}</ul>`:""}${c.kw&&c.kw.length?`<div class="kchips">${c.kw.map(k=>`<span class="kchip hx">${esc(k)}</span>`).join("")}</div>`:""}</div>`).join("")}</div></div>`:""}
      <div class="q" style="font-size:19px;white-space:pre-line">${esc(p.q)}</div>
      <textarea id="essay-ta" placeholder="예) ㉠ 근접발달지대, ㉡ 비계설정">${esc(text)}</textarea>

      <div class="row" style="justify-content:space-between"><span class="small num" id="cc">${text.length}자</span><button class="btn grass" id="show-model">${model?"모범답안 숨기기":"모범답안과 비교"}</button></div>

  const qt=m.querySelector("#qimg-toggle");if(qt)qt.onclick=()=>{essayImg=!essayImg;render();};
  const pt=m.querySelector("#prev-toggle");if(pt)pt.onclick=()=>{essayPrev=!essayPrev;render();};

};

VIEWFN.stats=function(m){
  const t=today(),days=[...Array(28)].map((_,i)=>addDays(t,i-27)),max=Math.max(4,...days.map(d=>S.log[d]||0));
  const rows=D.subjects.map(s=>{
    const k=D.kwsets.filter(x=>x.s===s.id),c=D.cards.filter(x=>x.s===s.id),tb=D.tables.filter(x=>x.s===s.id),mm=D.mindmaps.filter(x=>x.s===s.id);
    const pct=(list,p)=>list.length?Math.round(list.filter(x=>mastered(p+x.id)).length/list.length*100):null;
    const mmAvg=mm.length?Math.round(mm.reduce((a,x)=>a+((S.mmr[x.id]||{}).best||0),0)/mm.length*100):null;
    return {s,k:pct(k,"k:"),c:pct(c,"c:"),t:pct(tb,"t:"),m:mmAvg};
  });

const b64e=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>String(s||"").trim().normalize("NFC");
let BLOB=null,RAWKEY=null,FB=null,CODESLOT=null;
async function loadFB(){
  if(FB)return FB;
  const u=n=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
  const [app,auth,fs]=await Promise.all([import(u("app")),import(u("auth")),import(u("firestore"))]);
  const a=app.initializeApp(FB_CONFIG);
  FB=Object.assign({},auth,fs,{auth:auth.getAuth(a),db:fs.getFirestore(a)});
  return FB;
}
async function emailOf(id){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hapgyeok:"+id)));return "u"+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,"0")).join("")+"@hapgyeok-note.app";}
async function pbk(secret,salt,usage){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,usage);
}
const keyFromRaw=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function openBlob(key){
  const b=new Uint8Array(BLOB),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},key,b.slice(28));
  return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
}
async function adminRaw(id,pw){const k=await pbk(id+"\n"+pw,new Uint8Array(BLOB).slice(0,16),["decrypt"]);await openBlob(k);return new Uint8Array(await crypto.subtle.exportKey("raw",k));}
async function codeRaw(code){
  if(!CODESLOT){const r=await fetch("code.json",{cache:"no-cache"});if(!r.ok)throw 0;CODESLOT=await r.json();}
  const w=await pbk("code\n"+code,b64d(CODESLOT.salt),["decrypt"]);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(CODESLOT.iv)},w,b64d(CODESLOT.ct)));
  await openBlob(await keyFromRaw(raw));return raw;
}
async function unwrapKey(wrap,id,pw){const w=await pbk(id+"\n"+pw,b64d(wrap.salt),["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(wrap.iv)},w,b64d(wrap.ct)));}
async function wrapKey(raw,id,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const w=await pbk(id+"\n"+pw,salt,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},w,raw);return{salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};}
function persistDevice(keep){try{localStorage.setItem(BASE+":key",b64e(RAWKEY));if(keep)localStorage.setItem(BASE+":auto","1");else localStorage.removeItem(BASE+":auto");}catch(e){}}
const netMsg=e=>{const c=(e&&e.code)||"";return c.includes("network")?"인터넷 연결을 확인해 주세요.":c.includes("too-many-requests")?"잠시 후 다시 시도해 주세요.":"문제가 생겼어요. 잠시 후 다시 해 주세요.";};

let needCodeLogin=false;
async function keyWorks(raw){try{await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(BLOB).slice(16,28)},await keyFromRaw(raw),new Uint8Array(BLOB).slice(28));return true;}catch(e){return false;}}
async function doLogin(id,pw,keep,code){
  const fb=await loadFB(),email=await emailOf(id);
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred=null;
  try{cred=await fb.signInWithEmailAndPassword(fb.auth,email,pw);}
  catch(e){const c=e.code||"";if(!/invalid-credential|user-not-found|wrong-password|invalid-login|invalid-email/.test(c))throw new Error(netMsg(e));}
  if(cred){
    const ref=fb.doc(fb.db,"users",cred.user.uid),snap=await fb.getDoc(ref);let info=snap.exists()?snap.data():null,raw;
    if(info&&info.wrap){try{raw=await unwrapKey(info.wrap,id,pw);}catch(e){raw=null;}}
    if(!raw||!(await keyWorks(raw))){
      /* 자료가 새로 만들어져 서버의 열쇠가 낡음 → 관리자 비밀번호로, 아니면 확인 코드로 새 열쇠를 받는다 */
      try{raw=await adminRaw(id,pw);}
      catch(e){
        if(!code){needCodeLogin=true;throw new Error("학습 자료가 새로 갱신되었어요. 확인 코드를 한 번 더 넣고 로그인해 주세요.");}
        try{raw=await codeRaw(code);}catch(e2){throw new Error("확인 코드가 맞지 않아요.");}
      }
      info=Object.assign(info||{id,c:"sun",t:Date.now()},{wrap:await wrapKey(raw,id,pw)});await fb.setDoc(ref,info);
    }
    needCodeLogin=false;
    return enterFB(cred.user.uid,info,raw,keep);
  }
  /* 서버에 아직 없는 아이디 → 관리자 첫 로그인이면 서버 계정을 만든다 */
  let raw;try{raw=await adminRaw(id,pw);}catch(e){throw new Error("아이디 또는 비밀번호가 맞지 않아요.");}
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,email,pw);}catch(e){throw new Error(e.code==="auth/email-already-in-use"?"아이디 또는 비밀번호가 맞지 않아요.":netMsg(e));}
  const info={id,c:"sun",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}
async function doSignup(id,pw,code,color,keep){
  const raw=RAWKEY||await codeRaw(code).catch(()=>{throw new Error("확인 코드가 맞지 않아요.");});
  const fb=await loadFB();
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred;
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,await emailOf(id),pw);}
  catch(e){throw new Error(e.code==="auth/email-already-in-use"?"이미 있는 아이디예요. 다른 아이디를 정해 주세요.":e.code==="auth/weak-password"?"비밀번호를 6자 이상으로 정해 주세요.":netMsg(e));}
  const info={id,c:color,t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}

      <label for="pw" class="small">비밀번호</label><input type="password" id="pw" ${inputCss} autocomplete="current-password" required>
      ${needCodeLogin?`<div class="adm"><b class="fun">확인 코드</b><span class="small">학습 자료가 갱신되어 한 번만 다시 필요해요.</span><label for="lcode" class="small">확인 코드</label><input type="password" id="lcode" ${inputCss} inputmode="numeric" autocomplete="off" required></div>`:""}
      <p class="small" style="margin:0">어느 기기에서든 같은 아이디로 로그인하면 기록이 이어져요.</p>`
    :`
      <p class="small" style="margin:0">새 계정은 기록 없이 처음부터 시작해요.</p>
      <label for="nid" class="small">새 아이디</label><input type="text" id="nid" ${inputCss} autocomplete="username" maxlength="20" required autofocus>
      <label for="npw" class="small">새 비밀번호 (6자 이상)</label><input type="password" id="npw" ${inputCss} autocomplete="new-password" minlength="6" required>
      <label for="npw2" class="small">새 비밀번호 확인</label><input type="password" id="npw2" ${inputCss} autocomplete="new-password" minlength="6" required>
      <span class="row" style="gap:6px;justify-content:center">${PCOLORS.map((c,i)=>`<label style="cursor:pointer" aria-label="${c}"><input type="radio" name="pcol" value="${c}" ${i===1?"checked":""} style="position:absolute;opacity:0"><span class="pcolor" style="display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--${c})"></span></label>`).join("")}</span>
      ${needCode?`<div class="adm"><b class="fun">확인 코드</b><span class="small">이 기기(브라우저)에서 처음 가입할 때만 필요해요.</span>
        <label for="vcode" class="small">확인 코드</label><input type="password" id="vcode" ${inputCss} inputmode="numeric" autocomplete="off" required></div>`:`<p class="small" style="margin:0">인증된 기기라 바로 가입할 수 있어요.</p>`}`}
    <label class="check" style="justify-content:center"><input type="checkbox" id="remember" checked> 이 기기에서 자동 로그인</label>
    <p class="err" id="err"></p>
    <button class="btn sun" id="go-btn" type="submit">${mode==="login"?"로그인":"가입하고 시작하기"}</button>
    ${D&&ME?`<button class="btn soft" type="button" id="back">돌아가기</button>`:""}
  </form>`;
  const paint=()=>m.querySelectorAll(".pcolor").forEach(s=>{s.style.boxShadow=s.previousElementSibling.checked?"0 0 0 2px var(--paper),0 0 0 4px var(--ink)":"none";});
  paint();m.querySelectorAll("input[name=pcol]").forEach(r=>r.onchange=paint);
  m.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>showLock(b.dataset.lm));
  const back=m.querySelector("#back");if(back)back.onclick=()=>{document.querySelector(".app").classList.remove("locked");render();};
  m.querySelector("#lock").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=m.querySelector("#go-btn"),err=m.querySelector("#err"),keep=m.querySelector("#remember").checked,label=btn.textContent;
    const fail=msg=>{btn.disabled=false;btn.textContent=label;err.textContent=msg;};
    btn.disabled=true;btn.textContent="잠시만요…";err.textContent="";
    try{
      if(mode==="login"){const lc=m.querySelector("#lcode");await doLogin(norm(m.querySelector("#uid").value),m.querySelector("#pw").value,keep,lc?norm(lc.value):"");}
      else{
        const id=norm(m.querySelector("#nid").value),pw=m.querySelector("#npw").value,pw2=m.querySelector("#npw2").value;
        if(!id)return fail("새 아이디를 넣어 주세요.");
        if(id==="관리자")return fail("이 아이디는 쓸 수 없어요.");
        if(pw.length<6)return fail("비밀번호는 6자 이상으로 정해 주세요.");
        if(pw!==pw2)return fail("두 비밀번호가 달라요.");
        await doSignup(id,pw,needCode?norm(m.querySelector("#vcode").value):"",(m.querySelector("input[name=pcol]:checked")||{}).value||"sky",keep);
      }
    }catch(x){const msg=(x&&x.message)||"";if(needCodeLogin&&!m.querySelector("#lcode")){showLock("login");const e2=document.getElementById("err");if(e2)e2.textContent=msg;return;}fail(msg||"열쇠를 푸는 데 실패했어요. 비밀번호를 다시 확인해 주세요.");}
  });
}
(async()=>{
  renderTimer();
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){document.getElementById("main").innerHTML=empty("브라우저가 오래됐어요","최신 크롬·사파리·엣지에서 열어 주세요.");return;}
  try{const r=await fetch("content.bin",{cache:"no-cache"});if(!r.ok)throw 0;BLOB=await r.arrayBuffer();}
  catch(e){document.getElementById("main").innerHTML=empty("자료를 못 불러왔어요","인터넷 연결을 확인하고 새로 고쳐 주세요.");return;}
  let saved=null,auto=null;try{saved=localStorage.getItem(BASE+":key");auto=localStorage.getItem(BASE+":auto");}catch(e){}
  if(saved){
    try{const raw=b64d(saved);await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(BLOB).slice(16,28)},await keyFromRaw(raw),new Uint8Array(BLOB).slice(28));RAWKEY=raw;}
    catch(e){try{localStorage.removeItem(BASE+":key");}catch(x){}}
  }
  if(RAWKEY&&auto){
    try{const fb=await loadFB();
      const user=await new Promise(res=>{const off=fb.onAuthStateChanged(fb.auth,u=>{off();res(u);});});
      if(user){const snap=await fb.getDoc(fb.doc(fb.db,"users",user.uid));if(snap.exists()){await enterFB(user.uid,snap.data(),RAWKEY,true);return;}}
    }catch(e){}
  }
  showLock("login");
})();

</script>
</body>
</html>
