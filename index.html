<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#24234a">
<title>유아임용 합격노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{
  color-scheme:light;
  --bg:#F4F3FA;--paper:#fff;--sunk:#EFEEF6;
  --ink:#1D1C33;--ink-2:#4B4A66;--ink-3:#8B8AA3;--line:#E3E1EE;
  --navy:#24234A;--navy-2:#34336A;
  --c0:#E2557B;--c0-s:#FDE8EE;--c1:#2F80D8;--c1-s:#E4EFFC;--c2:#7A4FD6;--c2-s:#EEE8FD;
  --good:#18A06C;--good-s:#E2F6EE;--mid:#E59A12;--mid-s:#FFF3DB;--bad:#E0503B;--bad-s:#FDEAE6;
  --hl:#FFEB99;--pri:#24234A;
  --r:16px;--sh:0 1px 2px rgba(30,30,70,.05),0 6px 20px rgba(30,30,70,.07);
  --f:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#15152A;--paper:#202038;--sunk:#29294A;--ink:#ECEBF7;--ink-2:#C2C1DA;--ink-3:#8E8DAA;--line:#34345A;
  --c0-s:#3D2232;--c1-s:#1E2F48;--c2-s:#2D2550;--good-s:#173B30;--mid-s:#3E3218;--bad-s:#43231F;--hl:#5E4E14;--pri:#6A55E0;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#15152A;--paper:#202038;--sunk:#29294A;--ink:#ECEBF7;--ink-2:#C2C1DA;--ink-3:#8E8DAA;--line:#34345A;
  --c0-s:#3D2232;--c1-s:#1E2F48;--c2-s:#2D2550;--good-s:#173B30;--mid-s:#3E3218;--bad-s:#43231F;--hl:#5E4E14;--pri:#6A55E0;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.3}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.loading{text-align:center;color:var(--ink-3);padding:80px 16px}

/* 상단 막대 */
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.top:empty{display:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;background:none;border:0;color:#fff;padding:0}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--c0),var(--c2));display:grid;place-items:center;font-size:15px}
.top .sp{flex:1}
.top .sync{font-size:12px;opacity:.75}
.top .ib{background:#ffffff1c;border:0;color:#fff;border-radius:9px;padding:6px 10px;font-size:14px}
.top .ib[aria-current="page"]{background:#fff;color:var(--navy);font-weight:700}

main{max-width:880px;margin:0 auto;padding:18px 16px 60px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 16px;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 홈 */
.hero{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.hero .big{font-size:40px;font-weight:800;line-height:1}
.hero .lbl{font-size:13px;opacity:.75}
.hero .grow{flex:1;min-width:200px}
.hero h2{font-size:21px;margin-bottom:4px}
.hero p{margin:0;opacity:.85;font-size:15px}
.hero .btn.go{background:#fff;color:var(--navy);border:0;font-size:17px;padding:12px 22px;font-weight:800}
.hero .stat{text-align:center;min-width:70px}
.sec{margin:26px 0 10px;font-size:15px;color:var(--ink-2);font-weight:800;display:flex;align-items:center;gap:8px}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.deck{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:0;text-align:left;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--dc)}
.deck h3{font-size:20px;color:var(--dc)}
.deck .cnt{font-size:14px;color:var(--ink-3)}
.bar{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)}.bar .l{background:var(--mid)}
.legend{display:flex;gap:12px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.legend b{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.week{display:flex;gap:6px;align-items:flex-end;height:70px;background:var(--paper);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--c2);min-height:3px}

/* 단원 목록 */
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-3);margin-bottom:10px}
.crumb button{border:0;background:none;color:var(--ink-2);padding:0;text-decoration:underline}
.dhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dhead h2{font-size:26px;color:var(--dc)}
.chaps{display:flex;flex-direction:column;gap:8px}
.chap{background:var(--paper);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.chap>.ch{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;text-align:left}
.chap .nm{flex:1;font-weight:700}
.chap .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.chap .pb{width:110px}
.chap .arr{color:var(--ink-3);transition:transform .15s}
.chap.open .arr{transform:rotate(90deg)}
.tops{display:none;border-top:1px solid var(--line);padding:6px 10px 10px}
.chap.open .tops{display:block}
.tp{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:9px;font-size:15px;border-top:1px solid var(--line)}
.tp:first-of-type{border-top:0}
.tp .nm{flex:1;min-width:0}
.tp .nm small{display:block;color:var(--ink-3);font-size:12px}
.tp .pb{width:90px}
.chap .no{width:28px;height:28px;border-radius:8px;background:var(--dc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
@media (max-width:560px){.chap .pb{width:60px}.tp .pb{display:none}.tp [data-tl]{display:none}}

/* 공부 화면 */
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.shead .ttl{flex:1;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.sbar i{display:block;height:100%;background:var(--c2);transition:width .2s}
.card{background:var(--paper);border-radius:20px;box-shadow:var(--sh);min-height:340px;padding:24px 24px 20px;position:relative;border-top:6px solid var(--dc);cursor:pointer;user-select:text;display:flex;flex-direction:column}
.card .meta{font-size:13px;color:var(--ink-3);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .meta .d{color:var(--dc);font-weight:800}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;font-weight:700}
.tag.new{background:var(--c2-s);color:var(--c2)}
.tag.box{background:var(--good-s);color:var(--good)}
.tag.lapse{background:var(--bad-s);color:var(--bad)}
.q{font-size:22px;font-weight:800;white-space:pre-wrap;line-height:1.5}
.a{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line);font-size:17px;white-space:pre-wrap;line-height:1.75;display:none}
.card.flip .a{display:block}
.a strong,.li .a strong{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:800}
.tap{margin-top:auto;padding-top:22px;text-align:center;color:var(--ink-3);font-size:14px}
.card.flip .tap{display:none}
.cardwrap{position:relative}
.nav-arr{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:30px;line-height:1;display:grid;place-items:center;padding:0 0 4px;box-shadow:var(--sh);z-index:2}
.nav-arr.prev{left:-62px}.nav-arr.next{right:-62px}
.nav-arr:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.nav-arr:disabled{opacity:.3;cursor:default}
@media (max-width:1010px){.nav-arr{width:38px;height:38px;font-size:26px;opacity:.92}.nav-arr.prev{left:-12px}.nav-arr.next{right:-12px}.card{margin:0 14px}}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.grade button{border:0;border-radius:14px;padding:14px 4px;font-weight:800;font-size:16px;line-height:1.25}
.grade button small{display:block;font-weight:500;font-size:12px;opacity:.85}
.g0{background:var(--bad);color:#fff}.g1{background:var(--mid);color:#fff}.g2{background:var(--good);color:#fff}
.showbtn{width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;background:var(--pri);color:#fff}
.keys{text-align:center;font-size:12px;color:var(--ink-3);margin-top:10px}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}
@media (max-width:600px){.q{font-size:19px}.a{font-size:16px}.card{padding:18px 16px;min-height:300px}.keys{display:none}}
.done{text-align:center;padding:40px 16px;background:var(--paper);border-radius:20px;box-shadow:var(--sh)}
.done .big{font-size:46px}
.done h2{margin:8px 0}

/* 목록·찾기 */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;min-width:0}
.tools input{flex:2 1 220px}.tools select{flex:1 1 140px}
.li{background:var(--paper);border-radius:12px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:8px;border-left:5px solid var(--dc)}
.li .meta{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.li .q{font-size:16px}
.li .a{display:block;font-size:15px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.li.hide .a{display:none}
mark{background:var(--hl);color:inherit;border-radius:3px}
.more{display:block;margin:14px auto}

/* 설정 */
.panel{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.panel h3{font-size:16px;margin-bottom:8px}
.panel label{display:flex;gap:8px;align-items:center;margin:6px 0}
.panel input[type=number],.panel input[type=date]{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--paper);width:140px}

/* 로그인 */
.lock{max-width:380px;margin:40px auto;background:var(--paper);border-radius:20px;box-shadow:var(--sh);padding:28px 24px;display:flex;flex-direction:column;gap:8px}
.lock .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--c0),var(--c2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;align-self:center}
.lock h2{text-align:center;margin:6px 0 4px}
.lock .tabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.lock .tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px}
.lock .tabs button[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.field{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);width:100%}
.adm{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.err{color:var(--bad);font-size:14px;min-height:1em;margin:0}
.check{display:flex;gap:6px;align-items:center;justify-content:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:50;box-shadow:var(--sh);max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"><p class="loading">여는 중…</p></main>
<script>
const FB_CONFIG={"apiKey": "AIzaSyDtFXzKPCHRbJnQdniJN8AtzlP6mYWciSk", "authDomain": "hapgyeok-note-0925k.firebaseapp.com", "projectId": "hapgyeok-note-0925k", "storageBucket": "hapgyeok-note-0925k.firebasestorage.app", "messagingSenderId": "1018750410558", "appId": "1:1018750410558:web:ca8aea98c6531d12b8966f"};
const FB_VER="12.19.0";
/* ================================================================
   유아임용 합격노트 v3 — 민쌤 시험장용 요약 플래시카드
   데이터(로그인 후 복호화) → 진도 저장(기기+Firebase) → 화면 → 로그인
   ================================================================ */

/* ---------- 데이터 ---------- */
// 카드: [id, 과목번호, 쪽, 대주제, 소주제, 질문, 답, 세부 주제]
let DOCS=[],C=[],CH=[];   // CH[d] = 대주제 [{name, topics:소주제[{name, idx:[]}], idx:[]}]
const DC=["var(--c0)","var(--c1)","var(--c2)"],DCS=["var(--c0-s)","var(--c1-s)","var(--c2-s)"];
let TAX=null;  // tax.json: 대주제·소주제 분류표 {n:["대|소",...], m:{카드id:번호}}
function indexData(b){
  DOCS=b.docs;C=b.cards;CH=DOCS.map(()=>[]);
  if(TAX)C.forEach(c=>{const k=TAX.m[c[0]];if(k==null)return;const [big,small]=TAX.n[k].split("|");if(c.length<8)c[7]=c[4];c[3]=big;c[4]=small;});
  const cm=DOCS.map(()=>({}));
  C.forEach((c,i)=>{
    const d=c[1];let ch=cm[d][c[3]];
    if(!ch){ch=cm[d][c[3]]={name:c[3],topics:[],tm:{},idx:[]};CH[d].push(ch);}
    let tp=ch.tm[c[4]];if(!tp){tp=ch.tm[c[4]]={name:c[4],idx:[]};ch.topics.push(tp);}
    ch.idx.push(i);tp.idx.push(i);
  });
}

/* ---------- 상태 ---------- */
const BASE="yuah-imyong-v2";            // 로그인 열쇠 보관 이름 (예전과 같게 → 자동 로그인 유지)
const SBASE="hapgyeok-flash-v1";
let ME=null,KEY=SBASE+":guest";
const blank=()=>({v:1,srs:{},log:{},exam:"",newN:20,shuf:false,updatedAt:0});
let S=blank();
function adopt(o){S=Object.assign(blank(),o||{});if(S.v!==1)S=blank();}
const pad=n=>String(n).padStart(2,"0");
function today(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
const EPOCH=Date.UTC(2026,0,1);
const dn=(d=new Date())=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5);
const dnToDate=n=>new Date(EPOCH+n*864e5);

/* 간격 반복: srs[id]=[상자(1~6), 다음 날짜번호, 틀린 횟수] */
const IV=[0,0,1,3,7,14,30];
const ss=i=>S.srs[C[i][0]];
const isNew=i=>!ss(i);
const isDue=i=>{const x=ss(i);return !!x&&x[1]<=dn();};
const isMastered=i=>{const x=ss(i);return !!x&&x[0]>=4;};
const isWrong=i=>{const x=ss(i);return !!x&&x[2]>0;};
function grade(i,g){
  const id=C[i][0],x=S.srs[id],t=dn();
  let b=x?x[0]:0,l=x?x[2]:0;
  if(g===0){b=1;l++;}
  else if(g===1){b=Math.max(1,Math.min(b,3));}
  else b=Math.min(6,Math.max(2,b+1));
  S.srs[id]=[b,t+(g===0?0:g===1?1:IV[b]),l];
  const k=today();S.log[k]=(S.log[k]||0)+1;
}
function counts(idx){let k=0,l=0,n=0,due=0;const t=dn();for(const i of idx){const x=ss(i);if(!x)n++;else{if(x[0]>=4)k++;else l++;if(x[1]<=t)due++;}}return{k,l,n,due,all:idx.length};}
function streak(){let n=0,d=new Date();if(!S.log[today(d)])d.setDate(d.getDate()-1);while(S.log[today(d)]){n++;d.setDate(d.getDate()-1);}return n;}

/* ---------- 저장: 이 기기 + Firebase ---------- */
let saveTimer=null,cloudBusy=false,cloudDirty=false,cloudState="";
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  cloudDirty=true;setSync("wait");
  clearTimeout(saveTimer);saveTimer=setTimeout(cloudFlush,1500);
}
async function packJSON(o){const gz=new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());let s="";for(let i=0;i<gz.length;i+=8192)s+=String.fromCharCode(...gz.subarray(i,i+8192));const b=btoa(s);if(b.length>1000000)throw new Error("too-large");return b;}
async function unpackDoc(d){if(!d||!d.gz)return null;const b=Uint8Array.from(atob(d.gz),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text());}
const flashRef=()=>FB.doc(FB.db,"users",ME.uid,"data","flash");
async function cloudFlush(){
  if(!FB||!ME||cloudBusy||!cloudDirty)return;
  cloudBusy=true;cloudDirty=false;
  try{await FB.setDoc(flashRef(),{gz:await packJSON(S),updatedAt:S.updatedAt});setSync(cloudDirty?"wait":"ok");}
  catch(err){cloudDirty=true;setSync(err&&err.message==="too-large"?"big":"err");setTimeout(cloudFlush,15000);}
  cloudBusy=false;if(cloudDirty)setTimeout(cloudFlush,300);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")cloudFlush();});
function setSync(st){cloudState=st;const el=document.getElementById("sync");if(el)el.textContent=st==="ok"?"저장됨":st==="err"?"저장 실패 · 다시 시도 중":st==="big"?"기록이 너무 커요":"저장 중…";}

/* ---------- 유틸 ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
const bar=c=>`<div class="bar"><i class="k" style="width:${c.k/(c.all||1)*100}%"></i><i class="l" style="width:${c.l/(c.all||1)*100}%"></i></div>`;
const legend=c=>`<div class="legend"><span><i class="dot" style="background:var(--good)"></i>외움 <b>${c.k}</b></span><span><i class="dot" style="background:var(--mid)"></i>익히는 중 <b>${c.l}</b></span><span><i class="dot" style="background:var(--line)"></i>안 봄 <b>${c.n}</b></span>${c.due?`<span style="color:var(--bad)">복습 <b>${c.due}</b></span>`:""}</div>`;
const ALL=()=>C.map((_,i)=>i);
function ddays(){if(!S.exam)return null;return Math.round((new Date(S.exam+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);}

/* ---------- 화면 이동 (주소 #으로, 뒤로 가기 지원) ---------- */
let route={v:"home"};
function go(h){if(location.hash===h)renderRoute();else location.hash=h;}
function parseHash(){const p=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  if(p[0]==="deck")return{v:"deck",d:+p[1]||0};
  if(p[0]==="study")return{v:"study"};
  if(p[0]==="list")return{v:"list"};
  if(p[0]==="set")return{v:"set"};
  return{v:"home"};}
window.addEventListener("hashchange",()=>{if(C.length)renderRoute();});
function renderRoute(){
  route=parseHash();
  if(route.v==="study"&&!SES)route={v:"home"};
  renderTop();(VIEW[route.v]||VIEW.home)(document.getElementById("main"));
  if(route.v!=="study")window.scrollTo({top:0});
}
function renderTop(){
  const t=document.getElementById("top");if(!ME){t.innerHTML="";return;}
  const cur=route.v;
  t.innerHTML=`<button class="brand" onclick="go('#/')"><span class="logo">합</span><span>합격노트</span></button><span class="sp"></span>
    <span class="sync" id="sync"></span>
    <button class="ib" onclick="go('#/list')" ${cur==="list"?'aria-current="page"':""}>찾기</button>
    <button class="ib" onclick="go('#/set')" ${cur==="set"?'aria-current="page"':""}>설정</button>`;
  setSync(cloudState||"ok");
}
const VIEW={};

    <div class="sec">과목</div>

function nextNewCards(n){const out=[];for(let i=0;i<C.length&&out.length<n;i++)if(isNew(i))out.push(i);return out;}

  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{

    if(s==="learn")startSession(nm,learnQueue(idx));

    else if(s==="wrong"){const w=idx.filter(isWrong);if(!w.length)return toast("아직 틀린 카드가 없어요");startSession(nm+" 틀린 카드",w);}

  m.querySelectorAll("[data-chl]").forEach(b=>b.onclick=()=>{LS={q:"",d:String(d),ch:CH[d][+b.dataset.chl].name,tp:"",f:"all",hide:LS.hide,n:60};go("#/list");});
  m.querySelectorAll("[data-tl]").forEach(b=>b.onclick=()=>{const [k,t]=b.dataset.tl.split(":").map(Number);LS={q:"",d:String(d),ch:CH[d][k].name,tp:CH[d][k].topics[t].name,f:"all",hide:LS.hide,n:60};go("#/list");});
  m.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{const [k,t]=b.dataset.tp.split(":").map(Number),tp=CH[d][k].topics[t];startSession(CH[d][k].name+" › "+tp.name,learnQueue(tp.idx));});

/* 공부 순서: 복습할 카드 → 아직 안 본 카드 (다 외웠으면 전부 다시) */
function learnQueue(idx){
  const due=idx.filter(isDue),nw=idx.filter(isNew);
  const q=due.concat(nw);
  return q.length?q:idx.slice();
}

/* ---------- 공부 화면 ---------- */
let SES=null;
function startSession(title,idx,o={}){
  if(!idx.length)return toast("공부할 카드가 없어요");
  const q=(S.shuf&&!o.keepOrder)?shuffle(idx):idx.slice();
  SES={title,q,pos:0,flip:false,total:q.length,done:0,again:{},hist:[],tally:[0,0,0]};
  go("#/study");
}
VIEW.study=function(m){
  const s=SES;
  if(s.pos>=s.q.length){
    m.innerHTML=`<div class="done"><div class="big">🎉</div><h2>${esc(s.title)} 끝!</h2>
      <p class="muted">${s.done}번 채점 · 알아요 ${s.tally[2]} · 헷갈려요 ${s.tally[1]} · 몰랐어요 ${s.tally[0]}</p>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="back1">‹ 마지막 카드 다시 보기</button>${s.hist.length?`<button class="btn" id="undo">마지막 채점 되돌리기</button>`:""}<button class="btn pri" onclick="SES=null;history.back()">돌아가기</button></div></div>`;
    const u=m.querySelector("#undo");if(u)u.onclick=undo;
    m.querySelector("#back1").onclick=()=>step(-1);
    return;
  }
  const i=s.q[s.pos],c=C[i],x=ss(i),d=c[1];
  const tag=!x?`<span class="tag new">처음</span>`:`<span class="tag box">상자 ${x[0]}</span>${x[2]?`<span class="tag lapse">틀림 ${x[2]}</span>`:""}`;
  m.innerHTML=`<div class="shead"><button class="btn sm" id="quit">✕ 그만</button><span class="ttl">${esc(s.title)}</span><span class="num small muted">${s.pos+1} / ${s.q.length}</span>${s.hist.length?`<button class="btn sm" id="undo" title="되돌리기 (Z)">↶</button>`:""}</div>
    <div class="sbar"><i style="width:${s.pos/s.q.length*100}%"></i></div>
    <div class="cardwrap"><button class="nav-arr prev" id="prev" aria-label="이전 문제" title="이전 문제 (←)" ${s.pos?"":"disabled"}>‹</button>
    <div class="card ${s.flip?"flip":""}" id="card" style="--dc:${DC[d]}">
      <div class="meta"><span class="d">${esc(DOCS[d])}</span><span>${esc(c[3])} › ${esc(c[4])}</span>${c[7]&&c[7]!==c[4]?`<span>· ${esc(c[7])}</span>`:""}<span>${c[2]}쪽</span>${tag}</div>
      <div class="q">${fmt(c[5])}</div><div class="a">${fmt(c[6])}</div>
      <div class="tap">눌러서 답 보기</div></div>
    <button class="nav-arr next" id="next" aria-label="다음 문제" title="다음 문제 (→)">›</button></div>
    ${s.flip?`<div class="grade"><button class="g0" data-g="0">몰랐어요<small>곧 다시</small></button><button class="g1" data-g="1">헷갈려요<small>내일</small></button><button class="g2" data-g="2">알아요<small>${IV[Math.min(6,Math.max(2,(x?x[0]:0)+1))]}일 뒤</small></button></div>`
      :`<button class="showbtn" id="show">답 보기</button>`}
    <div class="keys"><kbd>Space</kbd> 답 보기 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 채점 · <kbd>←</kbd><kbd>→</kbd> 이전·다음 · <kbd>Z</kbd> 되돌리기 · <kbd>Esc</kbd> 그만</div>`;
  m.querySelector("#card").onclick=()=>{if(getSelection().toString())return;flipCard();};
  const sh=m.querySelector("#show");if(sh)sh.onclick=flipCard;
  m.querySelector("#quit").onclick=()=>{SES=null;history.back();};
  const u=m.querySelector("#undo");if(u)u.onclick=undo;
  m.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>answer(+b.dataset.g));
  m.querySelector("#prev").onclick=()=>step(-1);m.querySelector("#next").onclick=()=>step(1);
};
/* 채점 없이 이전·다음 문제로 */
function step(n){const s=SES;if(!s)return;const p=s.pos+n;if(p<0||p>s.q.length)return;s.pos=p;s.flip=false;VIEW.study(document.getElementById("main"));}
function flipCard(){if(!SES||SES.pos>=SES.q.length)return;SES.flip=!SES.flip;VIEW.study(document.getElementById("main"));}
function answer(g){
  const s=SES,i=s.q[s.pos];
  s.hist.push({i,prev:S.srs[C[i][0]]?S.srs[C[i][0]].slice():null,q:s.q.slice(),pos:s.pos,g,lg:S.log[today()]||0});
  grade(i,g);s.done++;s.tally[g]++;
  if(g===0&&(s.again[i]||0)<3){s.again[i]=(s.again[i]||0)+1;s.q.splice(Math.min(s.q.length,s.pos+5),0,i);}
  s.pos++;s.flip=false;save();VIEW.study(document.getElementById("main"));
}
function undo(){
  const s=SES,h=s&&s.hist.pop();if(!h)return;
  if(h.prev)S.srs[C[h.i][0]]=h.prev;else delete S.srs[C[h.i][0]];
  S.log[today()]=h.lg;s.q=h.q;s.pos=h.pos;s.done--;s.tally[h.g]--;s.flip=true;
  save();VIEW.study(document.getElementById("main"));
}
document.addEventListener("keydown",e=>{
  if(route.v!=="study"||!SES||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!SES.flip)flipCard();}
  else if(SES.flip&&["1","2","3"].includes(e.key)){e.preventDefault();answer(+e.key-1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
  else if(e.key==="ArrowRight"){e.preventDefault();step(1);}
  else if(e.key==="z"||e.key==="Z"||e.key==="Backspace"){e.preventDefault();undo();}
  else if(e.key==="Escape"){SES=null;history.back();}
});

/* ---------- 찾기·목록 ---------- */
let LS={q:"",d:"",ch:"",tp:"",f:"all",hide:false,n:60};
VIEW.list=function(m){
  const chs=LS.d===""?[]:CH[+LS.d],chO=chs.find(x=>x.name===LS.ch),tps=chO?chO.topics:[];
  m.innerHTML=`<div class="tools">
      <input type="search" id="lq" placeholder="질문·답·주제에서 찾기" value="${esc(LS.q)}">
      <select id="ld"><option value="">모든 과목</option>${DOCS.map((d,i)=>`<option value="${i}" ${LS.d===String(i)?"selected":""}>${esc(d)}</option>`).join("")}</select>
      <select id="lc" ${LS.d===""?"disabled":""}><option value="">모든 대주제</option>${chs.map(ch=>`<option ${ch.name===LS.ch?"selected":""}>${esc(ch.name)}</option>`).join("")}</select>
      <select id="lt" ${!chO?"disabled":""}><option value="">모든 소주제</option>${tps.map(t=>`<option ${t.name===LS.tp?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
      <select id="lf">${[["all","모든 카드"],["new","안 본 카드"],["learn","익히는 중"],["k","외운 카드"],["wrong","틀린 적 있는 카드"]].map(([v,l])=>`<option value="${v}" ${LS.f===v?"selected":""}>${l}</option>`).join("")}</select>
    </div>
    <div class="row" style="margin-bottom:10px"><label class="small row" style="gap:4px"><input type="checkbox" id="lh" ${LS.hide?"checked":""}> 답 가리기 (눌러서 보기)</label><span class="sp" style="flex:1"></span><span class="small muted" id="lcnt"></span><button class="btn sm pri" id="lstudy">이 목록으로 공부</button></div>
    <div id="lout"></div>`;
  const $=s=>m.querySelector(s);
  $("#lq").oninput=e=>{LS.q=e.target.value;LS.n=60;out();};
  $("#ld").onchange=e=>{LS.d=e.target.value;LS.ch="";LS.tp="";LS.n=60;VIEW.list(m);};
  $("#lc").onchange=e=>{LS.ch=e.target.value;LS.tp="";LS.n=60;VIEW.list(m);};
  $("#lt").onchange=e=>{LS.tp=e.target.value;LS.n=60;out();};
  $("#lf").onchange=e=>{LS.f=e.target.value;LS.n=60;out();};
  $("#lh").onchange=e=>{LS.hide=e.target.checked;out();};
  $("#lstudy").onclick=()=>{const r=filtered();if(!r.length)return toast("카드가 없어요");startSession(LS.q?`'${LS.q}' 찾은 카드`:LS.tp?LS.ch+" › "+LS.tp:LS.ch||(LS.d!==""?DOCS[+LS.d]:"전체"),r,{keepOrder:!S.shuf});};
  out();
  function filtered(){
    const qs=LS.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return ALL().filter(i=>{const c=C[i];
      if(LS.d!==""&&c[1]!==+LS.d)return false;if(LS.ch&&c[3]!==LS.ch)return false;if(LS.tp&&c[4]!==LS.tp)return false;
      if(LS.f==="new"&&!isNew(i))return false;if(LS.f==="learn"&&(isNew(i)||isMastered(i)))return false;
      if(LS.f==="k"&&!isMastered(i))return false;if(LS.f==="wrong"&&!isWrong(i))return false;
      if(qs.length){const t=(c[3]+" "+c[4]+" "+c[7]+" "+c[5]+" "+c[6]).toLowerCase();return qs.every(q=>t.includes(q));}
      return true;});
  }
  function out(){
    const r=filtered(),qs=LS.q.trim().split(/\s+/).filter(Boolean);
    const hl=s=>{let h=fmt(s);for(const q of qs){const re=new RegExp("("+esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");h=h.replace(/(<[^>]+>)|([^<]+)/g,(m0,tag,txt)=>tag||txt.replace(re,"<mark>$1</mark>"));}return h;};
    $("#lcnt").textContent=r.length.toLocaleString()+"장";
    $("#lout").innerHTML=r.slice(0,LS.n).map(i=>{const c=C[i];return `<div class="li ${LS.hide?"hide":""}" style="--dc:${DC[c[1]]}" data-li="1"><div class="meta">${esc(DOCS[c[1]])} · ${esc(c[3])} › ${esc(c[4])}${c[7]&&c[7]!==c[4]?" · "+esc(c[7]):""} · ${c[2]}쪽${isMastered(i)?" · ✔ 외움":isWrong(i)?" · 틀림 "+ss(i)[2]:""}</div><div class="q">${hl(c[5])}</div><div class="a">${hl(c[6])}</div></div>`;}).join("")
      +(r.length>LS.n?`<button class="btn more" id="lmore">더 보기 (${(r.length-LS.n).toLocaleString()}장 남음)</button>`:"")
      +(r.length?"":`<p class="muted" style="text-align:center;padding:40px">찾는 카드가 없어요</p>`);
    const mo=$("#lmore");if(mo)mo.onclick=()=>{LS.n+=100;out();};
    $("#lout").querySelectorAll("[data-li]").forEach(el=>el.onclick=()=>{if(LS.hide&&!getSelection().toString())el.classList.toggle("hide");});
  }
};

/* ---------- 설정 ---------- */
let resetAsk=false;
VIEW.set=function(m){
  const theme=document.documentElement.dataset.theme||"";
  m.innerHTML=`<div class="panel"><h3>공부 방식</h3>
      <label>시험일 <input type="date" id="ex" value="${esc(S.exam)}"></label>
      <label>홈에서 한 번에 배울 새 카드 <input type="number" id="nn" min="5" max="200" step="5" value="${S.newN}"> 장</label>
      <label><input type="checkbox" id="sf" ${S.shuf?"checked":""}> 카드 섞어서 보기 (복습·새 카드 묶음은 순서대로)</label>
      <label>화면 <select id="th" class="field" style="width:auto"><option value="" ${!theme?"selected":""}>기기 설정 따라</option><option value="light" ${theme==="light"?"selected":""}>밝게</option><option value="dark" ${theme==="dark"?"selected":""}>어둡게</option></select></label></div>
    <div class="panel"><h3>채점 규칙</h3><p class="small muted" style="margin:0">몰랐어요 → 이번 공부 중 몇 장 뒤 다시, 상자 1로 · 헷갈려요 → 내일 다시 · 알아요 → 상자가 올라가며 1·3·7·14·30일 뒤 복습. 상자 4 이상이면 '외움'.</p></div>
    <div class="panel"><h3>계정</h3><p class="small" style="margin:0 0 8px"><b>${esc(ME.id)}</b> · 기록은 서버에 자동 저장돼요. 어느 기기에서든 같은 아이디로 로그인하면 이어져요.</p>
      <div class="row"><button class="btn" id="lo">로그아웃</button>${resetAsk?`<button class="btn" id="rs-ok" style="background:var(--bad);color:#fff;border:0">정말 모든 진도를 지울까요?</button><button class="btn" id="rs-no">취소</button>`:`<button class="btn" id="rs">진도 처음부터</button>`}</div></div>
    <p class="small muted">자료: 민쌤 「시험장용 요약본」 개론·각론·교육과정 · 카드 ${C.length.toLocaleString()}장</p>`;
  const $=s=>m.querySelector(s);
  $("#ex").onchange=e=>{S.exam=e.target.value;save();};
  $("#nn").onchange=e=>{S.newN=Math.max(5,Math.min(200,+e.target.value||20));save();};
  $("#sf").onchange=e=>{S.shuf=e.target.checked;save();};
  $("#th").onchange=e=>{const v=e.target.value;if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme;try{localStorage.setItem(SBASE+":theme",v);}catch(x){}};
  $("#lo").onclick=logout;
  const on=(s,f)=>{const b=$(s);if(b)b.onclick=f;};
  on("#rs",()=>{resetAsk=true;VIEW.set(m);});on("#rs-no",()=>{resetAsk=false;VIEW.set(m);});
  on("#rs-ok",()=>{resetAsk=false;const keep={exam:S.exam,newN:S.newN,shuf:S.shuf};S=blank();Object.assign(S,keep);save();toast("진도를 지웠어요");VIEW.set(m);});
};
try{const th=localStorage.getItem(SBASE+":theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}

/* ================= 로그인 · 회원가입 (Firebase, 예전 계정 그대로) ================= */
const b64e=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>String(s||"").trim().normalize("NFC");
let BLOB=null,RAWKEY=null,FB=null,CODESLOT=null;
async function loadFB(){
  if(FB)return FB;
  const u=n=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
  const [app,auth,fs]=await Promise.all([import(u("app")),import(u("auth")),import(u("firestore"))]);
  const a=app.initializeApp(FB_CONFIG);
  FB=Object.assign({},auth,fs,{auth:auth.getAuth(a),db:fs.getFirestore(a)});
  return FB;
}
async function emailOf(id){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hapgyeok:"+id)));return "u"+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,"0")).join("")+"@hapgyeok-note.app";}
async function pbk(secret,salt,usage){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,usage);
}
const keyFromRaw=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function openBlob(key){
  const b=new Uint8Array(BLOB),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},key,b.slice(28));
  return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
}
async function adminRaw(id,pw){const k=await pbk(id+"\n"+pw,new Uint8Array(BLOB).slice(0,16),["decrypt"]);await openBlob(k);return new Uint8Array(await crypto.subtle.exportKey("raw",k));}
async function codeRaw(code){
  if(!CODESLOT){const r=await fetch("code.json",{cache:"no-cache"});if(!r.ok)throw 0;CODESLOT=await r.json();}
  const w=await pbk("code\n"+code,b64d(CODESLOT.salt),["decrypt"]);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(CODESLOT.iv)},w,b64d(CODESLOT.ct)));
  await openBlob(await keyFromRaw(raw));return raw;
}
async function unwrapKey(wrap,id,pw){const w=await pbk(id+"\n"+pw,b64d(wrap.salt),["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(wrap.iv)},w,b64d(wrap.ct)));}
async function wrapKey(raw,id,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const w=await pbk(id+"\n"+pw,salt,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},w,raw);return{salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};}
function persistDevice(keep){try{localStorage.setItem(BASE+":key",b64e(RAWKEY));if(keep)localStorage.setItem(BASE+":auto","1");else localStorage.removeItem(BASE+":auto");}catch(e){}}
const netMsg=e=>{const c=(e&&e.code)||"";return c.includes("network")?"인터넷 연결을 확인해 주세요.":c.includes("too-many-requests")?"잠시 후 다시 시도해 주세요.":"문제가 생겼어요. 잠시 후 다시 해 주세요.";};
async function logout(){try{await cloudFlush();if(FB)await FB.signOut(FB.auth);}catch(e){}try{localStorage.removeItem(BASE+":auto");}catch(e){}location.hash="";location.reload();}
async function enterFB(uid,info,raw,keep){
  ME={uid,id:info.id};KEY=SBASE+"@fb:"+uid;RAWKEY=raw;persistDevice(keep);
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  let cloud=null;
  try{const p=await FB.getDoc(flashRef());if(p.exists())cloud=await unpackDoc(p.data());}catch(e){}
  S=blank();cloudDirty=false;
  if(cloud&&(!local||(cloud.updatedAt||0)>=(local.updatedAt||0)))adopt(cloud);
  else if(local){adopt(local);cloudDirty=true;}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!C.length)indexData(await openBlob(await keyFromRaw(raw)));
  renderRoute();setSync(cloudDirty?"wait":"ok");if(cloudDirty)cloudFlush();
  toast(`${ME.id}님, 반가워요!`);
}
let needCodeLogin=false;
async function keyWorks(raw){try{await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(BLOB).slice(16,28)},await keyFromRaw(raw),new Uint8Array(BLOB).slice(28));return true;}catch(e){return false;}}
async function doLogin(id,pw,keep,code){
  const fb=await loadFB(),email=await emailOf(id);
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred=null;
  try{cred=await fb.signInWithEmailAndPassword(fb.auth,email,pw);}
  catch(e){const c=e.code||"";if(!/invalid-credential|user-not-found|wrong-password|invalid-login|invalid-email/.test(c))throw new Error(netMsg(e));}
  if(cred){
    const ref=fb.doc(fb.db,"users",cred.user.uid),snap=await fb.getDoc(ref);let info=snap.exists()?snap.data():null,raw;
    if(info&&info.wrap){try{raw=await unwrapKey(info.wrap,id,pw);}catch(e){raw=null;}}
    if(!raw||!(await keyWorks(raw))){
      try{raw=await adminRaw(id,pw);}
      catch(e){
        if(!code){needCodeLogin=true;throw new Error("학습 자료가 새로 갱신되었어요. 확인 코드를 한 번 더 넣고 로그인해 주세요.");}
        try{raw=await codeRaw(code);}catch(e2){throw new Error("확인 코드가 맞지 않아요.");}
      }
      info=Object.assign(info||{id,c:"sun",t:Date.now()},{wrap:await wrapKey(raw,id,pw)});await fb.setDoc(ref,info);
    }
    needCodeLogin=false;
    return enterFB(cred.user.uid,info,raw,keep);
  }
  let raw;try{raw=await adminRaw(id,pw);}catch(e){throw new Error("아이디 또는 비밀번호가 맞지 않아요.");}
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,email,pw);}catch(e){throw new Error(e.code==="auth/email-already-in-use"?"아이디 또는 비밀번호가 맞지 않아요.":netMsg(e));}
  const info={id,c:"sun",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}
async function doSignup(id,pw,code,keep){
  const raw=RAWKEY||await codeRaw(code).catch(()=>{throw new Error("확인 코드가 맞지 않아요.");});
  const fb=await loadFB();
  await fb.setPersistence(fb.auth,keep?fb.browserLocalPersistence:fb.browserSessionPersistence);
  let cred;
  try{cred=await fb.createUserWithEmailAndPassword(fb.auth,await emailOf(id),pw);}
  catch(e){throw new Error(e.code==="auth/email-already-in-use"?"이미 있는 아이디예요. 다른 아이디를 정해 주세요.":e.code==="auth/weak-password"?"비밀번호를 6자 이상으로 정해 주세요.":netMsg(e));}
  const info={id,c:"sky",t:Date.now(),wrap:await wrapKey(raw,id,pw)};
  await fb.setDoc(fb.doc(fb.db,"users",cred.user.uid),info);
  return enterFB(cred.user.uid,info,raw,keep);
}
function showLock(mode){
  mode=mode||"login";ME=null;renderTop();
  const m=document.getElementById("main"),needCode=!RAWKEY;
  m.innerHTML=`<form class="lock" id="lock" autocomplete="on">
    <div class="logo">합</div><h2>유아임용 합격노트</h2>
    <p class="small muted" style="text-align:center;margin:0 0 6px">민쌤 시험장용 요약 · 플래시카드</p>
    <div class="tabs"><button type="button" data-lm="login" aria-pressed="${mode==="login"}">로그인</button><button type="button" data-lm="signup" aria-pressed="${mode==="signup"}">회원가입</button></div>
    ${mode==="login"?`
      <label for="uid" class="small">아이디</label><input type="text" id="uid" class="field" autocomplete="username" required autofocus>
      <label for="pw" class="small">비밀번호</label><input type="password" id="pw" class="field" autocomplete="current-password" required>
      ${needCodeLogin?`<div class="adm"><b>확인 코드</b><span class="small">학습 자료가 갱신되어 한 번만 다시 필요해요.</span><input type="password" id="lcode" class="field" inputmode="numeric" autocomplete="off" required aria-label="확인 코드"></div>`:""}`
    :`
      <label for="nid" class="small">새 아이디</label><input type="text" id="nid" class="field" autocomplete="username" maxlength="20" required autofocus>
      <label for="npw" class="small">새 비밀번호 (6자 이상)</label><input type="password" id="npw" class="field" autocomplete="new-password" minlength="6" required>
      <label for="npw2" class="small">새 비밀번호 확인</label><input type="password" id="npw2" class="field" autocomplete="new-password" minlength="6" required>
      ${needCode?`<div class="adm"><b>확인 코드</b><span class="small">이 기기에서 처음 가입할 때만 필요해요.</span><input type="password" id="vcode" class="field" inputmode="numeric" autocomplete="off" required aria-label="확인 코드"></div>`:`<p class="small muted" style="margin:0">인증된 기기라 바로 가입할 수 있어요.</p>`}`}
    <label class="check"><input type="checkbox" id="remember" checked> 이 기기에서 자동 로그인</label>
    <p class="err" id="err"></p>
    <button class="btn pri" id="go-btn" type="submit" style="padding:12px">${mode==="login"?"로그인":"가입하고 시작하기"}</button>
  </form>`;
  m.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>showLock(b.dataset.lm));
  m.querySelector("#lock").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=m.querySelector("#go-btn"),err=m.querySelector("#err"),keep=m.querySelector("#remember").checked,label=btn.textContent;
    const fail=msg=>{btn.disabled=false;btn.textContent=label;err.textContent=msg;};
    btn.disabled=true;btn.textContent="잠시만요…";err.textContent="";
    try{
      if(mode==="login"){const lc=m.querySelector("#lcode");await doLogin(norm(m.querySelector("#uid").value),m.querySelector("#pw").value,keep,lc?norm(lc.value):"");}
      else{
        const id=norm(m.querySelector("#nid").value),pw=m.querySelector("#npw").value,pw2=m.querySelector("#npw2").value;
        if(!id)return fail("새 아이디를 넣어 주세요.");
        if(id==="관리자")return fail("이 아이디는 쓸 수 없어요.");
        if(pw.length<6)return fail("비밀번호는 6자 이상으로 정해 주세요.");
        if(pw!==pw2)return fail("두 비밀번호가 달라요.");
        await doSignup(id,pw,needCode?norm(m.querySelector("#vcode").value):"",keep);
      }
    }catch(x){const msg=(x&&x.message)||"";if(needCodeLogin&&!m.querySelector("#lcode")){showLock("login");const e2=document.getElementById("err");if(e2)e2.textContent=msg;return;}fail(msg||"열쇠를 푸는 데 실패했어요. 비밀번호를 다시 확인해 주세요.");}
  });
}
(async()=>{
  const main=document.getElementById("main");
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){main.innerHTML=`<p class="loading">브라우저가 오래됐어요. 최신 크롬·사파리·엣지에서 열어 주세요.</p>`;return;}
  try{const r=await fetch("content.bin",{cache:"no-cache"});if(!r.ok)throw 0;BLOB=await r.arrayBuffer();try{const t=await fetch("tax.json",{cache:"no-cache"});if(t.ok)TAX=await t.json();}catch(e){}}
  catch(e){main.innerHTML=`<p class="loading">자료를 못 불러왔어요. 인터넷 연결을 확인하고 새로 고쳐 주세요.</p>`;return;}
  let saved=null,auto=null;try{saved=localStorage.getItem(BASE+":key");auto=localStorage.getItem(BASE+":auto");}catch(e){}
  if(saved){
    try{const raw=b64d(saved);if(await keyWorks(raw))RAWKEY=raw;else throw 0;}
    catch(e){try{localStorage.removeItem(BASE+":key");}catch(x){}}
  }
  if(RAWKEY&&auto){
    try{const fb=await loadFB();
      const user=await new Promise(res=>{const off=fb.onAuthStateChanged(fb.auth,u=>{off();res(u);});});
      if(user){const snap=await fb.getDoc(fb.doc(fb.db,"users",user.uid));if(snap.exists()){await enterFB(user.uid,snap.data(),RAWKEY,true);return;}}
    }catch(e){}
  }
  showLock("login");
})();
